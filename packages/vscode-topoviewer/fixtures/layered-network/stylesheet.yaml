icons:
  router.pe:
    glyph: ""
    fill: "#1976d2"
    stroke: "#90caf9"
  router.p:
    glyph: ""
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  router.rr:
    glyph: ""
    fill: "#9c27b0"
    stroke: "#ce93d8"
  service:
    glyph: ""
    fill: "#ff9800"
    stroke: "#ffe0b2"
  ops:
    glyph: "!"
    fill: "#d32f2f"
    stroke: "#ffcdd2"
labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router.p
      shape: ellipse
      width: 96
      height: 76
      backgroundColor: "#ffffff"
      borderColor: "#94a3b8"
      borderWidth: 2
      labelColor: "#0f172a"
      labelFontSize: 12
      labelFontWeight: 800
      labelBackgroundColor: "#ffffff"
      labelPadding: 4
      metaColor: "transparent"
      statusColor: "#2e7d32"
      statusPlacement: topRight
      statusSize: 10
  - selector: node[labels.role = "pe"]
    style:
      icon: router.pe
      shape: hexagon
      borderColor: "#1976d2"
      underlayColor: "#bbdefb"
      underlayOpacity: 0.28
      underlayPadding: 8
  - selector: node[labels.role = "rr"]
    style:
      icon: router.rr
      shape: diamond
      width: 82
      height: 82
      borderColor: "#9c27b0"
      badgeLabel: RR
      badgeBackgroundColor: "#9c27b0"
      badgeColor: "#ffffff"
      badgeBorderColor: "#ce93d8"
  - selector: node[labels.role = "service"]
    style:
      icon: service
      shape: roundRectangle
      width: 126
      height: 64
      borderColor: "#ff9800"
      badgeLabel: VPN
      badgeBackgroundColor: "#ff9800"
      badgeColor: "#ffffff"
      badgeBorderColor: "#ffe0b2"
  - selector: node[labels.role = "ops"]
    style:
      icon: ops
      shape: octagon
      width: 82
      height: 82
      borderColor: "#d32f2f"
      labelColor: "#c62828"
      badgeLabel: OPS
      badgeBackgroundColor: "#d32f2f"
      badgeColor: "#ffffff"
      badgeBorderColor: "#ffcdd2"
  - selector: node[data.severity = "major"]
    style:
      statusColor: "#ff9800"
      outlineColor: "#ff9800"
      outlineWidth: 5
      outlineOpacity: 0.9
  - selector: link
    style:
      curveStyle: straight
      lineColor: "#64748b"
      lineWidth: 4
      targetArrowShape: none
      labelColor: "#475569"
      labelFontSize: 11
      textBackgroundColor: "#ffffff"
  - selector: link[labels.protocol = "bgp"]
    style:
      label: iBGP
      curveStyle: unbundled-bezier
      lineColor: "#9c27b0"
      lineWidth: 3
      lineStyle: dashed
      lineDashPattern: 7 7
      targetArrowShape: triangle
      targetArrowColor: "#9c27b0"
      textBackgroundColor: "#ffffff"
      labelColor: "#7b1fa2"
  - selector: link[labels.tenant = "payments"]
    style:
      label: access
      curveStyle: smooth-taxi
      lineColor: "#ff9800"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#ff9800"
      textBackgroundColor: "#ffffff"
      labelColor: "#e65100"
  - selector: link[labels.layer = "operations"]
    style:
      label: incident
      curveStyle: smooth-taxi
      lineColor: "#d32f2f"
      lineWidth: 4
      lineStyle: dashed
      lineDashPattern: 8 5
      targetArrowShape: triangle
      targetArrowColor: "#d32f2f"
      textBackgroundColor: "#ffffff"
      labelColor: "#c62828"
  - selector: path[labels.service = "payments"]
    style:
      label: service path
      curveStyle: smooth-taxi
      lineColor: "#0288d1"
      lineWidth: 4
      laneWidth: 8
      laneGap: 9
      targetArrowShape: triangle
      targetArrowColor: "#0288d1"
      textBackgroundColor: "#ffffff"
      labelColor: "#01579b"
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.08)"
      borderColor: "rgba(25, 118, 210, 0.34)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelFontSize: 12
      labelFontWeight: 800
      labelPosition: topCenter
      labelMargin: 12
      zIndex: -20
