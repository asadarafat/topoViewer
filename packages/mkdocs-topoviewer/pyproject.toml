[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-topoviewer"
version = "0.3.0"
description = "MkDocs plugin for embedding TopoViewer declarative topology diagrams."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Asad Arafat" }
]
keywords = [
  "mkdocs",
  "topology",
  "network",
  "diagram",
  "topoviewer"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Framework :: MkDocs",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation"
]
dependencies = [
  "mkdocs>=1.5,<2",
  "PyYAML>=6.0"
]

[project.urls]
Homepage = "https://github.com/asadarafat/topoviewer"
Repository = "https://github.com/asadarafat/topoviewer"
Issues = "https://github.com/asadarafat/topoviewer/issues"

[project.entry-points."mkdocs.plugins"]
topoviewer = "mkdocs_topoviewer.plugin:TopoViewerPlugin"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_topoviewer"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/MANIFEST.in",
  "/README.md",
  "/mkdocs_topoviewer",
  "/pyproject.toml"
]
