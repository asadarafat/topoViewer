  <style>
    :root {
      --bg: #0b1118;
      --chrome: #111820;
      --panel: #151d27;
      --panel-2: #1b2531;
      --panel-3: #202c39;
      --line: #2d3846;
      --line-soft: rgba(164, 179, 199, 0.16);
      --text: #e7edf4;
      --muted: #9aa8b8;
      --green: #53b66d;
      --cyan: #37a9d8;
      --orange: #d99b28;
      --pink: #d95478;
      --purple: #9b83d8;
      --blue: #2d8be8;
      --blue-strong: #3da1ff;
      --danger: #e45b6a;
      --shadow: rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 12% 10%, rgba(45, 139, 232, 0.20), transparent 26%),
        radial-gradient(circle at 82% 16%, rgba(55, 169, 216, 0.11), transparent 30%),

      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(380px, 34%) 1fr;
      width: 100%;
      height: 100%;
      padding: 10px;
      gap: 10px;
      background: rgba(5, 9, 14, 0.34);
    }

    .left,
    .right {
      min-width: 0;
      min-height: 0;
      position: relative;
    }

    .left {
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: color-mix(in srgb, var(--chrome) 94%, black 6%);
      box-shadow: 0 18px 44px var(--shadow);
    }

    .right {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background:

      box-shadow: 0 18px 44px var(--shadow);
    }

    header {

      background:

        var(--panel);

    h1 {
      margin: 0;
      color: #f4f7fb;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.1px;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .control-stack {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .control-block {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.025);

    .control-title {
      color: #c8d2de;
      font-size: 10px;
      font-weight: 720;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .action-grid,
    .layer-grid,

      display: flex;
      flex-wrap: wrap;
      gap: 8px;

    button {
      border: 1px solid #3a4655;
      border-radius: 4px;
      color: var(--text);
      background: linear-gradient(180deg, #243140, #1a2430);
      font: inherit;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);

    button.primary {
      border-color: #1f72bd;
      color: #f3f9ff;
      background: linear-gradient(180deg, #247fcf, #1768af);

      color: #ecfbff;
      background: linear-gradient(180deg, #224763, #18364e);

      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid #354150;
      border-radius: 4px;
      color: var(--muted);
      background: #17212c;
      font-size: 11px;
      cursor: pointer;
      user-select: none;

      color: #eef7ff;
      background: rgba(45, 139, 232, 0.22);
    }

      color: var(--muted);
      background: #101820;
      font-size: 11px;
      line-height: 1.4;

    .status.error {

      background: rgba(255, 92, 122, 0.12);

    .crash {

      width: 100%;
      height: 100%;
      padding: 24px;
      color: #ffd4dd;
      background: #0b1118;

      position: absolute;
      inset: 0;
      background: transparent;

      --xy-node-border-default: 1px solid rgba(164, 179, 199, 0.32);
      --xy-node-background-color-default: transparent;
      color: var(--text);

      color: #f2f2f2;

    .react-flow__minimap {
      background: rgba(11, 17, 24, 0.92);
      border: 1px solid var(--line);
      border-radius: 0;
      overflow: hidden;
    }

    .network-node {
      width: 82px;
      min-height: 60px;
      display: grid;
      justify-items: center;
      gap: 3px;
      padding: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      box-shadow: none;
      cursor: grab;
    }

    .network-node * {
      cursor: inherit;
    }

    .react-flow__node.dragging .network-node {
      cursor: grabbing;
    }

    .network-node .icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-weight: 900;
      font-size: 12px;

      border: 4px solid var(--node-stroke, #d9e0ea);

      font-weight: 620;
      font-size: 10px;
      line-height: 1.1;
      text-align: center;
    }

    .network-node .meta {
      color: #9db2cf;
      font-size: 8px;
      line-height: 1.15;
      text-align: center;
    }

    .region-node {
      width: 100%;
      height: 100%;
      border: 1px solid var(--region-stroke, rgba(55, 169, 216, 0.42));
      border-radius: 4px;
      background: var(--region-fill, rgba(76, 201, 240, 0.12));
      box-shadow: none;
      cursor: default;
    }

    .react-flow__node-region.draggable .region-node {
      cursor: grab;
    }

    .react-flow__node-region.dragging .region-node {
      cursor: grabbing;
    }

    .region-node .region-label {
      position: absolute;
      top: 12px;
      left: 18px;
      padding: 4px 7px;
      border: 1px solid var(--line-soft);
      border-radius: 3px;
      color: #f4f9ff;
      background: rgba(17, 24, 32, 0.82);
      font-size: 10px;
      font-weight: 720;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .react-flow__node-region {
      z-index: 0;
    }

    .react-flow__node-region:not(.draggable) {
      pointer-events: none !important;
    }

    .react-flow__edge {
      opacity: 1;
      filter: drop-shadow(0 0 3px rgba(5, 9, 14, 0.72));
    }

    .edge-label {
      padding: 3px 6px;
      border-radius: 3px;
      color: #eaf4ff;
      background: rgba(17, 24, 32, 0.86);
      border: 1px solid var(--line);
      font-size: 10px;
      font-weight: 650;
      box-shadow: 0 8px 18px var(--shadow);
    }

    .react-flow__handle {
      width: 1px;
      height: 1px;
      min-width: 1px;
      min-height: 1px;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 980px) {

        grid-template-rows: 45% 55%;
        padding: 8px;
      }

      .left {

  </style>

    window.__showPrototypeError = function showPrototypeError(error) {
      const root = document.getElementById('root');
      const detail = error && (error.stack || error.message || error.reason || String(error));
      if (root) {
        root.innerHTML = '';
        const pre = document.createElement('pre');
        pre.className = 'crash';
        pre.textContent = detail || 'Unknown prototype runtime error';
        root.appendChild(pre);
      }
    };
    window.addEventListener('error', (event) => window.__showPrototypeError(event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => window.__showPrototypeError(event.reason));
  </script>

            borderRadius,
            borderColor: style.borderColor || icon.stroke,
            borderWidth: style.borderWidth,
            backgroundColor: style.backgroundColor || icon.fill,
            color: style.iconColor
          }),
          labelStyle: withoutUndefined({
            color: style.labelColor,
            fontSize: style.labelFontSize,
            fontWeight: style.labelFontWeight
          }),
          metaStyle: withoutUndefined({
            color: style.metaColor,
            fontSize: style.metaFontSize,
            fontWeight: style.metaFontWeight
          })
        }
      };
    }

    function compileEdgeRenderStyle(style = {}, entity, spec, labelsEnabled) {
      const lineColor = style.lineColor || '#6ea8fe';
      const label = edgeLabel(entity, spec, labelsEnabled, style.label);
      const curveType = mapCurveStyle(style);
      const anchor = String(style.anchor || 'floating').toLowerCase();
      return withoutUndefined({
        type: anchor === 'floating' ? 'floating' : curveType,
        animated: !!style.animated,
        hidden: style.display === 'none',
        interactionWidth: valueOrDefault(style.interactionWidth, Math.max(12, Number(style.lineWidth || 2) + 10)),
        zIndex: style.zIndex,
        markerStart: mapArrowShape(style.sourceArrowShape, style.arrowColor || lineColor),
        markerEnd: mapArrowShape(style.targetArrowShape, style.arrowColor || lineColor),
        label: label || undefined,
        labelStyle: withoutUndefined({
          fill: style.labelColor,
          fontSize: style.labelFontSize,
          fontWeight: style.labelFontWeight
        }),
        labelShowBg: style.textBackgroundColor !== undefined ? true : undefined,
        labelBgStyle: withoutUndefined({
          fill: colorWithOpacity(style.textBackgroundColor, style.textBackgroundOpacity)
        }),
        labelBgPadding: style.textBackgroundPadding,
        labelBgBorderRadius: style.textBackgroundBorderRadius,
        data: {
          anchor,
          curveType
        },
        style: withoutUndefined({
          stroke: lineColor,
          strokeWidth: style.lineWidth,
          strokeDasharray: mapLineDash(style),
          opacity: style.opacity
        })
      });
    }

    function compileRegionRenderStyle(style = {}, bounds) {
      const borderWidth = valueOrDefault(style.borderWidth, 1);
      const shape = String(style.shape || 'roundrectangle').toLowerCase();
      const borderRadius = shape === 'rectangle' ? 0 : shape === 'ellipse' ? '50%' : 4;
      return {
        flow: withoutUndefined({
          type: 'region',
          selectable: style.selectable === true,
          draggable: style.draggable === true,
          dragHandle: style.draggable === true ? '.region-drag-handle' : undefined,
          hidden: style.display === 'none' ? true : undefined,
          width: bounds.width,
          height: bounds.height,
          zIndex: valueOrDefault(style.zIndex, -20),
          style: withoutUndefined({
            width: bounds.width,
            height: bounds.height,
            zIndex: valueOrDefault(style.zIndex, -20),
            opacity: style.opacity
          })
        }),
        data: {
          fill: style.backgroundColor || 'rgba(76, 201, 240, 0.12)',
          stroke: style.borderColor || 'rgba(76, 201, 240, 0.62)',
          borderWidth,
          borderRadius,
          labelStyle: withoutUndefined({
            color: style.labelColor,
            background: style.labelBackgroundColor
          })
        }
      };
    }

    function normalizePosition(position) {
      if (Array.isArray(position)) return { x: Number(position[0] || 0), y: Number(position[1] || 0) };
      if (position && typeof position === 'object') return { x: Number(position.x || 0), y: Number(position.y || 0) };
      return { x: 0, y: 0 };
    }

    function regionBounds(region, nodeById, regions = []) {
      const points = (region.members || [])
        .map((id) => nodeById.get(id))
        .filter(Boolean)
        .map((node) => normalizePosition(node.position));
      if (!points.length) return null;
      const padding = region.padding ?? 88;
      const nestingHeader = regions.some((candidate) => candidate.parent === region.id) ? 88 : 0;
      const xs = points.map((point) => point.x);
      const ys = points.map((point) => point.y);
      const minX = Math.min(...xs) - padding;
      const minY = Math.min(...ys) - padding - nestingHeader;
      const maxX = Math.max(...xs) + padding + 88;
      const maxY = Math.max(...ys) + padding + 74;
      return {
        x: minX,
        y: minY,
        width: Math.max(180, maxX - minX),
        height: Math.max(120, maxY - minY)
      };
    }

    function unionBounds(boundsList) {
      const validBounds = boundsList.filter(Boolean);
      if (!validBounds.length) return null;
      const minX = Math.min(...validBounds.map((bounds) => bounds.x));
      const minY = Math.min(...validBounds.map((bounds) => bounds.y));
      const maxX = Math.max(...validBounds.map((bounds) => bounds.x + bounds.width));
      const maxY = Math.max(...validBounds.map((bounds) => bounds.y + bounds.height));
      return {
        x: minX,
        y: minY,
        width: maxX - minX,
        height: maxY - minY
      };
    }

    function expandBounds(bounds, padding) {
      if (!bounds) return null;
      return {
        x: bounds.x - padding,
        y: bounds.y - padding,
        width: bounds.width + padding * 2,
        height: bounds.height + padding * 2
      };
    }

    function regionDepth(region, regionById) {
      let depth = 0;
      let current = region;
      const seen = new Set();
      while (current?.parent && !seen.has(current.parent)) {
        seen.add(current.parent);
        const parent = regionById.get(current.parent);
        if (!parent) break;
        depth += 1;
        current = parent;
      }
      return depth;
    }

    function buildRegionBoundsMap(regions, layers, nodeById) {
      const visibleRegions = (regions || []).filter((region) => intersects(region.layers, layers));
      const regionById = new Map(visibleRegions.map((region) => [region.id, region]));
      const childrenByParentId = visibleRegions.reduce((children, region) => {
        if (!region.parent) return children;
        const current = children.get(region.parent) || [];
        current.push(region.id);
        children.set(region.parent, current);
        return children;
      }, new Map());
      const boundsById = new Map();
      const deepestFirst = [...visibleRegions].sort((a, b) => regionDepth(b, regionById) - regionDepth(a, regionById));

      deepestFirst.forEach((region) => {
        const ownBounds = regionBounds(region, nodeById, regions || []);
        const childBounds = (childrenByParentId.get(region.id) || []).map((childId) => boundsById.get(childId));
        const mergedBounds = unionBounds([ownBounds, ...childBounds]);
        if (!mergedBounds) return;
        const parentPadding = childBounds.some(Boolean) ? Number(region.parentPadding ?? 42) : 0;
        boundsById.set(region.id, expandBounds(mergedBounds, parentPadding));
      });

      return boundsById;
    }

    function createRegionNode(region, bounds, visualStyle, spec) {
      const rendered = compileRegionRenderStyle(visualStyle, bounds, spec);
      return {
        ...rendered.flow,
        id: `region:${region.id}`,
        type: rendered.flow.type || 'region',
        position: { x: bounds.x, y: bounds.y },
        data: {
          ...region,
          ...(region.data || {}),
          ...rendered.data
        },
        style: { ...(rendered.flow.style || {}) }
      };
    }

    function isDraggableRegion(region, spec) {
      return applyStyle('region', region, spec).draggable === true;
    }

    function buildRegionNodes(regions, layers, nodeById, spec) {
      const boundsById = buildRegionBoundsMap(regions || [], layers, nodeById);
      return (regions || []).flatMap((region) => {
        if (!intersects(region.layers, layers)) return [];
        const bounds = boundsById.get(region.id);
        const visualStyle = applyStyle('region', region, spec);
        return bounds ? [createRegionNode(region, bounds, visualStyle, spec)] : [];
      });
    }

    function withDynamicRegions(networkNodes, compiled) {
      const nonRegionNodes = networkNodes.filter((node) => node.type !== 'region');
      const nodeById = new Map(nonRegionNodes.map((node) => [node.id, node]));
      const regionNodes = compiled.showRegions
        ? buildRegionNodes(compiled.regions, new Set(compiled.layers), nodeById, compiled.spec)
        : [];
      return [...regionNodes, ...nonRegionNodes];
    }

    function styledNodeDimensions(entity, spec) {
      const style = applyStyle('node', entity, spec);
      return {
        width: valueOrDefault(style.width, 82),
        height: valueOrDefault(style.height, 60)
      };
    }

    function childNodePosition(child, parent, siblingIndex, spec) {
      const parentBox = styledNodeDimensions(parent || {}, spec);
      const childBox = styledNodeDimensions(child, spec);
      return {
        x: (parentBox.width - childBox.width) / 2,
        y: parentBox.height + 14 + siblingIndex * (childBox.height + 14)
      };
    }

    function regionIdFromNodeId(nodeId = '') {
      return nodeId.replace(/^region:/, '');
    }

    function regionDragDeltas(changes, currentNodes) {
      const nodeById = new Map(currentNodes.map((node) => [node.id, node]));
      return changes.reduce((deltas, change) => {
        if (change.type !== 'position' || !change.id?.startsWith('region:') || !change.position) return deltas;
        const current = nodeById.get(change.id);
        if (!current) return deltas;
        const currentPosition = normalizePosition(current.position);
        const dx = change.position.x - currentPosition.x;
        const dy = change.position.y - currentPosition.y;
        if (dx === 0 && dy === 0) return deltas;
        deltas.set(regionIdFromNodeId(change.id), { dx, dy });
        return deltas;
      }, new Map());
    }

    function translateRegionMembers(nodes, deltas, compiled) {
      if (!deltas.size) return nodes;
      const regionById = new Map((compiled.regions || []).map((region) => [region.id, region]));
      const movementByNodeId = new Map();
      deltas.forEach(({ dx, dy }, regionId) => {
        const region = regionById.get(regionId);
        (region?.members || []).forEach((memberId) => {
          const current = movementByNodeId.get(memberId) || { dx: 0, dy: 0 };
          movementByNodeId.set(memberId, { dx: current.dx + dx, dy: current.dy + dy });
        });
      });
      return nodes.map((node) => {
        if (node.type === 'region') return node;
        const movement = movementByNodeId.get(node.id);
        if (!movement) return node;
        const position = normalizePosition(node.position);
        return {
          ...node,
          position: {
            x: position.x + movement.dx,
            y: position.y + movement.dy
          }
        };
      });
    }

    function compileFlow(spec, selectedLayerIds, toggles) {
      const graph = spec.graph || {};
      const layers = layerSetFor(selectedLayerIds);
      const includedNodeIds = new Set();
      const graphNodes = graph.nodes || [];
      const graphNodeById = new Map(graphNodes.map((node) => [node.id, node]));
      const visibleSourceNodeIds = new Set(graphNodes.filter((node) => intersects(node.layers, layers)).map((node) => node.id));
      const childCountByParentId = new Map();
      const networkNodes = [];

      graphNodes.forEach((node) => {
        if (!intersects(node.layers, layers)) return;
        includedNodeIds.add(node.id);
        const parentNode = graphNodeById.get(node.parent);
        const shouldContain = toggles.showServicesInsideNodes && node.parent && visibleSourceNodeIds.has(node.parent);
        const siblingIndex = shouldContain ? childCountByParentId.get(node.parent) || 0 : 0;
        if (shouldContain) childCountByParentId.set(node.parent, siblingIndex + 1);
        const visualStyle = applyStyle('node', node, spec);
        const rendered = compileNodeRenderStyle(visualStyle, node, spec);
        const nodeData = mergePlainObjects(
          { ...node, ...(node.data || {}) },
          rendered.data || {}
        );
        networkNodes.push({
          ...rendered.flow,
          id: node.id,
          type: rendered.flow.type || 'network',
          dataParentId: shouldContain ? node.parent : undefined,
          position: shouldContain ? childNodePosition(node, parentNode, siblingIndex, spec) : normalizePosition(node.position),
          data: nodeData,
          style: { ...(rendered.flow.style || {}) },
          zIndex: rendered.flow.zIndex ?? 10
        });
      });

      const visibleNodeById = new Map(networkNodes.map((node) => [node.id, node]));
      const regionNodes = toggles.showRegions !== false
        ? buildRegionNodes(graph.regions || [], layers, visibleNodeById, spec)
        : [];
      const parentedNetworkNodes = networkNodes.map((node) => {
        if (node.dataParentId) {
          const { dataParentId, ...rest } = node;
          return { ...rest, parentId: dataParentId };
        }
        const { dataParentId, ...rest } = node;
        return rest;
      });

      const flowEdges = [];
      (graph.links || []).forEach((link) => {
        if (!intersects(link.layers, layers)) return;
        if (!includedNodeIds.has(link.source) || !includedNodeIds.has(link.target)) return;
        const visualStyle = applyStyle('link', link, spec);
        const rendered = compileEdgeRenderStyle(visualStyle, link, spec, toggles.showEdgeLabels);
        const edgeData = mergePlainObjects(
          { ...link, ...(link.data || {}) },
          rendered.data || {}
        );
        flowEdges.push({
          ...rendered,
          id: link.id,
          source: link.source,
          target: link.target,
          data: edgeData
        });
      });

      (graph.paths || []).forEach((path) => {
        if (!intersects(path.layers, layers)) return;
        for (let index = 0; index < path.sequence.length - 1; index += 1) {
          const source = path.sequence[index];
          const target = path.sequence[index + 1];
          if (!includedNodeIds.has(source) || !includedNodeIds.has(target)) continue;
          const visualStyle = applyStyle('path', path, spec);
          const rendered = compileEdgeRenderStyle(visualStyle, path, spec, toggles.showEdgeLabels);
          const edgeData = mergePlainObjects(
            { ...path, ...(path.data || {}) },
            rendered.data || {}
          );
          flowEdges.push({
            ...rendered,
            id: `${path.id}:${index}`,
            source,
            target,
            data: edgeData
          });
        }
      });

      return {
        nodes: [...regionNodes, ...parentedNetworkNodes],
        edges: flowEdges,
        layers: Array.from(layers).sort(),
        regions: graph.regions || [],
        showRegions: toggles.showRegions !== false,
        spec
      };
    }

    function FlowCanvas({ compiled }) {
      const [nodes, setNodes] = useNodesState(compiled.nodes);
      const [edges, setEdges, onEdgesChange] = useEdgesState(compiled.edges);

      React.useEffect(() => {
        setNodes(compiled.nodes);
        setEdges(compiled.edges);
      }, [compiled, setNodes, setEdges]);

      const onNodesChange = useCallback((changes) => {
        setNodes((currentNodes) => {
          const regionDeltas = regionDragDeltas(changes, currentNodes);
          const changedNodes = applyNodeChanges(changes, currentNodes);
          const translatedNodes = translateRegionMembers(changedNodes, regionDeltas, compiled);
          return withDynamicRegions(translatedNodes, compiled);
        });
      }, [compiled, setNodes]);

      return React.createElement(ReactFlow, {
        nodes,
        edges,
        onNodesChange,
        onEdgesChange,
        nodeTypes,
        edgeTypes,
        fitView: true,
        fitViewOptions: { padding: 0.08 },
        minZoom: 0.2,
        maxZoom: 2.2,
        nodesDraggable: true,
        elementsSelectable: true,
        proOptions: { hideAttribution: true }
      },
        React.createElement(Background, { color: 'rgba(126, 139, 154, 0.20)', gap: 24 })
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }

      static getDerivedStateFromError(error) {
        return { error };
      }

      componentDidCatch(error, info) {
        console.error(error, info);
      }

      render() {
        if (!this.state.error) return this.props.children;
        const detail = this.state.error.stack || this.state.error.message || String(this.state.error);
        return React.createElement('pre', { className: 'crash' }, detail);
      }
    }

    function composeSpec(topologyDoc, stylesheetDoc) {
      return {
        ...(topologyDoc || {}),
        ...(stylesheetDoc || {}),
        graph: topologyDoc?.graph || {},
        toggles: topologyDoc?.toggles || []
      };
    }

    function parseInitialSpec() {
      return composeSpec(jsyaml.load(initialTopologyYaml), jsyaml.load(initialStylesheetYaml));
    }

    function App() {
      const [activeEditorTab, setActiveEditorTab] = useState('topology');
      const [topologyYamlText, setTopologyYamlText] = useState(initialTopologyYaml);
      const [stylesheetYamlText, setStylesheetYamlText] = useState(initialStylesheetYaml);
      const [parsed, setParsed] = useState(() => parseInitialSpec());
      const [status, setStatus] = useState({ type: 'ok', text: 'Live YAML parsed. Edit either tab to update the rendered view.' });
      const [selectedLayers, setSelectedLayers] = useState(() => defaultLayerIds(parseInitialSpec()));
      const [toggleState, setToggleState] = useState(() => {
        const spec = parseInitialSpec();
        return Object.fromEntries((spec.toggles || []).map((toggle) => [toggle.id, toggle.default !== false]));
      });

      const compiled = useMemo(() => compileFlow(parsed, selectedLayers, toggleState), [parsed, selectedLayers, toggleState]);

      const applyYaml = useCallback(() => {
        try {
          const next = composeSpec(jsyaml.load(topologyYamlText), jsyaml.load(stylesheetYamlText));
          const validLayerIds = new Set(next.graph?.layers?.map((layer) => layer.id) || []);
          setParsed(next);
          setSelectedLayers((currentLayers) => {
            const retainedLayers = currentLayers.filter((layerId) => validLayerIds.has(layerId));
            return retainedLayers.length ? retainedLayers : defaultLayerIds(next);
          });
          setToggleState((currentToggles) => Object.fromEntries((next.toggles || []).map((toggle) => [
            toggle.id,
            currentToggles[toggle.id] ?? toggle.default !== false
          ])));
          setStatus({ type: 'ok', text: `Live rendered ${next.graph?.nodes?.length || 0} nodes, ${next.graph?.links?.length || 0} links, ${next.graph?.paths?.length || 0} paths, ${next.graph?.regions?.length || 0} regions.` });
        } catch (error) {
          setStatus({ type: 'error', text: error.message });
        }
      }, [topologyYamlText, stylesheetYamlText]);

      useEffect(() => {
        const timer = window.setTimeout(applyYaml, 250);
        return () => window.clearTimeout(timer);
      }, [applyYaml]);

      const layerCatalog = parsed.graph?.layers || [];

      const setAllLayers = useCallback(() => {
        setSelectedLayers(layerCatalog.map((layer) => layer.id));
      }, [layerCatalog]);

      const setNoLayers = useCallback(() => {
        setSelectedLayers([]);
      }, []);

      const toggleLayer = useCallback((layerId, checked) => {
        setSelectedLayers((current) => {
          const next = new Set(current);
          if (checked) next.add(layerId);
          else next.delete(layerId);
          return Array.from(next);
        });
      }, []);

      return React.createElement('div', { className: 'app' },
        React.createElement('section', { className: 'left' },
          React.createElement('header', null,
            React.createElement('h1', null, 'Declarative YAML to React Flow'),
            React.createElement('div', { className: 'subtitle' }, 'Authoring model: graph facts plus a Cytoscape-style selector stylesheet. React Flow is only the rendering engine.'),
            React.createElement('div', { className: 'control-stack' },
              React.createElement('div', { className: 'control-block' },
                React.createElement('div', { className: 'control-title' }, 'Actions'),
                React.createElement('div', { className: 'action-grid' },
                  React.createElement('button', { className: 'primary', onClick: applyYaml }, 'Apply now'),
                  React.createElement('button', { className: selectedLayers.length === layerCatalog.length ? 'active' : '', onClick: setAllLayers }, 'All layers'),
                  React.createElement('button', { className: selectedLayers.length === 0 ? 'active' : '', onClick: setNoLayers }, 'No layers')
                )
              ),
              React.createElement('div', { className: 'control-block' },
                React.createElement('div', { className: 'control-title' }, 'Layers'),
                React.createElement('div', { className: 'layer-grid' },
                  layerCatalog.map((layer) => {
                    const checked = selectedLayers.includes(layer.id);
                    return React.createElement('label', { className: `layer-chip ${checked ? 'active' : ''}`, key: layer.id },
                      React.createElement('input', {
                        type: 'checkbox',
                        checked,
                        onChange: (event) => toggleLayer(layer.id, event.target.checked)
                      }),
                      displayName(layer)
                    );
                  })
                )
              ),
              React.createElement('div', { className: 'control-block' },
                React.createElement('div', { className: 'control-title' }, 'Display knobs'),
                React.createElement('div', { className: 'toggles' },
                  (parsed.toggles || []).map((toggle) => {
                    const checked = !!toggleState[toggle.id];
                    return React.createElement('label', { className: `toggle ${checked ? 'active' : ''}`, key: toggle.id },
                      React.createElement('input', {
                        type: 'checkbox',
                        checked,
                        onChange: (event) => setToggleState((current) => ({ ...current, [toggle.id]: event.target.checked }))
                      }),
                      displayName(toggle)
                    );
                  })
                )
              )
            )
          ),
          React.createElement('div', { className: 'editor-panel' },
            React.createElement('div', { className: 'editor-tabs' },
              React.createElement('button', {
                className: `editor-tab ${activeEditorTab === 'topology' ? 'active' : ''}`,
                onClick: () => setActiveEditorTab('topology')
              }, 'Topology YAML'),
              React.createElement('button', {
                className: `editor-tab ${activeEditorTab === 'stylesheet' ? 'active' : ''}`,
                onClick: () => setActiveEditorTab('stylesheet')
              }, 'Stylesheet YAML')
            ),
            React.createElement('textarea', {
              value: activeEditorTab === 'topology' ? topologyYamlText : stylesheetYamlText,
              spellCheck: false,
              onChange: (event) => {
                if (activeEditorTab === 'topology') setTopologyYamlText(event.target.value);
                else setStylesheetYamlText(event.target.value);
              }
            })
          ),
          React.createElement('div', { className: `status ${status.type === 'error' ? 'error' : ''}` }, status.text)
        ),
        React.createElement('section', { className: 'right' },
          React.createElement('div', { className: 'network-viewport' },
            React.createElement('div', { className: 'flow-shell' },
              React.createElement(ReactFlowProvider, null,
                React.createElement(FlowCanvas, { compiled })
              )
            )
          )
        )
      );
    }

    createRoot(document.getElementById('root')).render(
      React.createElement(ErrorBoundary, null, React.createElement(App))
    );
  </script>
</body>
</html>
