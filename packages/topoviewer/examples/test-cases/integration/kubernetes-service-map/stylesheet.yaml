layout:
  mode: manual
  width: 980
  height: 460
icons:
  cloud:
    glyph: WAN
    fill: "#0288d1"
    stroke: "#b3e5fc"
  gateway:
    glyph: GW
    fill: "#1976d2"
    stroke: "#bbdefb"
  web:
    glyph: WEB
    fill: "#9c27b0"
    stroke: "#e1bee7"
  api:
    glyph: API
    fill: "#2e7d32"
    stroke: "#c8e6c9"
  worker:
    glyph: W
    fill: "#ed6c02"
    stroke: "#ffe0b2"
  redis:
    glyph: R
    fill: "#d32f2f"
    stroke: "#ffcdd2"
  postgres:
    glyph: DB
    fill: "#01579b"
    stroke: "#b3e5fc"
  queue:
    glyph: Q
    fill: "#7b1fa2"
    stroke: "#e1bee7"
labelFields:
  - name
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.08)"
      borderColor: "rgba(25, 118, 210, 0.34)"
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelZIndex: 8
  - selector: node
    style:
      shape: rectangle
      width: 112
      height: 62
      borderWidth: 3
      icon: api
      iconFit: contain
      labelPosition: bottom
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      labelTextMaxWidth: 136
      labelTextWrap: none
      labelYOffset: 8
      labelZIndex: 10
      metaColor: transparent
  - selector: node[labels.kind = "external"]
    style:
      icon: cloud
      shape: ellipse
      width: 96
      height: 64
      borderColor: "#4fc3f7"
  - selector: node[labels.kind = "gateway"]
    style:
      icon: gateway
      borderColor: "#42a5f5"
  - selector: node[labels.kind = "frontend"]
    style:
      icon: web
      borderColor: "#ce93d8"
  - selector: node[labels.kind = "backend"]
    style:
      icon: api
      borderColor: "#81c784"
  - selector: node[labels.kind = "worker"]
    style:
      icon: worker
      borderColor: "#ffb74d"
  - selector: node[labels.kind = "cache"]
    style:
      icon: redis
      borderColor: "#ef9a9a"
  - selector: node[labels.kind = "database"]
    style:
      icon: postgres
      borderColor: "#4fc3f7"
  - selector: node[labels.kind = "queue"]
    style:
      icon: queue
      borderColor: "#ba68c8"
  - selector: node[data.severity = "warning"]
    style:
      statusColor: "#ff9800"
      statusPlacement: topRight
      outlineColor: "#ff9800"
      outlineWidth: 5
      outlineOpacity: 0.7
  - selector: link
    style:
      curveStyle: smoothTaxi
      lineColor: "#42a5f5"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#42a5f5"
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.kind = "dependency"]
    style:
      lineColor: "#4caf50"
      targetArrowColor: "#4caf50"
  - selector: link[labels.kind = "async"]
    style:
      lineColor: "#ff9800"
      targetArrowColor: "#ff9800"
      lineStyle: dashed
      lineDashPattern: 8 6
  - selector: link[labels.kind = "write"]
    style:
      lineColor: "#0288d1"
      targetArrowColor: "#0288d1"
