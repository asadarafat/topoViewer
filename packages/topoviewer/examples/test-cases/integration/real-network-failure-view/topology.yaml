graph:
  id: product-story-network
  layers:
    - id: underlay
      name: Underlay
    - id: bgp
      name: BGP
    - id: transport
      name: Transport
    - id: service
      name: Service
    - id: operations
      name: Operations
  nodes:
    - id: ce-fra
      name: CE-FRA
      labels:
        role: ce
        site: fra
        tenant: payments
      data:
        status: ok
      layers: [service]
      position: [48, 382]
    - id: pe-fra-1
      name: FRA-PE1
      labels:
        role: pe
        site: fra
      data:
        status: ok
      layers: [underlay, bgp, transport, service, operations]
      position: [160, 250]
    - id: p-ams-1
      name: AMS-P1
      labels:
        role: p
        site: ams
      data:
        status: ok
      layers: [underlay, transport, service, operations]
      position: [380, 250]
    - id: rr-ams-1
      name: AMS-RR1
      labels:
        role: rr
        site: ams
        protocol: bgp
      data:
        status: ok
      layers: [bgp]
      position: [490, 108]
    - id: p-par-1
      name: PAR-P1
      labels:
        role: p
        site: par
      data:
        status: critical
        severity: critical
      layers: [underlay, transport, service, operations]
      position: [600, 250]
    - id: pe-lon-1
      name: LON-PE1
      labels:
        role: pe
        site: lon
      data:
        status: degraded
        severity: major
      layers: [underlay, bgp, transport, service, operations]
      position: [820, 250]
    - id: ce-lon
      name: CE-LON
      labels:
        role: ce
        site: lon
        tenant: payments
      data:
        status: ok
      layers: [service]
      position: [932, 382]
  links:
    - id: access-fra
      name: Payments CE to FRA PE
      source: ce-fra
      target: pe-fra-1
      labels:
        layer: service
        tenant: payments
      layers: [service]
      data:
        status: ok
    - id: underlay-fra-ams
      name: FRA to AMS 400G
      source: pe-fra-1
      target: p-ams-1
      labels:
        layer: underlay
        media: fiber
      layers: [underlay]
      data:
        capacity: 400G
        status: ok
    - id: underlay-ams-par
      name: AMS to PAR 400G
      source: p-ams-1
      target: p-par-1
      labels:
        layer: underlay
        media: fiber
      layers: [underlay]
      data:
        capacity: 400G
        status: critical
        severity: critical
    - id: underlay-par-lon
      name: PAR to LON 400G
      source: p-par-1
      target: pe-lon-1
      labels:
        layer: underlay
        media: fiber
      layers: [underlay]
      data:
        capacity: 400G
        status: degraded
        severity: major
    - id: bgp-fra-rr
      name: FRA PE to route reflector
      source: pe-fra-1
      target: rr-ams-1
      labels:
        layer: control
        protocol: bgp
      layers: [bgp]
      data:
        status: established
    - id: bgp-lon-rr
      name: LON PE to route reflector
      source: pe-lon-1
      target: rr-ams-1
      labels:
        layer: control
        protocol: bgp
      layers: [bgp]
      data:
        status: established
    - id: access-lon
      name: LON PE to Payments CE
      source: pe-lon-1
      target: ce-lon
      labels:
        layer: service
        tenant: payments
      layers: [service]
      data:
        status: ok
  paths:
    - id: transport-fra-lon-primary
      name: FRA to LON SR Policy
      labels:
        layer: transport
        path: transport
        protocol: sr-te
      layers: [transport]
      data:
        status: active
        bandwidthReserved: 80G
        latencyMs: 11.8
      sequence:
        - pe-fra-1
        - p-ams-1
        - p-par-1
        - pe-lon-1
    - id: payments-primary
      name: Payments L3VPN primary
      source: ce-fra
      target: ce-lon
      parent: transport-fra-lon-primary
      labels:
        path: service
        service: payments
        type: l3vpn
      layers: [service]
      data:
        status: degraded
        severity: critical
        vpnId: payments
        bandwidth: 20G
      sequence:
        - ce-fra
        - pe-fra-1
        - p-ams-1
        - p-par-1
        - pe-lon-1
        - ce-lon
  regions:
    - id: fra-metro
      name: Frankfurt edge
      labels:
        site: fra
      layers: [underlay]
      members:
        - pe-fra-1
      paddingX: 28
      paddingY: 24
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
    - id: transit-core
      name: Transit core
      labels:
        site: core
      layers: [underlay]
      members:
        - p-ams-1
        - p-par-1
      paddingX: 34
      paddingY: 28
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
    - id: lon-metro
      name: London edge
      labels:
        site: lon
      layers: [underlay]
      members:
        - pe-lon-1
      paddingX: 28
      paddingY: 24
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
