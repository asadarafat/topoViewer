graph:
  id: vscode-attention-workflow
  layers:
    - id: underlay
      name: Underlay
    - id: service
      name: Service
    - id: operations
      name: Operations
  nodes:
    - id: pe-a
      name: PE-A
      labels:
        role: pe
        site: a
      data:
        status: ok
      layers: [underlay, service]
      position: [130, 260]
    - id: p-core
      name: P-Core
      labels:
        role: p
      data:
        status: ok
      layers: [underlay]
      position: [330, 260]
    - id: pe-b
      name: PE-B
      labels:
        role: pe
        site: b
      data:
        status: warning
      layers: [underlay, service, operations]
      position: [530, 260]
    - id: payment-svc
      name: Payment VPN
      labels:
        role: service
      data:
        tenant: payments
      layers: [service]
      position: [330, 410]
    - id: noc
      name: NOC
      labels:
        role: ops
      data:
        severity: major
      layers: [operations]
      position: [690, 120]
  links:
    - id: transport-1
      name: Transport 1
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
      layers: [underlay]
    - id: transport-2
      name: Transport 2
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
      layers: [underlay]
    - id: transport-3
      name: Transport 3
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
      layers: [underlay]
    - id: core-to-b
      name: Core to B
      source: p-core
      target: pe-b
      labels:
        layer: underlay
      layers: [underlay]
    - id: service-a
      name: Service A
      source: payment-svc
      target: pe-a
      labels:
        layer: service
      layers: [service]
    - id: service-b
      name: Service B
      source: payment-svc
      target: pe-b
      labels:
        layer: service
      layers: [service]
    - id: ops-b
      name: Incident
      source: noc
      target: pe-b
      labels:
        layer: operations
      layers: [operations]
      data:
        severity: major
  paths:
    - id: payment-path
      name: Payment path
      labels:
        service: payments
      layers: [service]
      sequence: [pe-a, p-core, pe-b]
  regions:
    - id: core-region
      name: Core Region
      labels:
        scope: underlay
      layers: [underlay]
      members: [pe-a, p-core, pe-b]
      paddingX: 36
      paddingY: 32
      headerPadding: 34
attention:
  query:
    pathIds: [payment-path]
    mode: dim-context
  aggregate:
    groups:
      - id: summary-core
        by: region
        regionId: core-region
    expandOnClick: true
  links:
    grouping:
      threshold: 2
layout:
  mode: manual
  width: 820
  height: 520
