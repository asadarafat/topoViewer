graph:
  id: vscode-dense-links
  layers:
    - id: transport
      name: Transport
    - id: observability
      name: Observability
  nodes:
    - id: a
      name: Router A
      labels:
        role: router
      data:
        status: ok
      layers: [transport]
      position: [170, 250]
    - id: b
      name: Router B
      labels:
        role: router
      data:
        status: ok
      layers: [transport, observability]
      position: [470, 250]
    - id: telemetry
      name: Telemetry
      labels:
        role: ops
      data:
        status: active
      layers: [observability]
      position: [320, 410]
  links:
    - id: a-b-1
      name: Link 1
      source: a
      target: b
      labels:
        bundle: a-b
      layers: [transport]
    - id: a-b-2
      name: Link 2
      source: a
      target: b
      labels:
        bundle: a-b
      layers: [transport]
    - id: a-b-3
      name: Link 3
      source: a
      target: b
      labels:
        bundle: a-b
      layers: [transport]
    - id: telemetry-b
      name: Telemetry feed
      source: telemetry
      target: b
      labels:
        layer: observability
      layers: [observability]
attention:
  links:
    grouping:
      threshold: 2
layout:
  mode: manual
  width: 700
  height: 500
