layout:
  mode: manual
  width: 640
  height: 320
icons:
  wideSignal:
    alt: Wide signal icon used to compare iconFit modes
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" width="180" height="54" viewBox="0 0 180 54" preserveAspectRatio="none">
        <rect width="180" height="54" rx="8" fill="#0f172a"/>
        <rect x="6" y="6" width="48" height="42" rx="6" fill="#42a5f5"/>
        <rect x="66" y="6" width="48" height="42" rx="6" fill="#ff9800"/>
        <rect x="126" y="6" width="48" height="42" rx="6" fill="#4caf50"/>
        <circle cx="30" cy="27" r="13" fill="#ffffff"/>
        <path d="M81 14h18v26H81z" fill="#ffffff"/>
        <path d="M150 11l18 32h-36z" fill="#ffffff"/>
        <path d="M8 27h164" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 7" opacity="0.55"/>
      </svg>
stylesheet:
  - selector: node
    style:
      width: 118
      height: 104
      iconWidth: 72
      iconHeight: 72
      shape: roundRectangle
      borderWidth: 3
      iconPadding: 0
      iconBackgroundColor: "#f8fafc"
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      badgeColor: "#0f172a"
      badgeBackgroundColor: "#f8fafc"
      badgeBorderColor: "#94a3b8"
      statusSize: 12
  - selector: node[labels.role = "contain"]
    style:
      icon: wideSignal
      iconFit: contain
      badgeLabel: "full"
      statusColor: "#22c55e"
      statusPlacement: bottomRight
  - selector: node[labels.role = "cover"]
    style:
      icon: wideSignal
      iconFit: cover
      badgeLabel: "crop"
      badgePosition: topLeft
      statusColor: "#f59e0b"
      statusPlacement: bottomLeft
  - selector: node[labels.role = "fill"]
    style:
      icon: wideSignal
      iconFit: fill
      badgeLabel: "stretch"
      badgePosition: topRight
      statusColor: "#dc2626"
      statusPlacement: topRight
  - selector: link
    style:
      lineColor: "#94a3b8"
      lineWidth: 2
      targetArrowShape: none
