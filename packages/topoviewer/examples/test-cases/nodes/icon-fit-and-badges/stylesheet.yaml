layout:
  mode: manual
  width: 640
  height: 320
icons:
  sensor:
    alt: Sensor icon
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect x="8" y="8" width="48" height="48" rx="14" fill="#38bdf8"/>
        <circle cx="32" cy="32" r="10" fill="#0f172a"/>
      </svg>
  camera:
    alt: Camera icon
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48">
        <rect x="6" y="10" width="58" height="30" rx="8" fill="#f59e0b"/>
        <polygon points="64,18 90,8 90,40 64,30" fill="#92400e"/>
      </svg>
  gateway:
    alt: Gateway icon
    svg: |
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 96">
        <rect x="8" y="8" width="32" height="80" rx="10" fill="#dc2626"/>
        <circle cx="24" cy="28" r="5" fill="white"/>
        <circle cx="24" cy="48" r="5" fill="white"/>
        <circle cx="24" cy="68" r="5" fill="white"/>
      </svg>
stylesheet:
  - selector: node
    style:
      width: 112
      height: 82
      iconSize: 58
      shape: roundRectangle
      borderWidth: 3
      iconPadding: 4
      iconBackgroundColor: "#0f172a"
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      badgeColor: "#0f172a"
      badgeBackgroundColor: "#f8fafc"
      badgeBorderColor: "#94a3b8"
      statusSize: 12
  - selector: node[labels.role = "sensor"]
    style:
      icon: sensor
      iconFit: contain
      badgeLabel: "12"
      statusColor: "#22c55e"
      statusPlacement: bottomRight
  - selector: node[labels.role = "camera"]
    style:
      icon: camera
      iconFit: cover
      badgeLabel: "4"
      badgePosition: topLeft
      statusColor: "#f59e0b"
      statusPlacement: bottomLeft
  - selector: node[labels.role = "gateway"]
    style:
      icon: gateway
      iconFit: fill
      badgeLabel: "1"
      badgePosition: topRight
      statusColor: "#dc2626"
      statusPlacement: topRight
  - selector: link
    style:
      lineColor: "#94a3b8"
      lineWidth: 2
      targetArrowShape: none
