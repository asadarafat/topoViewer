graph:
  id: custom-polygon-node
  layers:
    - id: service
      name: Service
  nodes:
    - id: collector
      name: Collector
      labels:
        role: collector
      layers: [service]
      position: [120, 150]
    - id: site-a
      name: Site A
      labels:
        role: site
      layers: [service]
      position: [330, 90]
    - id: site-b
      name: Site B
      labels:
        role: site
      layers: [service]
      position: [330, 230]
      style:
        shape: polygon
        shapePolygonPoints: [0, -1, 0.92, -0.12, 0.58, 1, -0.58, 1, -0.92, -0.12]
  links:
    - id: collector-site-a
      name: Collector to Site A
      source: collector
      target: site-a
      layers: [service]
    - id: collector-site-b
      name: Collector to Site B
      source: collector
      target: site-b
      layers: [service]
