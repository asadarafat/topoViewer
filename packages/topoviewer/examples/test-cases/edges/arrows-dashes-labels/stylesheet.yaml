layout:
  mode: manual
  width: 640
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.node = "controller"]
    style:
      icon: controller
      width: 104
  - selector: link[labels.direction = "request"]
    style:
      sourceLabel: source PCC
      targetLabel: target PCE
      sourceLabelXOffset: 46
      sourceLabelYOffset: -32
      targetLabelXOffset: -46
      targetLabelYOffset: -32
      curveStyle: bezier
      controlPointDistance: -78
      lineColor: "#fbbf24"
      lineDashPattern: 5 5
      targetArrowShape: triangle
  - selector: link[labels.direction = "reply"]
    style:
      source-label: source PCE
      target-label: target PCC
      source-label-x-offset: -46
      source-label-y-offset: 32
      target-label-x-offset: 46
      target-label-y-offset: 32
      curveStyle: bezier
      control-point-distance: -78
      lineColor: "#38bdf8"
      lineDashPattern: 2 5
      targetArrowShape: triangle
