layout:
  mode: manual
  width: 640
  height: 320
icons:
  router:
    glyph: R
    fill: "#0f766e"
    stroke: "#99f6e4"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 86
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      lineWidth: 4
      lineColor: "#0f766e"
      targetArrowShape: triangle
      targetArrowColor: "#0f766e"
      targetArrowSize: 12
      sourceDistanceFromNode: 18
      targetDistanceFromNode: 18
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.route = "segment"]
    style:
      label: segmentDistances
      curveStyle: segments
      segmentDistances:
        - -54
        - 54
      segmentWeights:
        - 0.33
        - 0.67
      lineColor: "#2563eb"
      targetArrowColor: "#2563eb"
  - selector: link[labels.route = "taxi"]
    style:
      label: taxiDirection
      curveStyle: taxi
      taxiDirection: rightward
      taxiTurn: 86
      taxiTurnMinDistance: 90
      lineColor: "#f97316"
      targetArrowColor: "#f97316"
