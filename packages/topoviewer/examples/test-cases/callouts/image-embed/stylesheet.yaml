layout:
  mode: manual
  width: 760
  height: 390
stylesheet:
  - selector: callout
    style:
      backgroundColor: rgba(15, 23, 42, 0.94)
      borderColor: rgba(148, 163, 184, 0.42)
      borderWidth: 1
      borderRadius: 14
      titleBackgroundColor: rgba(30, 41, 59, 0.88)
      titleColor: "#f8fafc"
      titleFontSize: 13
      titleFontWeight: 900
      bodyColor: "#cbd5e1"
      bodyFontSize: 11
      bodyLineHeight: 1.38
      curveStyle: smoothstep
      lineColor: rgba(226, 232, 240, 0.72)
      arrowColor: rgba(226, 232, 240, 0.82)
      lineWidth: 1
      targetArrowShape: triangle
      zIndex: 40
