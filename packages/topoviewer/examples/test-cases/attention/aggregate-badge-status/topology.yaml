graph:
  id: attention-aggregate-badge-status
  layers:
    - id: physical
      name: Physical
  nodes:
    - id: ACC-1
      name: ACC-1
      labels:
        role: access
      data:
        severity: normal
      layers: [physical]
      position: [120, 110]
    - id: ACC-2
      name: ACC-2
      labels:
        role: access
      data:
        severity: critical
      layers: [physical]
      position: [120, 230]
    - id: AGG-1
      name: AGG-1
      labels:
        role: aggregation
      data:
        severity: major
      layers: [physical]
      position: [300, 170]
    - id: PE-1
      name: PE-1
      labels:
        role: pe
      data:
        severity: normal
      layers: [physical]
      position: [520, 170]
  links:
    - id: acc1-agg
      name: ACC-1 to AGG-1
      source: ACC-1
      target: AGG-1
      layers: [physical]
    - id: acc2-agg
      name: ACC-2 to AGG-1
      source: ACC-2
      target: AGG-1
      layers: [physical]
    - id: agg-pe
      name: AGG-1 to PE-1
      source: AGG-1
      target: PE-1
      layers: [physical]
  regions:
    - id: access-region
      name: Access region
      labels:
        region: access
      members:
        - ACC-1
        - ACC-2
        - AGG-1
      layers: [physical]
      padding: 64
      minWidth: 360
      minHeight: 250
attention:
  aggregate:
    groups:
      - id: access-region
        by: region
        regionId: access-region
        label: Access region
    expandOnClick: true
