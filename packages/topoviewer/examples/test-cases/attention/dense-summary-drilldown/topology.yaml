attention:
  aggregate:
    groups:
      - id: north-metro
        by: region
        regionId: north-metro
        label: NORTH metro
      - id: east-metro
        by: region
        regionId: east-metro
        label: EAST metro
      - id: west-metro
        by: region
        regionId: west-metro
        label: WEST metro
    expandOnClick: true
  links:
    grouping:
      enabled: true
      threshold: 2
      by: [endpoints, layer]
      expandOnClick: true
layout:
  mode: manual
  width: 1360
  height: 460
toggles:
  - id: showEdgeLabels
    name: Edge labels
    default: true
