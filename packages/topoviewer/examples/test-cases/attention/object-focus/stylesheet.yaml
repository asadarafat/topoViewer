layout:
  mode: manual
  width: 620
  height: 420
icons:
  endpoint:
    glyph: C
    fill: "#2563eb"
    stroke: "#bfdbfe"
  gateway:
    glyph: G
    fill: "#0f766e"
    stroke: "#99f6e4"
  service:
    glyph: API
    fill: "#dc2626"
    stroke: "#fecaca"
  support:
    glyph: S
    fill: "#64748b"
    stroke: "#cbd5e1"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      width: 86
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "endpoint"]
    style:
      icon: endpoint
  - selector: node[labels.role = "gateway"]
    style:
      icon: gateway
  - selector: node[labels.role = "service"]
    style:
      icon: service
  - selector: node[labels.role = "support"]
    style:
      icon: support
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 1.5
      targetArrowShape: none
      opacity: 0.72
  - selector: link[labels.link = "support"]
    style:
      lineDashPattern: 5 5
  - selector: path
    style:
      label: Checkout flow
      curveStyle: smooth-taxi
      lineColor: "#38bdf8"
      lineWidth: 4
      animated: true
      targetArrowShape: triangle
