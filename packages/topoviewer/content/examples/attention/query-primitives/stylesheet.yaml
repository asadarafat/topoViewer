version: "0.2"
layout:
  mode: manual
  width: 720
  height: 420
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  controller:
    glyph: NOC
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "control"]
    style:
      icon: controller
      width: 92
      borderColor: "#facc15"
      backgroundColor: "#f59e0b"
  - selector: node[data.severity = "critical"]
    style:
      borderColor: "#fecaca"
      backgroundColor: "#dc2626"
  - selector: node[labels.role = "access"]
    style:
      borderColor: "#bbf7d0"
      backgroundColor: "#16a34a"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 1.7
      targetArrowShape: none
      opacity: 0.8
  - selector: link[labels.media = "fiber"]
    style:
      label: Fiber
      lineColor: "#38bdf8"
      lineWidth: 3
  - selector: link[labels.protocol = "telemetry"]
    style:
      label: Telemetry
      curveStyle: bezier
      lineColor: "#22c55e"
      lineDashPattern: 3 4
      targetArrowShape: triangle
