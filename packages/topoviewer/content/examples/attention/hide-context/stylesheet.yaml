version: "0.2"
layout:
  mode: manual
  width: 720
  height: 400
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "pe"]
    style:
      borderColor: "#bbf7d0"
      backgroundColor: "#16a34a"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 1.8
      targetArrowShape: none
      opacity: 0.82
