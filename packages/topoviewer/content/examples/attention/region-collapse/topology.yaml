version: "0.2"
graph:
  id: attention-region-collapse
  layers:
    - id: physical
      labels:
        name: Physical
  nodes:
    - id: AGG-1
      labels:
        node: router
        role: aggregation
        name: AGG-1
      data:
        severity: major
      layers:
        - physical
      position:
        - 220
        - 130
    - id: ACC-1
      labels:
        node: router
        role: access
        name: ACC-1
      data:
        severity: normal
      layers:
        - physical
      position:
        - 90
        - 270
    - id: ACC-2
      labels:
        node: router
        role: access
        name: ACC-2
      data:
        severity: normal
      layers:
        - physical
      position:
        - 350
        - 270
    - id: PE-1
      labels:
        node: router
        role: pe
        name: PE-1
      data:
        severity: normal
      layers:
        - physical
      position:
        - 590
        - 190
  links:
    - id: agg-acc-1
      source: AGG-1
      target: ACC-1
      labels:
        link: access
        name: AGG-1 to ACC-1
      layers:
        - physical
    - id: agg-acc-2
      source: AGG-1
      target: ACC-2
      labels:
        link: access
        name: AGG-1 to ACC-2
      layers:
        - physical
    - id: agg-pe-1
      source: AGG-1
      target: PE-1
      labels:
        link: uplink
        name: AGG-1 to PE-1
      layers:
        - physical
  regions:
    - id: access-metro
      members:
        - AGG-1
        - ACC-1
        - ACC-2
      labels:
        region: metro
        name: Access metro
      layers:
        - physical
      padding: 70
      minWidth: 420
      minHeight: 260
attention:
  aggregate:
    groups:
      - id: access-metro
        by: region
        regionId: access-metro
        label: Access metro
    expandOnClick: true
