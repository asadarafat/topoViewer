version: "0.2"
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[isAggregate = "true"]
    style:
      width: 132
      height: 78
      backgroundColor: "#312e81"
      borderColor: "#c4b5fd"
      labelColor: "#f5f3ff"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 2.2
      targetArrowShape: none
      opacity: 0.82
  - selector: link[aggregate = "true"]
    style:
      lineColor: "#8b5cf6"
      lineWidth: 4
      lineDashPattern: "10 5"
  - selector: region
    style:
      backgroundColor: "#0ea5e922"
      borderColor: "#38bdf8aa"
      borderRadius: 6
      borderWidth: 1
      zIndex: -20
  - selector: region[id = "west-metro"]
    style:
      minHeight: 210
      minWidth: 330
      padding: 70
  - selector: region[id = "east-metro"]
    style:
      minHeight: 210
      minWidth: 330
      padding: 70
layout:
  mode: manual
  width: 1120
  height: 300
