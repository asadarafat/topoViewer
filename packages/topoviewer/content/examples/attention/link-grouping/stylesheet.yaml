icons:
  router:
    glyph: PE
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 86
      height: 62
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      curveStyle: bezier
      controlPointStepSize: 34
      lineColor: "#64748b"
      lineWidth: 2.2
      targetArrowShape: none
      labelColor: "#1e293b"
      textBackgroundColor: "#f8fafc"
      textBackgroundOpacity: 0.95
  - selector: link[id = "pe-1-pe-2-a"]
    style:
      lineColor: "#0f766e"
      lineWidth: 3
  - selector: link[id = "pe-1-pe-2-b"]
    style:
      lineColor: "#2563eb"
      lineWidth: 3
  - selector: link[id = "pe-1-pe-2-c"]
    style:
      lineColor: "#dc2626"
      lineWidth: 3
  - selector: link[isLinkAggregate = "true"]
    style:
      lineColor: "#8b5cf6"
      lineWidth: 4
      lineDashPattern: "10 5"
      labelColor: "#312e81"
      textBackgroundColor: "#ede9fe"
      textBackgroundOpacity: 0.96
