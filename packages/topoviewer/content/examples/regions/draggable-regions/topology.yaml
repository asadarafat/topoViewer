version: "0.2"
graph:
  id: draggable-regions
  layers:
    - id: site
      labels:
        name: Site
  nodes:
    - id: A
      labels:
        node: router
        name: A
      layers:
        - site
      position:
        - 180
        - 180
    - id: B
      labels:
        node: router
        name: B
      layers:
        - site
      position:
        - 440
        - 180
  links:
    - id: a-b
      source: A
      target: B
      labels:
        link: site
        name: A to B
      layers:
        - site
  regions:
    - id: site-a
      labels:
        region: site
        name: Site A
      members:
        - A
        - B
      layers:
        - site
      paddingX: 50
      paddingY: 28
toggles:
  - id: showRegions
    default: true
    labels:
      name: Show regions
