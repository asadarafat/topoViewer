version: "0.2"
graph:
  id: nested-regions
  layers:
    - id: igp
      labels:
        name: Igp
  nodes:
    - id: R01
      labels:
        node: router
        name: R01
      layers:
        - igp
      position:
        - 140
        - 190
    - id: R05
      labels:
        node: router
        role: abr
        name: R05
      layers:
        - igp
      position:
        - 380
        - 190
    - id: R09
      labels:
        node: router
        name: R09
      layers:
        - igp
      position:
        - 620
        - 190
  links:
    - id: r01-r05
      source: R01
      target: R05
      labels:
        protocol: isis
        name: R01 to R05 IS-IS adjacency
      layers:
        - igp
    - id: r05-r09
      source: R05
      target: R09
      labels:
        protocol: isis
        name: R05 to R09 IS-IS adjacency
      layers:
        - igp
  regions:
    - id: isis-l1
      labels:
        region: igp
        level: l1
        name: IS-IS L1
      parent: as65000
      members:
        - R01
        - R05
      layers:
        - igp
    - id: as65000
      labels:
        region: bgp
        name: AS 65000
      members:
        - R01
        - R05
        - R09
      layers:
        - igp
toggles:
  - id: showRegions
    default: true
    labels:
      name: Show regions
