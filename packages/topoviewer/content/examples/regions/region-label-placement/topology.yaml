graph:
  id: region-label-placement
  layers:
    - id: site
      name: Site
  nodes:
    - id: edge-a
      name: EDGE-A
      labels:
        role: gateway
      layers:
        - site
      position:
        - 160
        - 180
    - id: edge-b
      name: EDGE-B
      labels:
        role: gateway
      layers:
        - site
      position:
        - 480
        - 180
  links:
    - id: edge-a-b
      name: East-west transport
      source: edge-a
      target: edge-b
      layers:
        - site
  regions:
    - id: single-node-site
      name: Single Node Site
      labels:
        placement: top
      members:
        - edge-a
      layers:
        - site
      paddingX: 54
      paddingY: 34
      headerPadding: 34
      minWidth: 220
      minHeight: 170
    - id: side-label-site
      name: Side Label Site
      labels:
        placement: side
      members:
        - edge-b
      layers:
        - site
      paddingX: 66
      paddingY: 34
      minWidth: 220
      minHeight: 170
toggles:
  - id: showRegions
    name: Show regions
    default: true
layout:
  mode: manual
  width: 680
  height: 360
