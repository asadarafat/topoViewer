version: "0.2"
graph:
  id: node-icon-fit-and-badges
  layers:
    - id: physical
      labels:
        name: Physical
  nodes:
    - id: ICON-CONTAIN
      labels:
        role: contain
        state: normal
        name: Contain
      layers: [physical]
      position: [110, 160]
    - id: ICON-COVER
      labels:
        role: cover
        state: warning
        name: Cover
      layers: [physical]
      position: [310, 160]
    - id: ICON-FILL
      labels:
        role: fill
        state: critical
        name: Fill
      layers: [physical]
      position: [510, 160]
  links:
    - id: contain-cover
      source: ICON-CONTAIN
      target: ICON-COVER
      layers: [physical]
      labels:
        name: Contain to cover
    - id: cover-fill
      source: ICON-COVER
      target: ICON-FILL
      layers: [physical]
      labels:
        name: Cover to fill
