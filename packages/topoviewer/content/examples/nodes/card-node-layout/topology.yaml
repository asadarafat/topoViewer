version: "0.2"
graph:
  id: node-card-layout
  layers:
    - id: services
      labels:
        name: Services
  nodes:
    - id: api
      labels:
        role: frontend
        state: healthy
        name: API gateway
      data:
        subtitle: ingress / active
        badge: "4"
      layers: [services]
      position: [120, 140]
    - id: orders
      labels:
        role: service
        state: busy
        name: Orders service
      data:
        subtitle: checkout path
        badge: "12"
      layers: [services]
      position: [360, 140]
    - id: database
      labels:
        role: database
        state: healthy
        name: Orders database
      data:
        subtitle: primary / eu-west
        badge: "1"
      layers: [services]
      position: [600, 140]
  links:
    - id: api-orders
      source: api
      target: orders
      layers: [services]
      labels:
        name: REST
    - id: orders-database
      source: orders
      target: database
      layers: [services]
      labels:
        name: SQL
