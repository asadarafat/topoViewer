layout:
  mode: manual
  width: 760
  height: 300
icons:
  router.nokia:
    glyph: "N"
    alt: Nokia router
    svg: |
      <svg
        xmlns:xlink="http://www.w3.org/1999/xlink"
        xmlns="http://www.w3.org/2000/svg"
        xml:space="preserve"
        style="enable-background:new 0 0 120 120;"
        viewBox="0 0 120 120"
        y="0px"
        x="0px"
        id="Layer_1"
        version="1.1"
        width="120px"
        height="120px"
        fill="none"
      >
        <style type="text/css">
          .st0 { fill: #001135; }
          .st1 { fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 10; }
        </style>
        <rect height="120" width="120" class="st0" />
        <g>
          <g>
            <path d="M71.7,19.7V48h28" class="st1" />
            <path d="M91.2,38.5l7.5,7.6c1.3,1.3,1.3,3.1,0,4.3L91.1,58" class="st1" />
          </g>
          <g>
            <path d="M20,47.8h28.4v-28" class="st1" />
            <path d="M38.8,28.3l7.6-7.5c1.3-1.3,3.1-1.3,4.3,0l7.7,7.6" class="st1" />
          </g>
          <g>
            <path d="M48,100.3V72H20" class="st1" />
            <path d="M28.5,81.5L21,73.9c-1.3-1.3-1.3-3.1,0-4.3l7.6-7.7" class="st1" />
          </g>
          <g>
            <path d="M100,71.9H71.6v28" class="st1" />
            <path d="M81.2,91.4l-7.6,7.5c-1.3,1.3-3.1,1.3-4.3,0l-7.7-7.6" class="st1" />
          </g>
        </g>
      </svg>
  service:
    glyph: SVC
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  database:
    glyph: DB
    fill: "#7b1fa2"
    stroke: "#ce93d8"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      width: 190
      height: 64
      backgroundColor: "#0f172a"
      borderColor: "#334155"
      borderWidth: 2
      color: "#e2e8f0"
      labelColor: "#f8fafc"
      metaColor: "#94a3b8"
      iconPadding: 6
      badgeColor: "#0f172a"
      badgeBackgroundColor: "#e0f2fe"
      badgeBorderColor: "#38bdf8"
      badgeBorderWidth: 2
      badgeFontSize: 11
      badgeFontWeight: 900
      badgeMinWidth: 22
      badgeMinHeight: 22
      badgePadding: 3
      badgeOffset: 11
      badgePosition: topRight
      statusPlacement: topRight
      statusSize: 16
      nodeLayout:
        type: card
        direction: horizontal
        icon:
          placement: left
          width: 44
          height: 44
        content:
          align: left
          titleField: name
          subtitleField: data.subtitle
  - selector: node[labels.role = "frontend"]
    style:
      icon: router.nokia
      borderColor: "#60a5fa"
      badgeLabel: "4"
  - selector: node[labels.role = "service"]
    style:
      icon: service
      borderColor: "#86efac"
      badgeLabel: "12"
  - selector: node[labels.role = "database"]
    style:
      icon: database
      borderColor: "#d8b4fe"
      badgeLabel: "1"
  - selector: node[labels.state = "healthy"]
    style:
      statusColor: "#22c55e"
  - selector: node[labels.state = "busy"]
    style:
      statusColor: "#f59e0b"
      outlineColor: "#f59e0b"
      outlineWidth: 2
      outlineOpacity: 0.45
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#64748b"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#64748b"
      labelColor: "#cbd5e1"
      textBackgroundColor: "#0f172a"
