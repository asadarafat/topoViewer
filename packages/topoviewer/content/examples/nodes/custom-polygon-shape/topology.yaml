version: "0.2"
graph:
  id: custom-polygon-node
  layers:
    - id: service
      labels:
        name: Service
  nodes:
    - id: collector
      labels:
        role: collector
        name: Collector
      layers: [service]
      position: [120, 150]
    - id: site-a
      labels:
        role: site
        name: Site A
      layers: [service]
      position: [330, 90]
    - id: site-b
      labels:
        role: site
        name: Site B
      layers: [service]
      position: [330, 230]
  links:
    - id: collector-site-a
      source: collector
      target: site-a
      layers: [service]
      labels:
        name: Collector to Site A
    - id: collector-site-b
      source: collector
      target: site-b
      layers: [service]
      labels:
        name: Collector to Site B
