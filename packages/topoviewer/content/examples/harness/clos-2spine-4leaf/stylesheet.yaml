layout:
  mode: manual
  width: 860
  height: 420
icons:
  router.generic:
    glyph: R
    fill: var(--topoviewer-router-generic-fill)
    stroke: var(--topoviewer-router-generic-stroke)
  router.nokia:
    glyph: "N"
    alt: Nokia router
    svg: |
