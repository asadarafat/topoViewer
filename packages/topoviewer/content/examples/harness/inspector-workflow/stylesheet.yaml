icons:
  router:
    glyph: ""
    fill: "#1976d2"
    stroke: "#90caf9"
  firewall:
    glyph: "FW"
    fill: "#d32f2f"
    stroke: "#ffcdd2"
  service:
    glyph: ""
    fill: "#ff9800"
    stroke: "#ffe0b2"
labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router
      shape: ellipse
      width: 92
      height: 76
      borderColor: "#1976d2"
      borderWidth: 2
      labelColor: "#0f172a"
      labelFontWeight: 800
      labelBackgroundColor: "#ffffff"
      labelPadding: 4
  - selector: node[labels.role = "firewall"]
    style:
      icon: firewall
      shape: hexagon
      borderColor: "#d32f2f"
  - selector: node[labels.role = "service"]
    style:
      icon: service
      shape: roundRectangle
      width: 112
      height: 64
      borderColor: "#ff9800"
  - selector: link
    style:
      curveStyle: smooth-taxi
      lineColor: "#64748b"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#64748b"
