version: "0.2"
layout:
  mode: manual
  width: 640
  height: 340
icons:
  router:
    glyph: R
    fill: "#1976d2"
    stroke: "#bfdbfe"
labelFields:
  - labels.name
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 64
      borderWidth: 3
      labelPosition: center
      labelColor: "#ffffff"
      labelFontWeight: 800
      labelBackgroundColor: "#1565c0"
      labelBackgroundOpacity: 0.96
      labelPadding: 4
      labelZIndex: 90
  - selector: link
    style:
      label: Transport
      sourceLabel: source side
      targetLabel: target side
      curveStyle: straight
      lineColor: "#90a4ae"
      lineWidth: 4
      labelColor: "#0f172a"
      textBackgroundColor: "#e3f2fd"
      labelBorderColor: "#42a5f5"
      labelBorderWidth: 1
      labelZIndex: 50
      sourceLabelColor: "#ffffff"
      sourceLabelBackgroundColor: "#2e7d32"
      sourceLabelZIndex: 100
      sourceLabelYOffset: -28
      targetLabelColor: "#ffffff"
      targetLabelBackgroundColor: "#d32f2f"
      targetLabelZIndex: 100
      targetLabelYOffset: -28
  - selector: region
    style:
      backgroundColor: rgba(25, 118, 210, 0.08)
      borderColor: rgba(25, 118, 210, 0.48)
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 14
      labelColor: "#0f172a"
      labelBackgroundColor: "#ffffff"
      labelZIndex: 30
      zIndex: -20
