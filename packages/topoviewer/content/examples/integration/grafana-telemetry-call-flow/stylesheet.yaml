layout:
  mode: manual
  width: 1220
  height: 660
icons:
  authoring:
    glyph: YAML
    fill: "#1976d2"
    stroke: "#bbdefb"
  yaml:
    glyph: TVY
    fill: "#1565c0"
    stroke: "#90caf9"
  filesystem:
    glyph: FS
    fill: "#0288d1"
    stroke: "#b3e5fc"
  backend:
    glyph: API
    fill: "#7b1fa2"
    stroke: "#e1bee7"
  frontend:
    glyph: UI
    fill: "#9c27b0"
    stroke: "#e1bee7"
  prometheus:
    glyph: P
    fill: "#d32f2f"
    stroke: "#ffcdd2"
  grafana:
    glyph: G
    fill: "#ff9800"
    stroke: "#ffe0b2"
  process:
    glyph: MAP
    fill: "#2e7d32"
    stroke: "#c8e6c9"
  overlay:
    glyph: OVR
    fill: "#4caf50"
    stroke: "#c8e6c9"
  renderer:
    glyph: TV
    fill: "#2e7d32"
    stroke: "#c8e6c9"
  diagnostics:
    glyph: "!"
    fill: "#d32f2f"
    stroke: "#ffcdd2"
  state:
    glyph: UX
    fill: "#455a64"
    stroke: "#cfd8dc"
labelFields: []
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.06)"
      borderColor: "rgba(66, 165, 245, 0.42)"
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelFontSize: 13
      labelFontWeight: 800
      labelZIndex: 40
      zIndex: -30
  - selector: region[labels.region = "boundary"]
    style:
      backgroundColor: "rgba(156, 39, 176, 0.08)"
      borderColor: "rgba(186, 104, 200, 0.58)"
      borderWidth: 3
  - selector: node
    style:
      shape: rectangle
      width: 138
      height: 72
      borderWidth: 3
      iconWidth: 52
      iconHeight: 40
      iconFit: contain
      iconPadding: 4
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.96
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelFontSize: 13
      labelFontWeight: 800
      labelZIndex: 50
      labelYOffset: 8
      labelPadding: 4
      metaColor: transparent
  - selector: node[labels.kind = "authoring"]
    style:
      icon: authoring
      backgroundColor: "#1976d2"
      borderColor: "#90caf9"
  - selector: node[labels.kind = "yaml"]
    style:
      icon: yaml
      backgroundColor: "#1565c0"
      borderColor: "#90caf9"
  - selector: node[labels.kind = "filesystem"]
    style:
      icon: filesystem
      backgroundColor: "#0288d1"
      borderColor: "#81d4fa"
  - selector: node[labels.kind = "backend"]
    style:
      icon: backend
      backgroundColor: "#7b1fa2"
      borderColor: "#ce93d8"
  - selector: node[labels.kind = "frontend"]
    style:
      icon: frontend
      backgroundColor: "#9c27b0"
      borderColor: "#ce93d8"
  - selector: node[labels.kind = "datasource"]
    style:
      icon: prometheus
      backgroundColor: "#d32f2f"
      borderColor: "#ef9a9a"
  - selector: node[labels.kind = "grafana"]
    style:
      icon: grafana
      backgroundColor: "#ff9800"
      borderColor: "#ffcc80"
  - selector: node[labels.kind = "config"]
    style:
      icon: yaml
      backgroundColor: "#ed6c02"
      borderColor: "#ffcc80"
  - selector: node[labels.kind = "process"]
    style:
      icon: process
      backgroundColor: "#2e7d32"
      borderColor: "#a5d6a7"
  - selector: node[labels.kind = "overlay"]
    style:
      icon: overlay
      backgroundColor: "#4caf50"
      borderColor: "#c8e6c9"
  - selector: node[labels.kind = "renderer"]
    style:
      icon: renderer
      backgroundColor: "#2e7d32"
      borderColor: "#a5d6a7"
      outlineColor: "#4caf50"
      outlineWidth: 4
      outlineOpacity: 0.38
  - selector: node[labels.kind = "diagnostics"]
    style:
      icon: diagnostics
      backgroundColor: "#d32f2f"
      borderColor: "#ef9a9a"
  - selector: node[labels.kind = "state"]
    style:
      icon: state
      backgroundColor: "#455a64"
      borderColor: "#cfd8dc"
  - selector: link
    style:
      curveStyle: smoothTaxi
      label: ""
      lineColor: "#78909c"
      lineWidth: 3
      lineCap: round
      targetArrowShape: triangle
      targetArrowColor: "#78909c"
      targetArrowSize: 10
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 11
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.92
      textBackgroundPadding: 3
  - selector: link[labels.flow = "source"]
    style:
      lineColor: "#1976d2"
      targetArrowColor: "#1976d2"
      lineWidth: 4
  - selector: link[labels.flow = "optional"]
    style:
      lineColor: "#ff9800"
      targetArrowColor: "#ff9800"
      lineStyle: dashed
      lineDashPattern: 10 7
      lineWidth: 3
  - selector: link[labels.flow = "telemetry"]
    style:
      lineColor: "#d32f2f"
      targetArrowColor: "#d32f2f"
      lineWidth: 4
  - selector: link[labels.flow = "mapping"]
    style:
      lineColor: "#2e7d32"
      targetArrowColor: "#2e7d32"
      lineWidth: 4
  - selector: link[labels.flow = "overlay"]
    style:
      lineColor: "#4caf50"
      targetArrowColor: "#4caf50"
      lineWidth: 4
  - selector: link[labels.flow = "render"]
    style:
      lineColor: "#9c27b0"
      targetArrowColor: "#9c27b0"
      lineWidth: 4
  - selector: link[labels.flow = "diagnostics"]
    style:
      lineColor: "#d32f2f"
      targetArrowColor: "#d32f2f"
      lineStyle: dashed
      lineDashPattern: 8 6
      lineWidth: 3
  - selector: link[labels.flow = "interaction"]
    style:
      lineColor: "#607d8b"
      targetArrowColor: "#607d8b"
      lineStyle: dashed
      lineDashPattern: 12 6
      lineWidth: 3
  - selector: path
    style:
      curveStyle: smoothTaxi
      label: ""
      lineWidth: 10
      laneWidth: 10
      lineOpacity: 0.13
      targetArrowShape: none
      zIndex: -10
  - selector: path[labels.path = "source"]
    style:
      lineColor: "#1976d2"
  - selector: path[labels.path = "telemetry"]
    style:
      lineColor: "#4caf50"
  - selector: path[labels.path = "diagnostics"]
    style:
      lineColor: "#d32f2f"
