version: "0.2"
layout:
  mode: manual
  width: 980
  height: 520
icons:
  router.pe:
    glyph: ""
    fill: "#2563eb"
    stroke: "#bfdbfe"
  router.p:
    glyph: ""
    fill: "#0f766e"
    stroke: "#99f6e4"
  router.rr:
    glyph: ""
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  router.ce:
    glyph: ""
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields: []
stylesheet:
  - selector: node
    style:
      shape: roundRectangle
      icon: router.p
      width: 112
      height: 82
      iconSize: 52
      backgroundColor: "#ffffff"
      borderColor: "#94a3b8"
      borderWidth: 2
      labelColor: "#0f172a"
      labelFontSize: 12
      labelFontWeight: 800
      labelBackgroundColor: "#ffffff"
      labelPadding: 4
      metaColor: "transparent"
      metaFontSize: 0
      statusColor: "#22c55e"
      statusPlacement: topRight
      statusSize: 11
  - selector: node[labels.role = "pe"]
    style:
      icon: router.pe
      shape: hexagon
      borderColor: "#2563eb"
  - selector: node[labels.role = "p"]
    style:
      icon: router.p
      shape: ellipse
      borderColor: "#0f766e"
  - selector: node[labels.role = "rr"]
    style:
      icon: router.rr
      display: none
  - selector: node[labels.role = "ce"]
    style:
      icon: router.ce
      display: none
  - selector: link
    style:
      curveStyle: straight
      lineColor: "#64748b"
      lineWidth: 4
      targetArrowShape: none
      labelColor: "#475569"
      labelFontSize: 11
      textBackgroundColor: "#ffffff"
  - selector: link[labels.layer = "underlay"]
    style:
      curveStyle: straight
      lineColor: "#64748b"
      lineWidth: 4
  - selector: link[labels.protocol = "bgp"]
    style:
      display: none
  - selector: link[labels.tenant = "payments"]
    style:
      display: none
  - selector: path
    style:
      display: none
  - selector: region
    style:
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelFontSize: 12
      labelFontWeight: 800
      labelPosition: topCenter
      labelMargin: 12
      zIndex: -20
      selectable: true
      draggable: true
  - selector: region[id = "fra-metro"]
    style:
      headerPadding: 34
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 28
      paddingY: 24
  - selector: region[id = "transit-core"]
    style:
      headerPadding: 34
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 34
      paddingY: 28
  - selector: region[id = "lon-metro"]
    style:
      headerPadding: 34
      nodeHeight: 82
      nodeWidth: 112
      paddingX: 28
      paddingY: 24
