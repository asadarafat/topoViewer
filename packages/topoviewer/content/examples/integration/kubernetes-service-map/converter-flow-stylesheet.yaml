version: "0.2"
layout:
  mode: manual
  width: 1320
  height: 520
icons:
  input:
    glyph: JSON
    fill: "#1565c0"
    stroke: "#90caf9"
  converter:
    glyph: CLI
    fill: "#7b1fa2"
    stroke: "#ce93d8"
  model:
    glyph: ID
    fill: "#00695c"
    stroke: "#80cbc4"
  artifact:
    glyph: ARTIFACT
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  policy:
    glyph: CSS
    fill: "#455a64"
    stroke: "#b0bec5"
  renderer:
    glyph: TV
    fill: "#ed6c02"
    stroke: "#ffcc80"
  behavior:
    glyph: UX
    fill: "#5d4037"
    stroke: "#d7ccc8"
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.06)"
      borderColor: "rgba(66, 165, 245, 0.36)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelPosition: topCenter
      labelMargin: 10
      labelFontWeight: 800
      labelZIndex: 6
  - selector: node
    style:
      shape: rectangle
      width: 140
      height: 58
      borderWidth: 3
      iconFit: contain
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      metaColor: transparent
  - selector: node[labels.object = "input"]
    style:
      icon: input
      backgroundColor: "rgba(25, 118, 210, 0.16)"
      borderColor: "#42a5f5"
  - selector: node[labels.object = "parentProcess"]
    style:
      icon: converter
      backgroundColor: "rgba(156, 39, 176, 0.08)"
      borderColor: "#ba68c8"
      width: 240
      height: 380
      labelPosition: top
      labelYOffset: -4
  - selector: node[labels.object = "process"]
    style:
      icon: converter
      backgroundColor: "rgba(156, 39, 176, 0.16)"
      borderColor: "#ba68c8"
      width: 168
  - selector: node[labels.object = "model"]
    style:
      icon: model
      backgroundColor: "rgba(0, 105, 92, 0.14)"
      borderColor: "#26a69a"
      width: 168
  - selector: node[labels.object = "behavior"]
    style:
      icon: behavior
      backgroundColor: "rgba(93, 64, 55, 0.14)"
      borderColor: "#bcaaa4"
      width: 152
  - selector: node[labels.role = "read"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "identity"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "relationships"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "attention"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.object = "artifact"]
    style:
      icon: artifact
      backgroundColor: "rgba(46, 125, 50, 0.14)"
      borderColor: "#4caf50"
  - selector: node[labels.object = "policy"]
    style:
      icon: policy
      backgroundColor: "rgba(69, 90, 100, 0.14)"
      borderColor: "#90a4ae"
  - selector: node[labels.object = "renderer"]
    style:
      icon: renderer
      backgroundColor: "rgba(237, 108, 2, 0.14)"
      borderColor: "#ff9800"
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#42a5f5"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#42a5f5"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 11
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.94
      labelZIndex: 8
  - selector: link[labels.link = "input"]
    style:
      label: read
      lineColor: "#1976d2"
      targetArrowColor: "#1976d2"
  - selector: link[labels.link = "derive"]
    style:
      label: derive
      lineColor: "#00695c"
      targetArrowColor: "#00695c"
  - selector: link[labels.link = "write"]
    style:
      label: write
      lineColor: "#2e7d32"
      targetArrowColor: "#2e7d32"
  - selector: link[labels.link = "renderInput"]
    style:
      label: input
      lineColor: "#ff9800"
      targetArrowColor: "#ff9800"
  - selector: link[labels.link = "behavior"]
    style:
      label: enables
      lineColor: "#5d4037"
      targetArrowColor: "#5d4037"
