version: "0.2"
graph:
  id: parent-child-nodes
  layers:
    - id: transport
      labels:
        name: Transport
    - id: service
      labels:
        name: Service
  nodes:
    - id: PE1
      labels:
        node: router
        name: PE1
      layers:
        - transport
        - service
      position:
        - 160
        - 170
    - id: PE2
      labels:
        node: router
        name: PE2
      layers:
        - transport
        - service
      position:
        - 520
        - 170
    - id: vrf-a
      labels:
        node: service
        name: "**VRF** 1321"
      parent: PE1
      layers:
        - service
      position:
        - 160
        - 260
    - id: vrf-b
      labels:
        node: service
        name: "**VRF** 1321"
      parent: PE2
      layers:
        - service
      position:
        - 520
        - 260
  links:
    - id: pe1-pe2
      source: PE1
      target: PE2
      labels:
        link: transport
        name: PE1 to PE2 transport link
      layers:
        - transport
    - id: vrf-a-vrf-b
      source: vrf-a
      target: vrf-b
      labels:
        link: service
        name: L3VPN overlay
      layers:
        - service
toggles:
  - id: showChildNodesInsideParents
    default: true
    labels:
      name: Show child nodes inside parents
  - id: showEdgeLabels
    default: true
    labels:
      name: Show labels
