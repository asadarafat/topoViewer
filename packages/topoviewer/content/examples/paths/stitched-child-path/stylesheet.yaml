layout:
  mode: manual
  width: 1000
  height: 470
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.node = "agg"]
    style:
      backgroundColor: "#0f766e"
      borderColor: "#ccfbf1"
      width: 106
      height: 68
  - selector: node[labels.node = "service"]
    style:
      icon: service
      width: 132
      height: 54
      labelFontSize: 10
      zIndex: 20
  - selector: link[labels.link = "physical"]
    style:
      label: Physical
      lineColor: "#6ea8fe"
  - selector: path[labels.protocol = "sr-te"]
    style:
      label: Transport carrier
      curveStyle: smooth-taxi
      lineColor: "#fb7185"
      lineWidth: 2
      pipe: true
      pipeWidth: 24
      pipeFill: "#fb7185"
      pipeBorderColor: "#fb7185"
      pipeOpacity: 0.16
  - selector: path[labels.path = "service"]
    style:
      label: Services A-J
      curveStyle: smooth-taxi
      lineColor: "#22c55e"
      lineWidth: 3
      laneWidth: 7
      laneGap: 9
      targetArrowShape: triangle
