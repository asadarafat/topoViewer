version: "0.2"
graph:
  id: stitched-child-path
  layers:
    - id: physical
      labels:
        name: Physical
    - id: transport
      labels:
        name: Transport
    - id: service
      labels:
        name: Service
  nodes:
    - id: AGG1
      labels:
        node: agg
        name: AGG1
      layers:
        - physical
        - transport
        - service
      position:
        - 80
        - 210
    - id: PE1
      labels:
        node: router
        name: PE1
      layers:
        - physical
        - transport
      position:
        - 280
        - 210
    - id: P
      labels:
        node: router
        name: P
      layers:
        - physical
        - transport
      position:
        - 480
        - 210
    - id: PE2
      labels:
        node: router
        name: PE2
      layers:
        - physical
        - transport
      position:
        - 680
        - 210
    - id: AGG2
      labels:
        node: agg
        name: AGG2
      layers:
        - physical
        - transport
        - service
      position:
        - 880
        - 210
    - id: services-1-10-agg1
      labels:
        node: service
        scope: aggregate
        name: "**Services** ++1-10++"
      data:
        serviceCount: 10
      parent: AGG1
      layers:
        - service
    - id: services-1-10-agg2
      labels:
        node: service
        scope: aggregate
        name: "**Services** ++1-10++"
      data:
        serviceCount: 10
      parent: AGG2
      layers:
        - service
  links:
    - id: phy-agg1-pe1
      source: AGG1
      target: PE1
      labels:
        link: physical
        name: AGG1 to PE1 physical link
      layers:
        - physical
    - id: phy-pe1-p
      source: PE1
      target: P
      labels:
        link: physical
        name: PE1 to P physical link
      layers:
        - physical
    - id: phy-p-pe2
      source: P
      target: PE2
      labels:
        link: physical
        name: P to PE2 physical link
      layers:
        - physical
    - id: phy-pe2-agg2
      source: PE2
      target: AGG2
      labels:
        link: physical
        name: PE2 to AGG2 physical link
      layers:
        - physical
  paths:
    - id: transport-agg1-agg2
      labels:
        path: transport
        protocol: sr-te
        name: AGG transport carrier
      layers:
        - transport
        - service
      sequence:
        - AGG1
        - PE1
        - P
        - PE2
        - AGG2
    - id: stitched-services-a-j
      source: services-1-10-agg1
      target: services-1-10-agg2
      parent: transport-agg1-agg2
      labels:
        path: service
        service: l3vpn
        scope: aggregate
        name: Services A-J stitched over transport
      data:
        serviceCount: 10
      layers:
        - service
toggles:
  - id: showChildNodesInsideParents
    default: true
    labels:
      name: Show child nodes inside parents
  - id: showEdgeLabels
    default: true
    labels:
      name: Show labels
