version: "0.2"
graph:
  id: vscode-dense-links
  layers:
    - id: transport
      labels:
        name: Transport
    - id: observability
      labels:
        name: Observability
  nodes:
    - id: a
      labels:
        role: router
        name: Router A
      data:
        status: ok
      layers: [transport]
      position: [170, 250]
    - id: b
      labels:
        role: router
        name: Router B
      data:
        status: ok
      layers: [transport, observability]
      position: [470, 250]
    - id: telemetry
      labels:
        role: ops
        name: Telemetry
      data:
        status: active
      layers: [observability]
      position: [320, 410]
  links:
    - id: a-b-1
      source: a
      target: b
      labels:
        bundle: a-b
        name: Link 1
      layers: [transport]
    - id: a-b-2
      source: a
      target: b
      labels:
        bundle: a-b
        name: Link 2
      layers: [transport]
    - id: a-b-3
      source: a
      target: b
      labels:
        bundle: a-b
        name: Link 3
      layers: [transport]
    - id: telemetry-b
      source: telemetry
      target: b
      labels:
        layer: observability
        name: Telemetry feed
      layers: [observability]
attention:
  links:
    grouping:
      threshold: 2
