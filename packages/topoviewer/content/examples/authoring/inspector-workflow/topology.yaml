version: "0.2"
graph:
  id: studio-inspector-workflow
  layers:
    - id: access
      labels:
        name: Access
    - id: security
      labels:
        name: Security
    - id: annotations
      labels:
        name: Annotations
  nodes:
    - id: access-a
      labels:
        role: router
        site: a
        name: Access A
      data:
        status: ok
        owner: network
      layers: [access, security]
      position: [180, 250]
    - id: firewall
      labels:
        role: firewall
        policy: inspect
        name: Firewall
      data:
        status: active
        revision: 12
      layers: [security]
      position: [420, 250]
    - id: app
      labels:
        role: service
        name: App
      data:
        status: active
      layers: [access]
      position: [660, 250]
  links:
    - id: access-a-firewall
      source: access-a
      target: firewall
      labels:
        layer: security
        name: Access to firewall
      layers: [security]
    - id: firewall-app
      source: firewall
      target: app
      labels:
        layer: access
        name: Firewall to app
      layers: [access]
diagram:
  callouts:
    - id: inspector-note
      title: Inspector
      body: Edit name, layer, labels, data, and position.
      target: firewall
      layers: [annotations]
