version: "0.2"
graph:
  id: vscode-insert-workflow
  layers:
    - id: underlay
      labels:
        name: Underlay
    - id: service
      labels:
        name: Service
    - id: notes
      labels:
        name: Notes
    - id: operations
      labels:
        name: Operations
  nodes:
    - id: edge-a
      labels:
        role: router
        site: a
        name: Edge A
      data:
        status: ok
      layers: [underlay, service]
      position: [170, 260]
    - id: edge-b
      labels:
        role: router
        site: b
        name: Edge B
      data:
        status: ok
      layers: [underlay, service, operations]
      position: [520, 260]
    - id: payment-svc
      labels:
        role: service
        name: Payment Service
      data:
        status: active
      layers: [service]
      position: [345, 410]
    - id: noc
      labels:
        role: ops
        name: NOC
      data:
        severity: minor
      layers: [operations]
      position: [700, 120]
  links:
    - id: underlay-a-b
      source: edge-a
      target: edge-b
      labels:
        layer: underlay
        name: Underlay A-B
      layers: [underlay]
    - id: service-a
      source: payment-svc
      target: edge-a
      labels:
        layer: service
        name: Service access A
      layers: [service]
    - id: ops-edge-b
      source: noc
      target: edge-b
      labels:
        layer: operations
        name: Active ticket
      layers: [operations]
      data:
        severity: minor
  regions:
    - id: access-region
      labels:
        scope: underlay
        name: Access Region
      layers: [underlay]
      members: [edge-a, edge-b]
      paddingX: 34
      paddingY: 30
      headerPadding: 34
diagram:
  callouts:
    - id: insert-note
      title: Insert target
      body: Use selected nodes for new links or regions.
      target: edge-a
      size: [180, 72]
      layers: [notes]
layout:
  mode: manual
  width: 820
  height: 520
