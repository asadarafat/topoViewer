version: "0.2"
graph:
  id: studio-attention-workflow
  layers:
    - id: underlay
      labels:
        name: Underlay
    - id: service
      labels:
        name: Service
    - id: operations
      labels:
        name: Operations
  nodes:
    - id: pe-a
      labels:
        role: pe
        site: a
        name: PE-A
      data:
        status: ok
      layers: [underlay, service]
      position: [130, 260]
    - id: p-core
      labels:
        role: p
        name: P-Core
      data:
        status: ok
      layers: [underlay]
      position: [330, 260]
    - id: pe-b
      labels:
        role: pe
        site: b
        name: PE-B
      data:
        status: warning
      layers: [underlay, service, operations]
      position: [530, 260]
    - id: payment-svc
      labels:
        role: service
        name: Payment VPN
      data:
        tenant: payments
      layers: [service]
      position: [330, 410]
    - id: noc
      labels:
        role: ops
        name: NOC
      data:
        severity: major
      layers: [operations]
      position: [690, 120]
  links:
    - id: transport-1
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
        name: Transport 1
      layers: [underlay]
    - id: transport-2
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
        name: Transport 2
      layers: [underlay]
    - id: transport-3
      source: pe-a
      target: p-core
      labels:
        layer: underlay
        bundle: a-core
        name: Transport 3
      layers: [underlay]
    - id: core-to-b
      source: p-core
      target: pe-b
      labels:
        layer: underlay
        name: Core to B
      layers: [underlay]
    - id: service-a
      source: payment-svc
      target: pe-a
      labels:
        layer: service
        name: Service A
      layers: [service]
    - id: service-b
      source: payment-svc
      target: pe-b
      labels:
        layer: service
        name: Service B
      layers: [service]
    - id: ops-b
      source: noc
      target: pe-b
      labels:
        layer: operations
        name: Incident
      layers: [operations]
      data:
        severity: major
  paths:
    - id: payment-path
      labels:
        service: payments
        name: Payment path
      layers: [service]
      sequence: [pe-a, p-core, pe-b]
  regions:
    - id: core-region
      labels:
        scope: underlay
        name: Core Region
      layers: [underlay]
      members: [pe-a, p-core, pe-b]
attention:
  query:
    pathIds: [payment-path]
    mode: dim-context
  aggregate:
    expandedGroupIds:
      - summary-core
    groups:
      - id: summary-core
        by: region
        regionId: core-region
    expandOnClick: true
  links:
    grouping:
      threshold: 2
