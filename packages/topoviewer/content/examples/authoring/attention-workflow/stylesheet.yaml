labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router.pe
      shape: square
      width: 48
      height: 48
      borderWidth: 3
      borderColor: "#90caf9"
      iconFit: contain
      iconPadding: 0
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
  - selector: node[labels.role = "pe"]
    style:
      icon: router.pe
      shape: square
      backgroundColor: "#1976d2"
      borderColor: "#1976d2"
      underlayColor: "#42a5f5"
      underlayOpacity: 0.2
      underlayPadding: 9
  - selector: node[labels.role = "p"]
    style:
      icon: router.pe
      shape: square
      backgroundColor: "#2e7d32"
      borderColor: "#a5d6a7"
  - selector: node[labels.role = "service"]
    style:
      icon: service
  - selector: node[labels.role = "ops"]
    style:
      icon: ops
  - selector: node[data.severity = "major"]
    style:
      statusColor: "#ff9800"
      outlineColor: "#ff9800"
      outlineWidth: 5
      outlineOpacity: 0.9
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#90a4ae"
      lineWidth: 3
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.layer = "service"]
    style:
      curveStyle: smoothTaxi
      lineColor: "#ff9800"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#ff9800"
  - selector: link[data.severity = "major"]
    style:
      lineColor: "#d32f2f"
      lineStyle: dashed
      targetArrowShape: triangle
      targetArrowColor: "#d32f2f"
  - selector: path[labels.service = "payments"]
    style:
      curveStyle: smoothTaxi
      lineColor: "#0288d1"
      lineWidth: 4
      laneWidth: 8
      laneGap: 8
      targetArrowShape: triangle
      targetArrowColor: "#0288d1"
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.12)"
      borderColor: "rgba(66, 165, 245, 0.58)"
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
