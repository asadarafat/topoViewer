version: "0.2"
graph:
  id: gradient-and-interaction
  layers:
    - id: metro
      labels:
        name: Metro
  nodes:
    - id: SRC
      layers:
        - metro
      position:
        - 120
        - 110
      labels:
        name: SRC
    - id: DST
      layers:
        - metro
      position:
        - 520
        - 110
      labels:
        name: DST
    - id: REF-A
      layers:
        - metro
      position:
        - 120
        - 220
      labels:
        name: REF-A
    - id: REF-B
      layers:
        - metro
      position:
        - 520
        - 220
      labels:
        name: REF-B
  links:
    - id: gradient-service
      source: SRC
      target: DST
      labels:
        mode: active
        name: Gradient service
      layers:
        - metro
    - id: reference-edge
      source: REF-A
      target: REF-B
      labels:
        mode: reference
        name: Reference only
      layers:
        - metro
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
