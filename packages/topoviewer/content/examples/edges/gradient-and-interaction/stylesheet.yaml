layout:
  mode: manual
  width: 640
  height: 340
icons:
  node:
    glyph: N
    fill: "#334155"
    stroke: "#cbd5e1"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: node
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      curveStyle: bezier
      lineWidth: 5
      targetArrowShape: triangle
      targetArrowSize: 12
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.mode = "active"]
    style:
      label: gradient
      lineFill: linearGradient
      lineGradientStopColors:
        - "#22c55e"
        - "#0ea5e9"
        - "#f97316"
      lineGradientStopPositions:
        - 0%
        - 58%
        - 100%
      targetArrowColor: "#f97316"
  - selector: link[labels.mode = "reference"]
    style:
      label: non-interactive
      lineColor: "#94a3b8"
      lineDashPattern: 6 5
      targetArrowColor: "#64748b"
      interactive: false
      labelInteractive: false
