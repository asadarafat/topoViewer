version: "0.2"
layout:
  mode: manual
  width: 640
  height: 320
icons:
  router.generic:
    glyph: R
    fill: "#1976d2"
    stroke: "#bbdefb"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router.generic
      shape: square
      width: 64
      height: 64
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      metaColor: transparent
  - selector: link
    style:
      curveStyle: straight
      lineColor: "rgba(148, 163, 184, 0.42)"
      lineWidth: 16
      lineCap: round
      targetArrowShape: none
      directionalStrokes: true
      directionStartGap: 18
      directionCenterGap: 64
      directionLabelOffset: -30
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: var(--topoviewer-fg-strong)
  - selector: linkDirection
    style:
      lineCap: round
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: linkDirection[direction = "sourceToTarget"]
    style:
      lineColor: "#4caf50"
      targetArrowShape: triangle
      targetArrowColor: "#4caf50"
      targetArrowOffset: 0
  - selector: linkDirection[direction = "targetToSource"]
    style:
      lineColor: "#ff9800"
      sourceArrowShape: triangle
      sourceArrowColor: "#ff9800"
      sourceArrowOffset: 0
      lineStyle: dashed
      lineDashPattern: 12 8
