layout:
  mode: manual
  width: 640
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      curveStyle: bezier
      lineWidth: 3
      lineColor: "#2563eb"
      controlPointDistance: -38
      sourceArrowShape: circle
      targetArrowShape: square
      sourceArrowColor: "#16a34a"
      targetArrowColor: "#dc2626"
      sourceArrowSize: 18
      targetArrowSize: 18
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      labelFontStyle: italic
      labelBorderColor: "#94a3b8"
      labelBorderWidth: 1
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      sourceLabelColor: "#0369a1"
      sourceLabelBackgroundColor: "#e0f2fe"
      sourceLabelBorderColor: "#38bdf8"
      sourceLabelBorderWidth: 1
      sourceLabelFontWeight: 800
      sourceLabelOpacity: 0.94
      targetLabelColor: "#991b1b"
      targetLabelBackgroundColor: "#fee2e2"
      targetLabelBorderColor: "#f87171"
      targetLabelBorderWidth: 1
      targetLabelFontWeight: 800
      targetLabelOpacity: 0.94
      endpointLabelAutoPosition: true
      endpointLabelDistance: 22
      endpointLabelMaxDistance: 46
      endpointLabelSideOffset: 8
  - selector: link[labels.class = "gold"]
    style:
      label: Gold
      lineColor: "#f59e0b"
      sourceArrowColor: "#0f766e"
      targetArrowColor: "#b45309"
      sourceLabelXOffset: -2
      targetLabelYOffset: -2
  - selector: link[labels.class = "silver"]
    style:
      label: Silver
      lineColor: "#64748b"
      sourceArrowColor: "#475569"
      targetArrowColor: "#475569"
      sourceLabelSideOffset: -10
      targetLabelSideOffset: -10
