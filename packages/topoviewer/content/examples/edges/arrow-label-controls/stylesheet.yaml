layout:
  mode: manual
  width: 640
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      curveStyle: bezier
      lineWidth: 3
      lineColor: "#2563eb"
      controlPointDistance: -38
      sourceArrowShape: circle
      targetArrowShape: square
      sourceArrowColor: "#16a34a"
      targetArrowColor: "#dc2626"
      sourceArrowSize: 28
      targetArrowSize: 28
      sourceArrowLabelColor: "#ffffff"
      targetArrowLabelColor: "#ffffff"
      sourceArrowLabelFontWeight: 900
      targetArrowLabelFontWeight: 900
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      labelFontStyle: italic
      labelBorderColor: "#94a3b8"
      labelBorderWidth: 1
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      sourceLabelColor: "#0369a1"
      sourceLabelBackgroundColor: "#e0f2fe"
      sourceLabelBorderColor: "#38bdf8"
      sourceLabelBorderWidth: 1
      sourceArrowLabelXOffset: 0
      sourceArrowLabelYOffset: 0
      targetLabelColor: "#991b1b"
      targetLabelBackgroundColor: "#fee2e2"
      targetLabelBorderColor: "#f87171"
      targetLabelBorderWidth: 1
      targetArrowLabelXOffset: 0
      targetArrowLabelYOffset: 0
  - selector: link[labels.class = "gold"]
    style:
      label: Gold
      sourceArrowLabel: e1-1
      targetArrowLabel: e1-2
      lineColor: "#f59e0b"
      sourceArrowColor: "#0f766e"
      targetArrowColor: "#b45309"
  - selector: link[labels.class = "silver"]
    style:
      label: Silver
      sourceArrowLabel: e1-3
      targetArrowLabel: e1-4
      lineColor: "#64748b"
      sourceArrowColor: "#475569"
      targetArrowColor: "#475569"
