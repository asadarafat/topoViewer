version: "0.2"
graph:
  id: curve-styles
  layers:
    - id: transport
      labels:
        name: Transport
  nodes:
    - id: A
      labels:
        node: router
        name: A
      layers:
        - transport
      position:
        - 80
        - 190
    - id: B
      labels:
        node: router
        name: Straight
      layers:
        - transport
      position:
        - 360
        - 70
    - id: C
      labels:
        node: router
        name: Taxi
      layers:
        - transport
      position:
        - 360
        - 150
    - id: D
      labels:
        node: router
        name: Smooth
      layers:
        - transport
      position:
        - 360
        - 230
    - id: E
      labels:
        node: router
        name: Bezier
      layers:
        - transport
      position:
        - 360
        - 310
  links:
    - id: edge-0
      source: A
      target: B
      labels:
        link: transport
        curve: straight
        name: straight
      layers:
        - transport
    - id: edge-1
      source: A
      target: C
      labels:
        link: transport
        curve: taxi
        name: taxi
      layers:
        - transport
    - id: edge-2
      source: A
      target: D
      labels:
        link: transport
        curve: smooth-taxi
        name: smooth-taxi
      layers:
        - transport
    - id: edge-3
      source: A
      target: E
      labels:
        link: transport
        curve: unbundled-bezier
        name: unbundled-bezier
      layers:
        - transport
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Show labels
