layout:
  mode: manual
  width: 520
  height: 400
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.curve = "straight"]
    style:
      label: straight
      curveStyle: straight
      lineColor: "#60a5fa"
      targetArrowShape: triangle
  - selector: link[labels.curve = "taxi"]
    style:
      label: taxi
      curveStyle: taxi
      lineColor: "#f59e0b"
      targetArrowShape: triangle
  - selector: link[labels.curve = "smooth-taxi"]
    style:
      label: smooth-taxi
      curveStyle: smooth-taxi
      lineColor: "#22c55e"
      targetArrowShape: triangle
  - selector: link[labels.curve = "unbundled-bezier"]
    style:
      label: unbundled-bezier
      curveStyle: unbundled-bezier
      lineColor: "#c084fc"
      targetArrowShape: triangle
