site_name: TopoViewer
site_description: Declarative graph renderer for network, infrastructure, and service-topology diagrams.
site_url: https://asadarafat.github.io/topoviewer/docs/mkdocs/
repo_url: https://github.com/asadarafat/topoviewer
repo_name: asadarafat/topoviewer

docs_dir: docs
site_dir: site/docs/mkdocs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - topoviewer

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

nav:
  - Home: index.md
  - Start:
      - Why TopoViewer: topoviewer/start/why-topoviewer.md
      - First Topology: topoviewer/start/first-topology.md
      - Style Your First Topology: topoviewer/start/style-your-first-topology.md
  - Author:
      - Authoring Model: topoviewer/author/authoring-model.md
      - Layout: topoviewer/author/layout.md
      - Attention: topoviewer/author/attention.md
      - Validate YAML: topoviewer/author/validate-yaml.md
      - Debug Rendering: topoviewer/author/debug-rendering.md
  - Embed:
      - React: topoviewer/embed/react.md
      - MkDocs: topoviewer/embed/mkdocs.md
      - Static HTML / Zensical Adapter: topoviewer/embed/static-html-zensical-adapter.md
  - Examples:
      - Examples Gallery: topoviewer/examples/examples-gallery.md
      - YAML to Network Diagram: topoviewer/examples/yaml-to-network-diagram/index.md
      - Kubernetes Service Map: topoviewer/examples/kubernetes-service-map/index.md
      - Real Network Demo: topoviewer/examples/real-network-demo.md
      - Object Family Examples: topoviewer/examples/object-family-examples.md
      - Generated Catalog:
          - Graph: topoviewer/reference/graph/index.md
          - Nodes: topoviewer/reference/nodes/index.md
          - Edges: topoviewer/reference/edges/index.md
          - Paths: topoviewer/reference/paths/index.md
          - Attention: topoviewer/reference/attention/index.md
          - Regions: topoviewer/reference/regions/index.md
          - Shapes: topoviewer/reference/shapes/index.md
          - Callouts: topoviewer/reference/callouts/index.md
          - Styling: topoviewer/reference/styling/index.md
          - Layout: topoviewer/reference/layout/index.md
