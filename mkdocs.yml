site_name: TopoViewer
site_description: Declarative graph renderer for network, infrastructure, and service-topology diagrams.
site_url: https://asadarafat.github.io/topoviewer/docs/mkdocs/
repo_url: https://github.com/asadarafat/topoviewer
repo_name: asadarafat/topoviewer

docs_dir: docs
site_dir: site/docs/mkdocs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - topoviewer

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

nav:
  - Home: index.md
  - Start:
      - Why TopoViewer: topoviewer/start/why-topoviewer.md
      - First Topology: topoviewer/start/first-topology.md
