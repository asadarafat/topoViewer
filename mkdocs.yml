site_name: TopoViewer
site_description: Declarative graph renderer for network, infrastructure, and service-topology diagrams.
site_url: https://asadarafat.github.io/topoviewer/docs/mkdocs/
repo_url: https://github.com/asadarafat/topoviewer
repo_name: asadarafat/topoviewer

docs_dir: docs
site_dir: site/docs/mkdocs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - topoviewer

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

nav:
  - Home: index.md
  - Start:
      - First Topology: topoviewer/getting-started.md
      - Browser Harness: topoviewer/browser-harness.md
      - Why TopoViewer: topoviewer/why-topoviewer.md
      - YAML to Diagram: topoviewer/yaml-to-diagram/index.md
  - Author:
      - Authoring: topoviewer/authoring.md
      - Style a Topology: topoviewer/style-a-topology.md
      - Stylesheet: topoviewer/stylesheet.md
      - Attention: topoviewer/attention.md
      - Layout: topoviewer/layout-guide.md
      - Validate YAML: topoviewer/validate-yaml.md
      - Debug Rendering: topoviewer/debugging.md
  - Embed:
      - React: topoviewer/react.md
      - MkDocs: topoviewer/mkdocs.md
      - Zensical: topoviewer/zensical.md
      - Integration Roadmap: topoviewer/integration-roadmap.md
  - Examples:
      - Curated Examples: topoviewer/examples.md
      - Real Network Demo: topoviewer/real-network-demo.md
      - Generated Catalog:
          - Graph: topoviewer/reference/graph/index.md
          - Nodes: topoviewer/reference/nodes/index.md
          - Edges: topoviewer/reference/edges/index.md
          - Paths: topoviewer/reference/paths/index.md
          - Attention: topoviewer/reference/attention/index.md
          - Regions: topoviewer/reference/regions/index.md
          - Shapes: topoviewer/reference/shapes/index.md
          - Callouts: topoviewer/reference/callouts/index.md
          - Styling: topoviewer/reference/styling/index.md
          - Layout: topoviewer/reference/layout/index.md
          - Harness: topoviewer/reference/harness/index.md
          - Validation: topoviewer/reference/validation/index.md
  - Reference:
      - Reference Model: topoviewer/reference-model.md
      - YAML Schemas: topoviewer/schemas.md
      - TypeScript API: topoviewer/api-reference.md
      - Compatibility: topoviewer/compatibility.md
      - Glossary: topoviewer/glossary.md
  - Labs:
      - Grafana Guide: topoviewer/grafana.md
      - Grafana Telemetry Call Flow: topoviewer/grafana-telemetry-call-flow.md
  - Maintainers:
      - Monorepo: topoviewer/monorepo.md
      - Hardening: topoviewer/production.md
      - Release: topoviewer/release.md
      - Documentation Standard: topoviewer/docs-standard.md
