dev_addr = "127.0.0.1:8002"
copyright = "Copyright &copy; 2026 TopoViewer contributors"
repo_url = "https://github.com/asadarafat/topoviewer"
repo_name = "asadarafat/topoviewer"
extra_css = [
  "assets/topoviewer/topoviewer-embed.css",
  "assets/topoviewer/topoviewer-zensical.css",
]
extra_javascript = [
  "assets/topoviewer/topoviewer-embed.iife.js",
  "assets/topoviewer/topoviewer-zensical.js",
]
