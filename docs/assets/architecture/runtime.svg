<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">TopoViewer runtime component flow</title><desc id="desc">A host supplies topology and stylesheet source. Parsing and validation produce a composed document. Compilation resolves styles and layout into a render model. The React runtime displays that model. Hosts own collection, authentication, persistence and application controls.</desc>
