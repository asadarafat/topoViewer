version: "0.2"
graph:
  id: vscode-layered-authoring
  layers:
    - id: underlay
      labels:
        name: Underlay
    - id: bgp
      labels:
        name: BGP
    - id: service
      labels:
        name: Service
    - id: operations
      labels:
        name: Operations
  nodes:
    - id: fra-pe
      labels:
        role: pe
        site: fra
        name: FRA-PE
      data:
        status: ok
      layers: [underlay, bgp, service, operations]
      position: [150, 260]
    - id: ams-p
      labels:
        role: p
        site: ams
        name: AMS-P
      data:
        status: ok
      layers: [underlay, service]
      position: [380, 260]
    - id: lon-pe
      labels:
        role: pe
        site: lon
        name: LON-PE
      data:
        status: degraded
        severity: major
      layers: [underlay, bgp, service, operations]
      position: [610, 260]
    - id: rr
      labels:
        role: rr
        protocol: bgp
        name: RR-1
      data:
        status: established
      layers: [bgp]
      position: [380, 96]
    - id: payments
      labels:
        role: service
        tenant: payments
        name: Payments VPN
      data:
        status: active
      layers: [service]
      position: [380, 420]
    - id: noc
      labels:
        role: ops
        name: NOC
      data:
        status: investigating
      layers: [operations]
      position: [800, 118]
  links:
    - id: underlay-fra-ams
      source: fra-pe
      target: ams-p
      labels:
        layer: underlay
        name: FRA to AMS
      layers: [underlay]
      data:
        capacity: 400G
    - id: underlay-ams-lon
      source: ams-p
      target: lon-pe
      labels:
        layer: underlay
        name: AMS to LON
      layers: [underlay]
      data:
        capacity: 400G
    - id: bgp-fra-rr
      source: fra-pe
      target: rr
      labels:
        protocol: bgp
        name: FRA iBGP
      layers: [bgp]
      data:
        status: established
    - id: bgp-lon-rr
      source: lon-pe
      target: rr
      labels:
        protocol: bgp
        name: LON iBGP
      layers: [bgp]
      data:
        status: established
    - id: service-fra
      source: payments
      target: fra-pe
      labels:
        layer: service
        tenant: payments
        name: FRA service access
      layers: [service]
    - id: service-lon
      source: payments
      target: lon-pe
      labels:
        layer: service
        tenant: payments
        name: LON service access
      layers: [service]
    - id: ops-alert
      source: noc
      target: lon-pe
      labels:
        layer: operations
        name: Active incident
      layers: [operations]
      data:
        severity: major
        status: investigating
  paths:
    - id: payments-path
      labels:
        service: payments
        name: Payments service path
      layers: [service]
      data:
        status: active
      sequence:
        - fra-pe
        - ams-p
        - lon-pe
  regions:
    - id: provider-core
      labels:
        scope: underlay
        name: Provider core
      layers: [underlay]
      members:
        - fra-pe
        - ams-p
        - lon-pe
      paddingX: 36
      paddingY: 32
      headerPadding: 34
layout:
  mode: manual
  width: 940
  height: 520
