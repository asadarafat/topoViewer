version: "0.2"
graph:
  id: region-label-placement
  layers:
    - id: site
      labels:
        name: Site
  nodes:
    - id: edge-a
      labels:
        role: gateway
        name: EDGE-A
      layers:
        - site
      position:
        - 160
        - 180
    - id: edge-b
      labels:
        role: gateway
        name: EDGE-B
      layers:
        - site
      position:
        - 480
        - 180
  links:
    - id: edge-a-b
      source: edge-a
      target: edge-b
      layers:
        - site
      labels:
        name: East-west transport
  regions:
    - id: single-node-site
      labels:
        placement: top
        name: Single Node Site
      members:
        - edge-a
      layers:
        - site
    - id: side-label-site
      labels:
        placement: side
        name: Side Label Site
      members:
        - edge-b
      layers:
        - site
toggles:
  - id: showRegions
    default: true
    labels:
      name: Show regions
