version: "0.2"
graph:
  id: directional-link-strokes
  layers:
    - id: fabric
      labels:
        name: Fabric
  nodes:
    - id: Leaf-1
      labels:
        node: leaf
        name: Leaf-1
      layers:
        - fabric
      position:
        - 140
        - 180
    - id: Spine-1
      labels:
        node: spine
        name: Spine-1
      layers:
        - fabric
      position:
        - 500
        - 180
  links:
    - id: Leaf-1-Spine-1
      source: Leaf-1
      target: Spine-1
      labels:
        link: fabric
        metric: utilization
        name: Leaf-1 to Spine-1
      layers:
        - fabric
      directions:
        sourceToTarget:
          label: 3.2 Gbps
          labels:
            direction: eastbound
          data:
            utilization: 64
            metric: if_out_bps
        targetToSource:
          label: 1.1 Gbps
          labels:
            direction: westbound
          data:
            utilization: 22
            metric: if_out_bps
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Direction labels
