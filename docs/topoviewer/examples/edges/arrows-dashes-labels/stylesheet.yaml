layout:
  mode: manual
  width: 640
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.node = "controller"]
    style:
      icon: controller
      width: 104
  - selector: link[labels.direction = "request"]
    style:
      label: request
      curveStyle: unbundled-bezier
      lineColor: "#fbbf24"
      lineDashPattern: 5 5
      targetArrowShape: triangle
  - selector: link[labels.direction = "reply"]
    style:
      label: reply
      curveStyle: unbundled-bezier
      lineColor: "#38bdf8"
      lineDashPattern: 2 5
      targetArrowShape: triangle
