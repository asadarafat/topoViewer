version: "0.2"
graph:
  id: arrows-dashes-labels
  layers:
    - id: controller
      labels:
        name: Controller
  nodes:
    - id: PCC
      labels:
        node: router
        name: PCC
      layers:
        - controller
      position:
        - 130
        - 160
    - id: PCE
      labels:
        node: controller
        name: PCE
      layers:
        - controller
      position:
        - 490
        - 160
  links:
    - id: pcep-request
      source: PCC
      target: PCE
      labels:
        link: control
        direction: request
        name: Path request
      layers:
        - controller
    - id: pcep-reply
      source: PCE
      target: PCC
      labels:
        link: control
        direction: reply
        name: Path reply
      layers:
        - controller
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Show labels
