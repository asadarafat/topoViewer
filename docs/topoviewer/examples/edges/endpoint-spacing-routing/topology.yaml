version: "0.2"
graph:
  id: endpoint-spacing-routing
  layers:
    - id: transport
      labels:
        name: Transport
  nodes:
    - id: WEST
      labels:
        side: west
        name: WEST
      layers:
        - transport
      position:
        - 100
        - 150
    - id: EAST
      labels:
        side: east
        name: EAST
      layers:
        - transport
      position:
        - 540
        - 150
    - id: NORTH
      labels:
        side: north
        name: NORTH
      layers:
        - transport
      position:
        - 320
        - 70
    - id: SOUTH
      labels:
        side: south
        name: SOUTH
      layers:
        - transport
      position:
        - 320
        - 240
  links:
    - id: segment-route
      source: WEST
      target: EAST
      labels:
        route: segment
        name: Segment route
      layers:
        - transport
    - id: taxi-route
      source: NORTH
      target: SOUTH
      labels:
        route: taxi
        name: Taxi route
      layers:
        - transport
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
