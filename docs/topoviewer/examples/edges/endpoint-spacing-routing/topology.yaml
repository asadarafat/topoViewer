graph:
  id: endpoint-spacing-routing
  layers:
    - id: transport
      name: Transport
  nodes:
    - id: WEST
      name: WEST
      labels:
        side: west
      layers:
        - transport
      position:
        - 100
        - 150
    - id: EAST
      name: EAST
      labels:
        side: east
      layers:
        - transport
      position:
        - 540
        - 150
    - id: NORTH
      name: NORTH
      labels:
        side: north
      layers:
        - transport
      position:
        - 320
        - 70
    - id: SOUTH
      name: SOUTH
      labels:
        side: south
      layers:
        - transport
      position:
        - 320
        - 240
  links:
    - id: segment-route
      name: Segment route
      source: WEST
      target: EAST
      labels:
        route: segment
      layers:
        - transport
    - id: taxi-route
      name: Taxi route
      source: NORTH
      target: SOUTH
      labels:
        route: taxi
      layers:
        - transport
toggles:
  - id: showEdgeLabels
    name: Edge labels
    default: true
