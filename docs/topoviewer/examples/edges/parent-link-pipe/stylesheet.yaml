version: "0.2"
layout:
  mode: manual
  width: 700
  height: 390
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.node = "service"]
    style:
      icon: service
      width: 92
      height: 46
      labelFontSize: 11
  - selector: link[labels.link = "transport"]
    style:
      label: Transport pipe
      curveStyle: smooth-taxi
      lineColor: "#fb7185"
      pipe: true
      pipeWidth: 24
      pipeOpacity: 0.18
  - selector: link[labels.link = "service"]
    style:
      label: Service lane
      curveStyle: smooth-taxi
      lineColor: "#22c55e"
      lineWidth: 3
      laneWidth: 6
      laneGap: 8
      targetArrowShape: triangle
