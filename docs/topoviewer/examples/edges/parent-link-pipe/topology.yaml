version: "0.2"
graph:
  id: parent-link-pipe
  layers:
    - id: transport
      labels:
        name: Transport
    - id: service
      labels:
        name: Service
  nodes:
    - id: PE1
      labels:
        node: router
        name: PE1
      layers:
        - transport
        - service
      position:
        - 130
        - 170
    - id: PE2
      labels:
        node: router
        name: PE2
      layers:
        - transport
        - service
      position:
        - 520
        - 170
    - id: svc-a
      labels:
        node: service
        name: VPN A
      parent: PE1
      layers:
        - service
    - id: svc-b
      labels:
        node: service
        name: VPN B
      parent: PE2
      layers:
        - service
  links:
    - id: transport-link
      source: PE1
      target: PE2
      labels:
        link: transport
        name: SR-TE transport pipe
      layers:
        - transport
        - service
    - id: service-link
      source: svc-a
      target: svc-b
      parent: transport-link
      labels:
        link: service
        name: Service carried inside transport
      layers:
        - service
toggles:
  - id: showChildNodesInsideParents
    default: true
    labels:
      name: Show child nodes inside parents
  - id: showEdgeLabels
    default: true
    labels:
      name: Show labels
