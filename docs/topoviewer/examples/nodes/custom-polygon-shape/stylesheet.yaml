version: "0.2"
layout:
  mode: manual
  width: 560
  height: 340
icons:
  collector:
    glyph: T
    fill: "#0f766e"
    stroke: "#99f6e4"
  site:
    glyph: S
    fill: "#f59e0b"
    stroke: "#fde68a"
stylesheet:
  - selector: node
    style:
      width: 108
      height: 82
      iconSize: 58
      borderWidth: 3
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
  - selector: node[labels.role = "collector"]
    style:
      icon: collector
      shape: tag
  - selector: node[labels.role = "site"]
    style:
      icon: site
      shape: polygon
      shapePolygonPoints: "0 -1 0.92 -0.12 0.58 1 -0.58 1 -0.92 -0.12"
  - selector: link
    style:
      lineColor: "#14b8a6"
      lineWidth: 2
      lineDashPattern: 6 4
      targetArrowShape: triangle
  - selector: node[id = "site-b"]
    style:
      shape: polygon
      shapePolygonPoints:
        - 0
        - -1
        - 0.92
        - -0.12
        - 0.58
        - 1
        - -0.58
        - 1
        - -0.92
        - -0.12
