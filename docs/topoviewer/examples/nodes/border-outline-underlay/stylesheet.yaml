version: "0.2"
layout:
  mode: manual
  width: 640
  height: 320
icons:
  pe:
    glyph: PE
    fill: "#2563eb"
    stroke: "#bfdbfe"
  firewall:
    glyph: FW
    fill: "#f97316"
    stroke: "#fed7aa"
  app:
    glyph: APP
    fill: "#dc2626"
    stroke: "#fecaca"
stylesheet:
  - selector: node
    style:
      width: 108
      height: 76
      iconSize: 52
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "pe"]
    style:
      icon: pe
      shape: hexagon
  - selector: node[labels.state = "warning"]
    style:
      icon: firewall
      shape: cutRectangle
      borderStyle: dashed
      borderDashPattern: [7, 4]
      borderOpacity: 0.86
      outlineColor: "#f59e0b"
      outlineWidth: 4
      outlineOpacity: 0.74
      underlayColor: "#fef3c7"
      underlayPadding: 10
      underlayOpacity: 0.65
  - selector: node[labels.state = "critical"]
    style:
      icon: app
      shape: roundRectangle
      borderStyle: dotted
      borderOpacity: 0.92
      outlineColor: "#dc2626"
      outlineWidth: 5
      outlineOpacity: 0.82
      underlayColor: "#fee2e2"
      underlayPadding: 12
      underlayOpacity: 0.7
  - selector: link
    style:
      lineColor: "#94a3b8"
      lineWidth: 2
      targetArrowShape: none
