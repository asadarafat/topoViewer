graph:
  id: stitched-child-path
  layers:
    - id: physical
      name: Physical
    - id: transport
      name: Transport
    - id: service
      name: Service
  nodes:
    - id: AGG1
      name: AGG1
      labels:
        node: agg
      layers:
        - physical
        - transport
        - service
      position:
        - 80
        - 210
    - id: PE1
      name: PE1
      labels:
        node: router
      layers:
        - physical
        - transport
      position:
        - 280
        - 210
    - id: P
      name: P
      labels:
        node: router
      layers:
        - physical
        - transport
      position:
        - 480
        - 210
    - id: PE2
      name: PE2
      labels:
        node: router
      layers:
        - physical
        - transport
      position:
        - 680
        - 210
    - id: AGG2
      name: AGG2
      labels:
        node: agg
      layers:
        - physical
        - transport
        - service
      position:
        - 880
        - 210
    - id: services-1-10-agg1
      name: "**Services** ++1-10++"
      labels:
        node: service
        scope: aggregate
      data:
        serviceCount: 10
      parent: AGG1
      layers:
        - service
    - id: services-1-10-agg2
      name: "**Services** ++1-10++"
      labels:
        node: service
        scope: aggregate
      data:
        serviceCount: 10
      parent: AGG2
      layers:
        - service
  links:
    - id: phy-agg1-pe1
      name: AGG1 to PE1 physical link
      source: AGG1
      target: PE1
      labels:
        link: physical
      layers:
        - physical
    - id: phy-pe1-p
      name: PE1 to P physical link
      source: PE1
      target: P
      labels:
        link: physical
      layers:
        - physical
    - id: phy-p-pe2
      name: P to PE2 physical link
      source: P
      target: PE2
      labels:
        link: physical
      layers:
        - physical
    - id: phy-pe2-agg2
      name: PE2 to AGG2 physical link
      source: PE2
      target: AGG2
      labels:
        link: physical
      layers:
        - physical
  paths:
    - id: transport-agg1-agg2
      name: AGG transport carrier
      labels:
        path: transport
        protocol: sr-te
      layers:
        - transport
        - service
      sequence:
        - AGG1
        - PE1
        - P
        - PE2
        - AGG2
    - id: stitched-services-a-j
      name: Services A-J stitched over transport
      source: services-1-10-agg1
      target: services-1-10-agg2
      parent: transport-agg1-agg2
      labels:
        path: service
        service: l3vpn
        scope: aggregate
      data:
        serviceCount: 10
      layers:
        - service
toggles:
  - id: showChildNodesInsideParents
    name: Show child nodes inside parents
    default: true
  - id: showEdgeLabels
    name: Show labels
    default: true
