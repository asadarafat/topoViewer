version: "0.2"
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
graph:
  id: label-z-index
  layers:
    - id: physical
      labels:
        name: Physical
  nodes:
    - id: CORE-1
      labels:
        role: core
        name: CORE-1
      layers:
        - physical
      position:
        - 190
        - 155
    - id: PE-1
      labels:
        role: edge
        name: PE-1
      layers:
        - physical
      position:
        - 390
        - 155
  links:
    - id: CORE-1-PE-1
      source: CORE-1
      target: PE-1
      labels:
        link: transport
        name: CORE to PE
      layers:
        - physical
  regions:
    - id: transport-domain
      labels:
        region: domain
        name: Transport domain
      members:
        - CORE-1
        - PE-1
      layers:
        - physical
