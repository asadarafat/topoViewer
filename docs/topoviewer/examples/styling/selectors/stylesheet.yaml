layout:
  mode: manual
  width: 620
  height: 310
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.vendor = "nokia"]
    style:
      backgroundColor: "#124191"
      borderColor: "#dbeafe"
  - selector: node[labels.vendor = "cisco"]
    style:
      backgroundColor: "#0891b2"
      borderColor: "#cffafe"
  - selector: node[labels.role = "asbr"]
    style:
      width: 104
