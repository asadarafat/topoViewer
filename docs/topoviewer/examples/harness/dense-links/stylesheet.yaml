              <line x1="59.8" y1="37.2" x2="97.9" y2="37.2" class="st1" />
            </g>
          </g>
          <g>
            <path d="M27.6,92.2L20.9,85c-1.2-1.2-1.2-2.9,0-4.1l6.7-7.7" class="st1" />
