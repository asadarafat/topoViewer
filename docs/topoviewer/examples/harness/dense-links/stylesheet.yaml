labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router.pe
      shape: square
      width: 48
      height: 48
      borderWidth: 3
      borderColor: "#90caf9"
      iconFit: contain
      iconPadding: 0
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
  - selector: node[labels.role = "router"]
    style:
      icon: router.pe
      shape: square
      backgroundColor: "#1976d2"
      borderColor: "#1976d2"
      underlayColor: "#42a5f5"
      underlayOpacity: 0.2
      underlayPadding: 9
  - selector: node[labels.role = "ops"]
    style:
      icon: ops
      backgroundColor: "#2e7d32"
      borderColor: "#a5d6a7"
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#1976d2"
      lineWidth: 3
      controlPointStepSize: 42
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.layer = "observability"]
    style:
      curveStyle: smoothTaxi
      lineColor: "#2e7d32"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#2e7d32"
