icons:
  router:
    glyph: ""
    fill: "#1976d2"
    stroke: "#90caf9"
  p:
    glyph: ""
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  service:
    glyph: ""
    fill: "#ff9800"
    stroke: "#ffe0b2"
  ops:
    glyph: "!"
    fill: "#d32f2f"
    stroke: "#ffcdd2"
labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router
      shape: ellipse
      width: 92
      height: 76
      borderColor: "#1976d2"
      borderWidth: 2
      labelColor: "#0f172a"
      labelFontWeight: 800
      labelBackgroundColor: "#ffffff"
      labelPadding: 4
  - selector: node[labels.role = "p"]
    style:
      icon: p
      borderColor: "#2e7d32"
  - selector: node[labels.role = "service"]
    style:
      icon: service
      shape: roundRectangle
      width: 128
      height: 64
      borderColor: "#ff9800"
  - selector: node[labels.role = "ops"]
    style:
      icon: ops
      shape: octagon
      borderColor: "#d32f2f"
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#64748b"
      lineWidth: 3
      targetArrowShape: none
  - selector: link[labels.layer = "service"]
    style:
      curveStyle: smooth-taxi
      lineColor: "#ff9800"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#ff9800"
  - selector: link[data.severity = "major"]
    style:
      lineColor: "#d32f2f"
      lineStyle: dashed
      targetArrowShape: triangle
      targetArrowColor: "#d32f2f"
  - selector: path[labels.service = "payments"]
    style:
      curveStyle: smooth-taxi
      lineColor: "#0288d1"
      lineWidth: 4
      laneWidth: 8
      laneGap: 8
      targetArrowShape: triangle
      targetArrowColor: "#0288d1"
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.08)"
      borderColor: "rgba(25, 118, 210, 0.34)"
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
