graph:
  id: vscode-insert-workflow
  layers:
    - id: underlay
      name: Underlay
    - id: service
      name: Service
    - id: notes
      name: Notes
    - id: operations
      name: Operations
  nodes:
    - id: edge-a
      name: Edge A
      labels:
        role: router
        site: a
      data:
        status: ok
      layers: [underlay, service]
      position: [170, 260]
    - id: edge-b
      name: Edge B
      labels:
        role: router
        site: b
      data:
        status: ok
      layers: [underlay, service, operations]
      position: [520, 260]
    - id: payment-svc
      name: Payment Service
      labels:
        role: service
      data:
        status: active
      layers: [service]
      position: [345, 410]
    - id: noc
      name: NOC
      labels:
        role: ops
      data:
        severity: minor
      layers: [operations]
      position: [700, 120]
  links:
    - id: underlay-a-b
      name: Underlay A-B
      source: edge-a
      target: edge-b
      labels:
        layer: underlay
      layers: [underlay]
    - id: service-a
      name: Service access A
      source: payment-svc
      target: edge-a
      labels:
        layer: service
      layers: [service]
    - id: ops-edge-b
      name: Active ticket
      source: noc
      target: edge-b
      labels:
        layer: operations
      layers: [operations]
      data:
        severity: minor
  regions:
    - id: access-region
      name: Access Region
      labels:
        scope: underlay
      layers: [underlay]
      members: [edge-a, edge-b]
      paddingX: 34
      paddingY: 30
      headerPadding: 34
diagram:
  callouts:
    - id: insert-note
      title: Insert target
      body: Use selected nodes for new links or regions.
      target: edge-a
      size: [180, 72]
      layers: [notes]
layout:
  mode: manual
  width: 820
  height: 520
