labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router.pe
      shape: square
      width: 48
      height: 48
      borderWidth: 3
      borderColor: "#90caf9"
      iconFit: contain
      iconPadding: 0
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
  - selector: node[labels.role = "router"]
    style:
      icon: router.pe
      shape: square
      backgroundColor: "#1976d2"
      borderColor: "#1976d2"
      underlayColor: "#42a5f5"
      underlayOpacity: 0.2
      underlayPadding: 9
  - selector: node[labels.role = "firewall"]
    style:
      icon: firewall
      shape: square
      backgroundColor: "#d32f2f"
      borderColor: "#d32f2f"
      outlineColor: "#ef5350"
      outlineWidth: 4
      outlineOpacity: 0.72
  - selector: node[labels.role = "service"]
    style:
      icon: service
  - selector: link
    style:
      curveStyle: smoothTaxi
      lineColor: "#90a4ae"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#90a4ae"
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.layer = "security"]
    style:
      lineColor: "#d32f2f"
      targetArrowColor: "#d32f2f"
