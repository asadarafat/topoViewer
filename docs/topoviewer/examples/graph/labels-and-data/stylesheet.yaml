version: "0.2"
layout:
  mode: manual
  width: 620
  height: 320
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: VPN
    fill: "#7c3aed"
    stroke: "#ddd6fe"
  controller:
    glyph: NSP
    fill: "#f59e0b"
    stroke: "#fde68a"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 84
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: link
    style:
      label: Link
      lineColor: "#60a5fa"
      lineWidth: 1
      targetArrowShape: none
      labelColor: var(--topoviewer-fg-strong)
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: node[labels.role = "pe"]
    style:
      backgroundColor: "#1d4ed8"
      borderColor: "#bfdbfe"
  - selector: node[labels.role = "p"]
    style:
      backgroundColor: "#0f766e"
      borderColor: "#ccfbf1"
  - selector: link[labels.protocol = "isis"]
    style:
      label: IS-IS metric 20
      lineColor: "#22c55e"
