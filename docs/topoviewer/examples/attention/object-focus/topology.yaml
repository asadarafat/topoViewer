version: "0.2"
graph:
  id: attention-object-focus
  layers:
    - id: service
      labels:
        name: Service
  nodes:
    - id: client
      labels:
        role: endpoint
        name: Client
      data:
        severity: normal
      layers:
        - service
      position:
        - 80
        - 180
    - id: edge
      labels:
        role: gateway
        name: Edge
      data:
        severity: normal
      layers:
        - service
      position:
        - 270
        - 180
    - id: api
      labels:
        role: service
        name: API
      data:
        severity: critical
      layers:
        - service
      position:
        - 460
        - 180
    - id: cache
      labels:
        role: support
        name: Cache
      data:
        severity: normal
      layers:
        - service
      position:
        - 460
        - 320
  links:
    - id: link-client-edge
      source: client
      target: edge
      labels:
        link: service
        name: Client to edge
      layers:
        - service
    - id: link-edge-api
      source: edge
      target: api
      labels:
        link: service
        name: Edge to API
      layers:
        - service
    - id: link-api-cache
      source: api
      target: cache
      labels:
        link: support
        name: API to cache
      layers:
        - service
  paths:
    - id: checkout-flow
      sequence:
        - client
        - edge
        - api
      labels:
        path: service
        name: Checkout flow
      data:
        severity: critical
      layers:
        - service
attention:
  interactive: true
  clickMode: dim-context
