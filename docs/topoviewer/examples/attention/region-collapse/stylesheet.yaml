layout:
  mode: manual
  width: 720
  height: 430
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
labelFields:
  - name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "pe"]
    style:
      borderColor: "#bbf7d0"
      backgroundColor: "#16a34a"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 1.8
      targetArrowShape: none
      opacity: 0.8
  - selector: link[labels.link = "uplink"]
    style:
      lineColor: "#22c55e"
      lineWidth: 2.6
  - selector: region
    style:
      backgroundColor: "#0ea5e922"
      borderColor: "#38bdf8aa"
      borderRadius: 6
      borderWidth: 1
      zIndex: -20
