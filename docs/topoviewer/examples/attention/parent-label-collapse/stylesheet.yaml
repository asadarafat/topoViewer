version: "0.2"
layout:
  mode: manual
  width: 780
  height: 450
icons:
  router:
    glyph: R
    fill: "#2563eb"
    stroke: "#bfdbfe"
  service:
    glyph: SVC
    fill: "#7c3aed"
    stroke: "#ddd6fe"
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      icon: router
      width: 82
      height: 60
      borderWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
  - selector: node[labels.role = "service"]
    style:
      icon: service
      width: 94
      height: 54
      backgroundColor: "#7c3aed"
      borderColor: "#ddd6fe"
  - selector: node[labels.role = "access"]
    style:
      borderColor: "#bbf7d0"
      backgroundColor: "#16a34a"
  - selector: link
    style:
      curveStyle: smooth-step
      lineColor: "#64748b"
      lineWidth: 1.8
      targetArrowShape: none
      opacity: 0.82
  - selector: link[labels.link = "service"]
    style:
      label: Service
      lineColor: "#a78bfa"
      lineWidth: 2.8
      targetArrowShape: triangle
  - selector: link[labels.link = "uplink"]
    style:
      label: Uplink
      lineColor: "#22c55e"
      lineWidth: 2.6
