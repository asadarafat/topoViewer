graph:
  id: attention-link-grouping
  layers:
    - id: transport
      name: Transport
  nodes:
    - id: PE-1
      name: PE-1
      labels:
        role: pe
      layers:
        - transport
      position:
        - 120
        - 150
    - id: PE-2
      name: PE-2
      labels:
        role: pe
      layers:
        - transport
      position:
        - 500
        - 150
  links:
    - id: pe-1-pe-2-a
      name: 100G A
      source: PE-1
      target: PE-2
      labels:
        media: fiber
      layers:
        - transport
    - id: pe-1-pe-2-b
      name: 100G B
      source: PE-1
      target: PE-2
      labels:
        media: fiber
      layers:
        - transport
    - id: pe-1-pe-2-c
      name: 100G C
      source: PE-1
      target: PE-2
      labels:
        media: fiber
      layers:
        - transport
attention:
  links:
    grouping:
      enabled: true
      threshold: 2
      by:
        - endpoints
        - layer
      expandOnClick: true
layout:
  mode: manual
  width: 720
  height: 360
toggles:
  - id: showEdgeLabels
    name: Edge labels
    default: true
