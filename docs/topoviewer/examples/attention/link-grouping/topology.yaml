version: "0.2"
graph:
  id: attention-link-grouping
  layers:
    - id: transport
      labels:
        name: Transport
  nodes:
    - id: PE-1
      labels:
        role: pe
        name: PE-1
      layers:
        - transport
      position:
        - 120
        - 150
    - id: PE-2
      labels:
        role: pe
        name: PE-2
      layers:
        - transport
      position:
        - 500
        - 150
  links:
    - id: pe-1-pe-2-a
      source: PE-1
      target: PE-2
      labels:
        media: fiber
        name: 100G A
      layers:
        - transport
    - id: pe-1-pe-2-b
      source: PE-1
      target: PE-2
      labels:
        media: fiber
        name: 100G B
      layers:
        - transport
    - id: pe-1-pe-2-c
      source: PE-1
      target: PE-2
      labels:
        media: fiber
        name: 100G C
      layers:
        - transport
attention:
  links:
    grouping:
      enabled: true
      threshold: 2
      by:
        - endpoints
        - layer
      expandOnClick: true
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
