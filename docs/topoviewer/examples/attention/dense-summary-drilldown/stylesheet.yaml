version: "0.2"
icons:
  pe:
    glyph: PE
    fill: '#6d28d9'
    stroke: '#ddd6fe'
  aggregation:
    glyph: A
    fill: '#0369a1'
    stroke: '#bae6fd'
  edge:
    glyph: E
    fill: '#0f766e'
    stroke: '#ccfbf1'
labelFields:
  - labels.name
  - label
  - count
stylesheet:
  - selector: node
    style:
      width: 76
      height: 58
      borderWidth: 1.5
      labelFontSize: 11
  - selector: node[labels.role = "pe"]
    style:
      icon: pe
      width: 92
      height: 64
      borderWidth: 2.5
      labelFontWeight: 800
      labelColor: '#4c1d95'
  - selector: node[labels.role = "aggregation"]
    style:
      icon: aggregation
      width: 84
      height: 60
      borderWidth: 2
      labelColor: '#075985'
  - selector: node[labels.role = "edge"]
    style:
      icon: edge
      labelColor: '#115e59'
  - selector: node[isAggregate = "true"]
    style:
      width: 176
      height: 104
      backgroundColor: '#1e1b4b'
      borderColor: '#c4b5fd'
      borderWidth: 3
      labelColor: '#f5f3ff'
      labelFontSize: 15
      labelFontWeight: 900
  - selector: link
    style:
      curveStyle: bezier
      controlPointStepSize: 40
      lineColor: '#94a3b8'
      lineWidth: 1.8
      opacity: 0.72
      targetArrowShape: none
  - selector: link[labels.relation = "inter-metro-full-mesh"]
    style:
      lineColor: '#7c3aed'
      lineWidth: 2.2
      opacity: 0.52
  - selector: link[aggregate = "true"]
    style:
      lineColor: '#7c3aed'
      lineWidth: 4
      lineDashPattern: 12 6
      labelColor: '#312e81'
      textBackgroundColor: '#ede9fe'
      textBackgroundOpacity: 0.96
      opacity: 0.95
  - selector: link[isLinkAggregate = "true"]
    style:
      lineColor: '#7c3aed'
      lineWidth: 4
      lineDashPattern: 12 6
      labelColor: '#312e81'
      textBackgroundColor: '#ede9fe'
      textBackgroundOpacity: 0.96
      opacity: 0.95
  - selector: region
    style:
      backgroundColor: '#0ea5e914'
      borderColor: '#38bdf8aa'
      borderWidth: 1.2
      borderRadius: 8
      selectable: true
      draggable: true
      zIndex: -30
  - selector: region[id = "north-metro"]
    style:
      minHeight: 300
      minWidth: 300
      padding: 58
  - selector: region[id = "east-metro"]
    style:
      minHeight: 300
      minWidth: 300
      padding: 58
  - selector: region[id = "west-metro"]
    style:
      minHeight: 300
      minWidth: 300
      padding: 58
layout:
  mode: manual
  width: 1360
  height: 460
