      name: West metro
      members:
        - WEST-1
        - WEST-2
      layers:
        - physical
      padding: 70
      minWidth: 330
      minHeight: 210
    - id: east-metro
      name: East metro
      members:
        - EAST-1
        - EAST-2
      layers:
        - physical
      padding: 70
      minWidth: 330
      minHeight: 210
attention:
  aggregate:
    groups:
      - id: west-metro
        by: region
        regionId: west-metro
        label: West metro
      - id: east-metro
        by: region
        regionId: east-metro
        label: East metro
    expandOnClick: true
    viewport:
      collapseBelowZoom: 1.4
      expandAboveZoom: 2.0
layout:
  mode: manual
  width: 1120
  height: 300
