        name: AS 65000
      layers:
        - igp
        - bgp
      members:
        - R01
        - R03
        - R05
        - R07
        - R09
diagram:
  shapes:
    - id: canvas-frame
      locked: true
      position:
        - 26
        - 22
      labels:
        shape: canvas
        name: Documentation frame
      layers:
        - diagram
    - id: transport-plane-band
      locked: true
      position:
        - 54
        - 206
      labels:
        shape: band
        plane: transport
        name: Transport plane
      layers:
        - transport
        - diagram
    - id: controller-plane-band
      locked: true
      position:
        - 322
        - 38
      labels:
        shape: band
        plane: controller
        name: Controller plane
      layers:
        - bgp
        - diagram
    - id: service-plane-band
      locked: true
      position:
        - 54
        - 396
      labels:
        shape: band
        plane: service
        name: Service overlay
      layers:
        - service
        - diagram
    - id: route-db
      position:
        - 470
        - 560
      labels:
        shape: database
        name: Topology DB
      layers:
        - bgp
        - diagram
    - id: r01-sap
      position:
        - 70
        - 438
      labels:
        shape: sap
        side: left
        name: R01 AC
      layers:
        - service
        - diagram
      pins:
        - id: service
          position:
            - 176
            - 18
        - id: access
          position:
            - 4
            - 18
    - id: r09-sap
      position:
        - 1030
        - 438
      labels:
        shape: sap
        side: right
        name: R09 AC
      layers:
        - service
        - diagram
      pins:
        - id: service
          position:
            - 4
            - 18
        - id: access
          position:
            - 176
            - 18
    - id: packet-sid-list
      position:
        - 458
        - 154
      labels:
        shape: label-stack
        name: SR-MPLS stack
      layers:
        - transport
        - diagram
    - id: packet-glyph
      position:
        - 828
        - 236
      labels:
        shape: packet
        name: Packet glyph
      layers:
        - transport
        - diagram
  callouts:
    - id: route-db-note
      title: BGP-LS topology database
      markdown: |
        - Node, link, and TE attributes
        - Consumed by Path Control/PCE
      target: route-db
      position:
        - 772
        - 552
      labels:
        callout: database-note
      layers:
        - bgp
        - diagram
    - id: sid-list-note
      title: Head-end imposed SID list
      markdown: |
        Adjacency SID -> adjacency SID -> adjacency SID.
        The same model can show SR-TE, RSVP, SR Policy, or service paths.
      target: packet-sid-list
      position:
        - 828
        - 136
      labels:
        callout: sid-list-note
      layers:
        - transport
        - diagram
    - id: note-rich-text
      title: Diagram primitive layer
      markdown: |
        Shapes and callouts are not topology facts.
        They explain how the topology should be read.
      position:
        - 922
        - 548
      labels:
        callout: primitive-note
      layers:
        - diagram
    - id: r01-ac-to-service
      source: r01-sap
      sourcePin: service
      target: svc-1321-r01
      labels:
        callout: service-access
        name: AC to service endpoint
      layers:
        - service
        - diagram
    - id: r09-service-to-ac
      source: svc-1321-r09
      target: r09-sap
      targetPin: service
      labels:
        callout: service-access
        name: Service endpoint to AC
      layers:
        - service
        - diagram
    - id: bgpls-feed-to-db
      source: VSR-NRC
      target: route-db
      labels:
        callout: telemetry-feed
        protocol: bgp-ls
        name: BGP-LS feed
      layers:
        - bgp
        - diagram
    - id: db-to-controller
      source: route-db
      target: NSP
      labels:
        callout: telemetry-feed
        protocol: nsp-internal
        name: Topology consumed by PCE
      layers:
        - bgp
        - diagram
    - id: packet-follows-srte
      source: packet-sid-list
      target: packet-glyph
      labels:
        callout: packet-flow
        name: Packet follows programmed path
      layers:
        - transport
        - diagram
    - id: srrp-decorative-arrow
      sourcePosition:
        - 870
        - 594
      targetPosition:
        - 1010
        - 594
      labels:
        callout: srrp
        name: Example dashed line-only callout
      layers:
        - diagram
    - id: callout-semantic-model
      title: Semantic graph stays clean
      position:
        - 74
        - 42
      markdown: |
        - Routers, links, regions, services, and LSP paths live under `graph.*`.
        - Diagram notes are separate visual objects, not fake topology.
      target: R05
      labels:
        callout: model
      layers:
        - diagram
      pins:
        - id: tip
          position:
            - 310
            - 76
      sourcePin: tip
    - id: callout-controller
      title: Controller visibility
      position:
        - 898
        - 42
      markdown: |
        - BGP-LS feeds topology into NSP.
        - PCEP delegates LSP computation and path updates.
      target: NSP
      labels:
        callout: controller
      layers:
        - bgp
        - diagram
    - id: callout-pin-anchor
      title: Callout pin targets
      position:
        - 268
        - 418
      markdown: |
        - The access callout attaches to the SAP `service` pin.
        - The service node remains nested inside the physical PE.
      target: r01-sap
      targetPin: service
      labels:
        callout: anchor
      layers:
        - service
        - diagram
    - id: callout-documentation-frame
      title: Stable documentation frame
      position:
        - 804
        - 628
      markdown: |
        A locked callout or shape can create a stable visual boundary for
        documentation, screenshots, or slide export.
      targetPosition:
        - 1242
        - 682
      labels:
        callout: export
      layers:
        - diagram
toggles:
  - id: showRegions
    default: true
    labels:
      name: Show regions
  - id: showServicesInsideNodes
    default: true
    labels:
      name: Show services inside nodes
  - id: showEdgeLabels
    default: false
    labels:
      name: Show link/path labels
