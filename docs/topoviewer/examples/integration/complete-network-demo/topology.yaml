version: "0.2"
graph:
  id: mv-network
  layers:
    - id: physical
      labels:
        name: Physical
    - id: igp
      labels:
        name: IGP
    - id: bgp
      labels:
        name: BGP / Controller
    - id: transport
      labels:
        name: Transport
    - id: service
      labels:
        name: Service
    - id: diagram
      labels:
        name: Diagram primitives
  nodes:
    - id: R01
      labels:
        node: router
        vendor: nokia
        role: pe
        name: R01
      layers:
        - physical
        - igp
        - bgp
        - transport
        - service
      position:
        - 90
        - 260
    - id: R03
      labels:
        node: router
        vendor: juniper
        role: p
        name: R03
      layers:
        - physical
        - igp
        - transport
      position:
        - 320
        - 360
    - id: R05
      labels:
        node: router
        vendor: nokia
        role: abr
        name: R05
      layers:
        - physical
        - igp
        - bgp
        - transport
      position:
        - 610
        - 260
    - id: R07
      labels:
        node: router
        vendor: cisco
        role: asbr
        name: R07
      layers:
        - physical
        - igp
        - bgp
        - transport
      position:
        - 900
        - 170
    - id: R09
      labels:
        node: router
        vendor: nokia
        role: pe
        name: R09
      layers:
        - physical
        - igp
        - bgp
        - transport
        - service
      position:
        - 1110
        - 260
    - id: NSP
      labels:
        node: controller
        app: nsp
        name: NSP
      layers:
        - bgp
      position:
        - 610
        - 70
    - id: VSR-NRC
      labels:
        node: controller
        app: vsr-nrc
        name: VSR-NRC
      layers:
        - bgp
      position:
        - 610
        - 500
    - id: svc-1321-r01
      labels:
        node: service
        service: l3vpn
        name: L3VPN 1321
      parent: R01
      layers:
        - service
      position:
        - 90
        - 350
    - id: svc-1321-r09
      labels:
        node: service
        service: l3vpn
        name: L3VPN 1321
      parent: R09
      layers:
        - service
      position:
        - 1110
        - 350
  links:
    - id: phy-R01-R03
      source: R01
      target: R03
      labels:
        link: physical
        role: core
        name: R01 to R03 physical link
      layers:
        - physical
    - id: phy-R03-R05
      source: R03
      target: R05
      labels:
        link: physical
        role: core
        name: R03 to R05 physical link
      layers:
        - physical
    - id: phy-R05-R07
      source: R05
      target: R07
      labels:
        link: physical
        role: core
        name: R05 to R07 physical link
      layers:
        - physical
    - id: phy-R07-R09
      source: R07
      target: R09
      labels:
        link: physical
        role: core
        name: R07 to R09 physical link
      layers:
        - physical
    - id: bgpls-R05-VSR
      source: R05
      target: VSR-NRC
      labels:
        link: bgp
        protocol: bgp-ls
        name: R05 to VSR-NRC BGP-LS feed
      layers:
        - bgp
    - id: pcep-R01-NSP
      source: R01
      target: NSP
      labels:
        link: bgp
        protocol: pcep
        name: R01 to NSP PCEP session
      layers:
        - bgp
    - id: pcep-R09-NSP
      source: R09
      target: NSP
      labels:
        link: bgp
        protocol: pcep
        name: R09 to NSP PCEP session
      layers:
        - bgp
    - id: svc-1321
      source: svc-1321-r01
      target: svc-1321-r09
      labels:
        link: service
        service: l3vpn
        name: L3VPN 1321 service overlay
      layers:
        - service
  paths:
    - id: srte-1321-forward
      labels:
        path: transport
        protocol: sr-te
        name: SR-TE 1321
      layers:
        - transport
        - service
      sequence:
        - R01
        - R03
        - R05
        - R07
        - R09
  regions:
    - id: isis-l1
      labels:
        region: igp
        protocol: isis
        name: IS-IS L1
      parent: as65000
      layers:
        - igp
      members:
        - R01
        - R03
        - R05
    - id: isis-l2
