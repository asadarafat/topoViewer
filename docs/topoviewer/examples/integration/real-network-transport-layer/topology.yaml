version: "0.2"
graph:
  id: product-story-network
  layers:
    - id: underlay
      labels:
        name: Underlay
    - id: bgp
      labels:
        name: BGP
    - id: transport
      labels:
        name: Transport
    - id: service
      labels:
        name: Service
    - id: operations
      labels:
        name: Operations
  nodes:
    - id: ce-fra
      labels:
        role: ce
        site: fra
        tenant: payments
        name: CE-FRA
      data:
        status: ok
      layers: [service]
      position: [48, 382]
    - id: pe-fra-1
      labels:
        role: pe
        site: fra
        name: FRA-PE1
      data:
        status: ok
      layers: [underlay, bgp, transport, service, operations]
      position: [160, 250]
    - id: p-ams-1
      labels:
        role: p
        site: ams
        name: AMS-P1
      data:
        status: ok
      layers: [underlay, transport, service, operations]
      position: [380, 250]
    - id: rr-ams-1
      labels:
        role: rr
        site: ams
        protocol: bgp
        name: AMS-RR1
      data:
        status: ok
      layers: [bgp]
      position: [490, 108]
    - id: p-par-1
      labels:
        role: p
        site: par
        name: PAR-P1
      data:
        status: critical
        severity: critical
      layers: [underlay, transport, service, operations]
      position: [600, 250]
    - id: pe-lon-1
      labels:
        role: pe
        site: lon
        name: LON-PE1
      data:
        status: degraded
        severity: major
      layers: [underlay, bgp, transport, service, operations]
      position: [820, 250]
    - id: ce-lon
      labels:
        role: ce
        site: lon
        tenant: payments
        name: CE-LON
      data:
        status: ok
      layers: [service]
      position: [918, 382]
  links:
    - id: access-fra
      source: ce-fra
      target: pe-fra-1
      labels:
        layer: service
        tenant: payments
        name: Payments CE to FRA PE
      layers: [service]
      data:
        status: ok
    - id: underlay-fra-ams
      source: pe-fra-1
      target: p-ams-1
      labels:
        layer: underlay
        media: fiber
        name: FRA to AMS 400G
      layers: [underlay]
      data:
        capacity: 400G
        status: ok
    - id: underlay-ams-par
      source: p-ams-1
      target: p-par-1
      labels:
        layer: underlay
        media: fiber
        name: AMS to PAR 400G
      layers: [underlay]
      data:
        capacity: 400G
        status: critical
        severity: critical
    - id: underlay-par-lon
      source: p-par-1
      target: pe-lon-1
      labels:
        layer: underlay
        media: fiber
        name: PAR to LON 400G
      layers: [underlay]
      data:
        capacity: 400G
        status: degraded
        severity: major
    - id: bgp-fra-rr
      source: pe-fra-1
      target: rr-ams-1
      labels:
        layer: control
        protocol: bgp
        name: FRA PE to route reflector
      layers: [bgp]
      data:
        status: established
    - id: bgp-lon-rr
      source: pe-lon-1
      target: rr-ams-1
      labels:
        layer: control
        protocol: bgp
        name: LON PE to route reflector
      layers: [bgp]
      data:
        status: established
    - id: access-lon
      source: pe-lon-1
      target: ce-lon
      labels:
        layer: service
        tenant: payments
        name: LON PE to Payments CE
      layers: [service]
      data:
        status: ok
  paths:
    - id: transport-fra-lon-primary
      labels:
        layer: transport
        path: transport
        protocol: sr-te
        name: FRA to LON SR Policy
      layers: [transport]
      data:
        status: active
        bandwidthReserved: 80G
        latencyMs: 11.8
      sequence:
        - pe-fra-1
        - p-ams-1
        - p-par-1
        - pe-lon-1
    - id: payments-primary
      labels:
        service: payments
        type: l3vpn
        name: Payments L3VPN primary
      layers: [service]
      data:
        status: degraded
        severity: critical
      sequence:
        - ce-fra
        - pe-fra-1
        - p-ams-1
        - p-par-1
        - pe-lon-1
        - ce-lon
  regions:
    - id: fra-metro
      labels:
        site: fra
        name: Frankfurt edge
      layers: [underlay]
      members:
        - pe-fra-1
      paddingX: 28
      paddingY: 24
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
    - id: transit-core
      labels:
        site: core
        name: Transit core
      layers: [underlay]
      members:
        - p-ams-1
        - p-par-1
      paddingX: 34
      paddingY: 28
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
    - id: lon-metro
      labels:
        site: lon
        name: London edge
      layers: [underlay]
      members:
        - pe-lon-1
      paddingX: 28
      paddingY: 24
      headerPadding: 34
      nodeWidth: 112
      nodeHeight: 82
