version: "0.2"
graph:
  id: grafana-telemetry-call-flow
  layers:
    - id: source
      labels:
        name: Source
    - id: telemetry
      labels:
        name: Telemetry
    - id: runtime
      labels:
        name: Grafana Runtime
    - id: diagnostics
      labels:
        name: Diagnostics
  nodes:
    - id: authoring-tool
      labels:
        kind: source
        role: authoring
        name: Studio
      data:
        detail: TopoViewer Studio used to author the portable source bundle.
      layers:
        - source
      position:
        - 140
        - 170
    - id: plugin-backend
      labels:
        kind: runtime
        role: backend
        name: Bundle API
      data:
        detail: Grafana backend resource endpoint that discovers, validates, and serves mounted TopoViewer bundles.
      layers:
        - runtime
      position:
        - 390
        - 170
    - id: prometheus-http-api
      labels:
        kind: telemetry
        role: datasource
        name: HTTP API
      data:
        detail: Grafana calls Prometheus HTTP query endpoints and receives time-series samples.
      layers:
        - telemetry
      position:
        - 140
        - 370
    - id: plugin-frontend
      labels:
        kind: runtime
        role: frontend
        name: Panel Runtime
      data:
        detail: React panel runtime that coordinates source YAML, telemetry frames, mapper execution, and rendering.
      layers:
        - runtime
      position:
        - 640
        - 170
    - id: mapper-runtime
      labels:
        kind: runtime
        role: mapper
        name: Mapper
      data:
        detail: Resolves data-frame samples to TopoViewer objects and runtime states.
      layers:
        - runtime
      position:
        - 640
        - 370
    - id: topoviewer-renderer
      labels:
        kind: runtime
        role: renderer
        name: Renderer
      data:
        detail: TopoViewer renderer embedded in the panel plugin.
      layers:
        - runtime
      position:
        - 900
        - 170
    - id: source-diagnostics
      labels:
        kind: diagnostic
        role: source-diagnostics
        name: Source Diagnostics
      data:
        detail: Source discovery, parse, schema, and bundle-selection diagnostics produced by the plugin backend.
      layers:
        - diagnostics
        - runtime
      position:
        - 390
        - 300
    - id: runtime-diagnostics
      labels:
        kind: diagnostic
        role: runtime-diagnostics
        name: Runtime Diagnostics
      data:
        detail: Mapper coverage, telemetry matching, overlay, and render diagnostics surfaced by the panel runtime.
      layers:
        - diagnostics
        - runtime
      position:
        - 830
        - 370
  links:
    - id: authoring-to-backend
      source: authoring-tool
      target: plugin-backend
      labels:
        flow: source
        route: straight
        name: "1"
      layers:
        - source
    - id: backend-to-frontend
      source: plugin-backend
      target: plugin-frontend
      labels:
        flow: source
        route: straight
        name: "2"
      layers:
        - runtime
    - id: prometheus-to-backend
      source: prometheus-http-api
      target: plugin-backend
      labels:
        flow: telemetry
        route: bezier
        name: "3"
      layers:
        - telemetry
    - id: frontend-to-mapper
      source: plugin-frontend
      target: mapper-runtime
      labels:
        flow: mapping
        route: bezier
        name: "4"
      layers:
        - runtime
    - id: frontend-to-renderer
      source: plugin-frontend
      target: topoviewer-renderer
      labels:
        flow: render
        route: straight
        name: "5"
      layers:
        - runtime
    - id: mapper-to-renderer
      source: mapper-runtime
      target: topoviewer-renderer
      labels:
        flow: overlay
        route: bezier
        name: "6"
      layers:
        - runtime
    - id: mapper-to-diagnostics
      source: mapper-runtime
      target: runtime-diagnostics
      labels:
        flow: diagnostic
        route: smooth-taxi
        name: "7"
      layers:
        - diagnostics
    - id: backend-to-diagnostics
      source: plugin-backend
      target: source-diagnostics
      labels:
        flow: diagnostic
        route: straight
        name: "8"
      layers:
        - diagnostics
  regions:
    - id: source-region
      labels:
        region: lane
        lane: source
        name: Authoring
      members:
        - authoring-tool
      layers:
        - source
    - id: telemetry-region
      labels:
        region: lane
        lane: telemetry
        name: Prometheus
      members:
        - prometheus-http-api
      layers:
        - telemetry
    - id: grafana-region
      labels:
        region: boundary
        lane: grafana
        name: Grafana
      members:
        - plugin-backend
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - source-diagnostics
        - runtime-diagnostics
      layers:
        - runtime
        - diagnostics
    - id: backend-region
      labels:
        region: lane
        lane: backend
        name: TopoViewer plugin backend
      parent: grafana-region
      members:
        - plugin-backend
        - source-diagnostics
      layers:
        - runtime
        - diagnostics
    - id: frontend-region
      labels:
        region: lane
        lane: frontend
        name: TopoViewer plugin frontend
      parent: grafana-region
      members:
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - runtime-diagnostics
      layers:
        - runtime
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
