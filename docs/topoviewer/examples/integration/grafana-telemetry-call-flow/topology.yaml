graph:
  id: grafana-telemetry-call-flow
  layers:
    - id: source
      name: Source
    - id: telemetry
      name: Telemetry
    - id: runtime
      name: Grafana Runtime
    - id: diagnostics
      name: Diagnostics
  nodes:
    - id: authoring-tool
      name: Harness
      labels:
        kind: source
        role: authoring
      data:
        detail: Browser harness used to author TopoViewer source YAML.
      layers:
        - source
      position:
        - 140
        - 170
    - id: plugin-backend
      name: Bundle API
      labels:
        kind: runtime
        role: backend
      data:
        detail: Grafana backend resource endpoint that discovers, validates, and serves mounted TopoViewer bundles.
      layers:
        - runtime
      position:
        - 390
        - 170
    - id: prometheus-http-api
      name: HTTP API
      labels:
        kind: telemetry
        role: datasource
      data:
        detail: Grafana calls Prometheus HTTP query endpoints and receives time-series samples.
      layers:
        - telemetry
      position:
        - 140
        - 370
    - id: plugin-frontend
      name: Panel Runtime
      labels:
        kind: runtime
        role: frontend
      data:
        detail: React panel runtime that coordinates source YAML, telemetry frames, mapper execution, and rendering.
      layers:
        - runtime
      position:
        - 640
        - 170
    - id: mapper-runtime
      name: Mapper
      labels:
        kind: runtime
        role: mapper
      data:
        detail: Resolves data-frame samples to TopoViewer objects and runtime states.
      layers:
        - runtime
      position:
        - 640
        - 370
    - id: topoviewer-renderer
      name: Renderer
      labels:
        kind: runtime
        role: renderer
      data:
        detail: TopoViewer renderer embedded in the panel plugin.
      layers:
        - runtime
      position:
        - 900
        - 170
    - id: source-diagnostics
      name: Source Diagnostics
      labels:
        kind: diagnostic
        role: source-diagnostics
      data:
        detail: Source discovery, parse, schema, and bundle-selection diagnostics produced by the plugin backend.
      layers:
        - diagnostics
        - runtime
      position:
        - 390
        - 300
    - id: runtime-diagnostics
      name: Runtime Diagnostics
      labels:
        kind: diagnostic
        role: runtime-diagnostics
      data:
        detail: Mapper coverage, telemetry matching, overlay, and render diagnostics surfaced by the panel runtime.
      layers:
        - diagnostics
        - runtime
      position:
        - 830
        - 370
  links:
    - id: authoring-to-backend
      name: "1"
      source: authoring-tool
      target: plugin-backend
      labels:
        flow: source
        route: straight
      layers:
        - source
    - id: backend-to-frontend
      name: "2"
      source: plugin-backend
      target: plugin-frontend
      labels:
        flow: source
        route: straight
      layers:
        - runtime
    - id: prometheus-to-backend
      name: "3"
      source: prometheus-http-api
      target: plugin-backend
      labels:
        flow: telemetry
        route: bezier
      layers:
        - telemetry
    - id: frontend-to-mapper
      name: "4"
      source: plugin-frontend
      target: mapper-runtime
      labels:
        flow: mapping
        route: bezier
      layers:
        - runtime
    - id: frontend-to-renderer
      name: "5"
      source: plugin-frontend
      target: topoviewer-renderer
      labels:
        flow: render
        route: straight
      layers:
        - runtime
    - id: mapper-to-renderer
      name: "6"
      source: mapper-runtime
      target: topoviewer-renderer
      labels:
        flow: overlay
        route: bezier
      layers:
        - runtime
    - id: mapper-to-diagnostics
      name: "7"
      source: mapper-runtime
      target: runtime-diagnostics
      labels:
        flow: diagnostic
        route: smooth-taxi
      layers:
        - diagnostics
    - id: backend-to-diagnostics
      name: "8"
      source: plugin-backend
      target: source-diagnostics
      labels:
        flow: diagnostic
        route: straight
      layers:
        - diagnostics
  regions:
    - id: source-region
      name: Authoring
      labels:
        region: lane
        lane: source
      members:
        - authoring-tool
      layers:
        - source
      paddingX: 42
      paddingY: 56
    - id: telemetry-region
      name: Prometheus
      labels:
        region: lane
        lane: telemetry
      members:
        - prometheus-http-api
      layers:
        - telemetry
      paddingX: 42
      paddingY: 56
    - id: grafana-region
      name: Grafana
      labels:
        region: boundary
        lane: grafana
      members:
        - plugin-backend
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - source-diagnostics
        - runtime-diagnostics
      layers:
        - runtime
        - diagnostics
      paddingX: 54
      paddingY: 62
      headerPadding: 82
      parentPaddingX: 28
      parentPaddingY: 28
    - id: backend-region
      name: TopoViewer plugin backend
      labels:
        region: lane
        lane: backend
      parent: grafana-region
      members:
        - plugin-backend
        - source-diagnostics
      layers:
        - runtime
        - diagnostics
      paddingX: 42
      paddingY: 62
    - id: frontend-region
      name: TopoViewer plugin frontend
      labels:
        region: lane
        lane: frontend
      parent: grafana-region
      members:
        - plugin-frontend
        - mapper-runtime
        - topoviewer-renderer
        - runtime-diagnostics
      layers:
        - runtime
      paddingX: 48
      paddingY: 64
toggles:
  - id: showEdgeLabels
    name: Edge labels
    default: true
