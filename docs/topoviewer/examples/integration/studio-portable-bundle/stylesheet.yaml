version: "0.2"
layout:
  mode: manual
  width: 560
  height: 360
labelFields:
  - labels.name
stylesheet:
  - selector: node
    style:
      shape: rectangle
      width: 96
      height: 58
      borderWidth: 2
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#1976d2"
      lineWidth: 3
      targetArrowShape: triangle
