version: "0.2"
layout:
  mode: manual
  width: 1800
  height: 420
icons:
  source:
    glyph: API
    fill: "#1565c0"
    stroke: "#90caf9"
  collector:
    glyph: RUN
    fill: "#7b1fa2"
    stroke: "#ce93d8"
  artifact:
    glyph: ARTIFACT
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  model:
    glyph: ID
    fill: "#00695c"
    stroke: "#80cbc4"
  renderer:
    glyph: TV
    fill: "#ed6c02"
    stroke: "#ffcc80"
  controls:
    glyph: UX
    fill: "#5d4037"
    stroke: "#d7ccc8"
  map:
    glyph: MAP
    fill: "#455a64"
    stroke: "#b0bec5"
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.06)"
      borderColor: "rgba(66, 165, 245, 0.36)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelPosition: topCenter
      labelMargin: 10
      labelFontWeight: 800
  - selector: node
    style:
      shape: rectangle
      width: 126
      height: 62
      borderWidth: 3
      iconFit: contain
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      metaColor: transparent
  - selector: node[labels.object = "source"]
    style:
      icon: source
      backgroundColor: "rgba(25, 118, 210, 0.16)"
      borderColor: "#42a5f5"
  - selector: node[labels.object = "process"]
    style:
      icon: collector
      backgroundColor: "rgba(156, 39, 176, 0.14)"
      borderColor: "#ba68c8"
  - selector: node[labels.object = "parentProcess"]
    style:
      icon: collector
      backgroundColor: "rgba(156, 39, 176, 0.08)"
      borderColor: "#ba68c8"
      width: 210
      height: 230
      labelPosition: bottom
  - selector: node[labels.role = "converterStep"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.role = "contract"]
    style:
      labelPosition: center
      labelBackgroundOpacity: 0
      labelBorderWidth: 0
  - selector: node[labels.object = "artifact"]
    style:
      icon: artifact
      backgroundColor: "rgba(46, 125, 50, 0.14)"
      borderColor: "#4caf50"
  - selector: node[labels.object = "model"]
    style:
      icon: model
      backgroundColor: "rgba(0, 105, 92, 0.14)"
      borderColor: "#26a69a"
  - selector: node[labels.object = "renderer"]
    style:
      icon: renderer
      backgroundColor: "rgba(237, 108, 2, 0.14)"
      borderColor: "#ff9800"
  - selector: node[labels.object = "behavior"]
    style:
      icon: controls
      backgroundColor: "rgba(93, 64, 55, 0.14)"
      borderColor: "#bcaaa4"
  - selector: node[labels.object = "output"]
    style:
      icon: map
      backgroundColor: "rgba(69, 90, 100, 0.14)"
      borderColor: "#90a4ae"
      width: 152
  - selector: link
    style:
      curveStyle: bezier
      lineColor: "#42a5f5"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#42a5f5"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 11
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.94
  - selector: link[labels.link = "collect"]
    style:
      label: collect
      lineColor: "#1976d2"
      targetArrowColor: "#1976d2"
  - selector: link[labels.link = "snapshot"]
    style:
      label: snapshot
      lineColor: "#00838f"
      targetArrowColor: "#00838f"
  - selector: link[labels.link = "convert"]
    style:
      label: convert
      lineColor: "#7b1fa2"
      targetArrowColor: "#7b1fa2"
  - selector: link[labels.link = "derive"]
    style:
      label: derive model
      lineColor: "#00695c"
      targetArrowColor: "#00695c"
  - selector: link[labels.link = "write"]
    style:
      label: write topology
      lineColor: "#2e7d32"
      targetArrowColor: "#2e7d32"
  - selector: link[labels.link = "input"]
    style:
      label: input
      lineColor: "#ff9800"
      targetArrowColor: "#ff9800"
  - selector: link[labels.link = "interaction"]
    style:
      label: layer/attention
      lineColor: "#5d4037"
      targetArrowColor: "#5d4037"
  - selector: link[labels.link = "render"]
    style:
      label: render
      lineColor: "#455a64"
      targetArrowColor: "#455a64"
  - selector: link[labels.link = "refine"]
    style:
      label: refine view
      lineColor: "#5d4037"
      targetArrowColor: "#5d4037"
      lineStyle: dashed
  - selector: region[id = "source-systems"]
    style:
      paddingX: 48
      paddingY: 44
  - selector: region[id = "generated-yaml"]
    style:
      paddingX: 64
      paddingY: 58
  - selector: region[id = "rendered-output"]
    style:
      paddingX: 44
      paddingY: 48
