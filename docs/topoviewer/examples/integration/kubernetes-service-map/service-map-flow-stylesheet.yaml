layout:
  mode: manual
  width: 1120
  height: 360
icons:
  source:
    glyph: API
    fill: "#1565c0"
    stroke: "#90caf9"
  collector:
    glyph: C
    fill: "#7b1fa2"
    stroke: "#ce93d8"
  yaml:
    glyph: YAML
    fill: "#2e7d32"
    stroke: "#a5d6a7"
  renderer:
    glyph: TV
    fill: "#ed6c02"
    stroke: "#ffcc80"
  map:
    glyph: MAP
    fill: "#455a64"
    stroke: "#b0bec5"
labelFields:
  - name
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.06)"
      borderColor: "rgba(66, 165, 245, 0.36)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelPosition: topCenter
      labelMargin: 10
      labelFontWeight: 800
  - selector: node
    style:
      shape: rectangle
      width: 126
      height: 62
      borderWidth: 3
      iconFit: contain
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      metaColor: transparent
  - selector: node[labels.object = "source"]
    style:
      icon: source
      backgroundColor: "rgba(25, 118, 210, 0.16)"
      borderColor: "#42a5f5"
  - selector: node[labels.object = "process"]
    style:
      icon: collector
      backgroundColor: "rgba(156, 39, 176, 0.14)"
      borderColor: "#ba68c8"
  - selector: node[labels.object = "artifact"]
    style:
      icon: yaml
      backgroundColor: "rgba(46, 125, 50, 0.14)"
      borderColor: "#4caf50"
  - selector: node[labels.object = "renderer"]
    style:
      icon: renderer
      backgroundColor: "rgba(237, 108, 2, 0.14)"
      borderColor: "#ff9800"
  - selector: node[labels.object = "output"]
    style:
      icon: map
      backgroundColor: "rgba(69, 90, 100, 0.14)"
      borderColor: "#90a4ae"
      width: 152
  - selector: link
    style:
      curveStyle: smoothTaxi
      lineColor: "#42a5f5"
      lineWidth: 3
      targetArrowShape: triangle
      targetArrowColor: "#42a5f5"
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 11
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.94
  - selector: link[labels.link = "collect"]
    style:
      label: collect
      lineColor: "#1976d2"
      targetArrowColor: "#1976d2"
  - selector: link[labels.link = "write"]
    style:
      label: write YAML
      lineColor: "#2e7d32"
      targetArrowColor: "#2e7d32"
  - selector: link[labels.link = "input"]
    style:
      label: input
      lineColor: "#ff9800"
      targetArrowColor: "#ff9800"
  - selector: link[labels.link = "render"]
    style:
      label: render
      lineColor: "#455a64"
      targetArrowColor: "#455a64"
