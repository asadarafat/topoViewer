graph:
  id: kubernetes-service-map-flow
  layers:
    - id: story
      name: Story
  nodes:
    - id: kubernetes-api
      name: Kubernetes API
      labels:
        object: source
        role: kubernetes
      layers:
        - story
      position:
        - 120
        - 100
    - id: eda-api
      name: EDA resources/API
      labels:
        object: source
        role: eda
      layers:
        - story
      position:
        - 120
        - 250
    - id: collector
      name: Inventory collector
      labels:
        object: process
        role: collector
      layers:
        - story
      position:
        - 340
        - 175
    - id: raw-inventory
      name: Inventory JSON
      labels:
        object: artifact
        role: raw
      layers:
        - story
      position:
        - 560
        - 175
    - id: converter
      name: Converter script
      labels:
        object: parentProcess
        role: converter
      layers:
        - story
      position:
        - 760
        - 80
    - id: run-converter
      name: Run converter
      labels:
        object: process
        role: converterStep
      parent: converter
      layers:
        - story
      position:
        - 760
        - 140
    - id: derive-topology-model
      name: IDs, links, regions
      labels:
        object: model
        role: contract
      parent: converter
      layers:
        - story
      position:
        - 760
        - 240
    - id: topology-yaml
      name: topology.yaml
      labels:
        object: artifact
        role: topology
      layers:
        - story
      position:
        - 1040
        - 135
    - id: stylesheet-yaml
      name: stylesheet.yaml
      labels:
        object: artifact
        role: stylesheet
      layers:
        - story
      position:
        - 1040
        - 285
    - id: topoviewer
      name: TopoViewer
      labels:
        object: renderer
        role: topoviewer
      layers:
        - story
      position:
        - 1280
        - 210
    - id: layer-attention-controls
      name: Layers + attention
      labels:
        object: behavior
        role: controls
      layers:
        - story
      position:
        - 1520
        - 135
    - id: service-map
      name: Interactive service map
      labels:
        object: output
        role: map
      layers:
        - story
      position:
        - 1520
        - 285
  links:
    - id: k8s-to-collector
      source: kubernetes-api
      target: collector
      labels:
        link: collect
      layers:
        - story
      data:
        detail: Services, Deployments, Pods, selectors, and ownership facts.
    - id: eda-to-collector
      source: eda-api
      target: collector
      labels:
        link: collect
      layers:
        - story
      data:
        detail: EDA custom resources, TopoNodes, simulator bindings, and control relationships.
    - id: collector-to-topology
      source: collector
      target: raw-inventory
      labels:
        link: snapshot
      layers:
        - story
      data:
        detail: services.json, deployments.json, pods.json, and discovered EDA resource JSON.
    - id: inventory-to-converter
      source: raw-inventory
      target: run-converter
      labels:
        link: convert
      layers:
        - story
      data:
        detail: Build stable topology objects from raw API snapshots.
    - id: converter-to-contract
      source: run-converter
      target: derive-topology-model
      labels:
        link: derive
      layers:
        - story
      data:
        detail: Deterministic IDs, labels, data, selector links, ownership links, regions, layers, and attention groups.
    - id: contract-to-topology
      source: derive-topology-model
      target: topology-yaml
      labels:
        link: write
      layers:
        - story
      data:
        detail: TopoViewer graph model with layers, regions, and attention aggregation.
    - id: topology-to-topoviewer
      source: topology-yaml
      target: topoviewer
      labels:
        link: input
      layers:
        - story
    - id: stylesheet-to-topoviewer
      source: stylesheet-yaml
      target: topoviewer
      labels:
        link: input
      layers:
        - story
      data:
        detail: Reusable visual policy for object families and relationship families.
    - id: topoviewer-to-controls
      source: topoviewer
      target: layer-attention-controls
      labels:
        link: interaction
      layers:
        - story
      data:
        detail: Layer hiding and attention collapse keep the resulting map readable.
    - id: topoviewer-to-map
      source: topoviewer
      target: service-map
      labels:
        link: render
      layers:
        - story
    - id: controls-to-map
      source: layer-attention-controls
      target: service-map
      labels:
        link: refine
      layers:
        - story
      data:
        detail: Hide layers, expand regions, or collapse dense areas without deleting topology facts.
  regions:
    - id: source-systems
      name: Source systems
      labels:
        region: stage
      members:
        - kubernetes-api
        - eda-api
      layers:
        - story
      paddingX: 48
      paddingY: 44
    - id: generated-yaml
      name: Generated model
      labels:
        region: stage
      members:
        - raw-inventory
        - converter
        - topology-yaml
        - stylesheet-yaml
      layers:
        - story
      paddingX: 64
      paddingY: 58
    - id: rendered-output
      name: Rendering surface
      labels:
        region: stage
      members:
        - topoviewer
        - layer-attention-controls
        - service-map
      layers:
        - story
      paddingX: 44
      paddingY: 48
toggles:
  - id: showChildNodesInsideParents
    name: Show converter steps inside converter
    default: true
