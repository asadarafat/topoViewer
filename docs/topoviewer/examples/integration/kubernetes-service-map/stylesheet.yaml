layout:
  mode: manual
  width: 2120
  height: 1900
icons:
  client:
    glyph: UI
    fill: '#1976d2'
    stroke: '#bbdefb'
  service:
    glyph: SVC
    fill: '#1565c0'
    stroke: '#90caf9'
  deploy:
    glyph: DEP
    fill: '#2e7d32'
    stroke: '#a5d6a7'
  pod:
    glyph: POD
    fill: '#0288d1'
    stroke: '#81d4fa'
  data:
    glyph: DB
    fill: '#7b1fa2'
    stroke: '#ce93d8'
  fabric:
    glyph: SRL
    fill: '#001135'
    stroke: '#90caf9'
  resource:
    glyph: CR
    fill: '#ed6c02'
    stroke: '#ffcc80'
labelFields:
  - name
stylesheet:
  - selector: region
    style:
      backgroundColor: rgba(25, 118, 210, 0.08)
      borderColor: rgba(66, 165, 245, 0.46)
      borderWidth: 2
      draggable: true
      selectable: true
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelZIndex: 6
  - selector: node
    style:
      shape: rectangle
      width: 104
      height: 58
      borderWidth: 2
      iconFit: fill
      iconPadding: 0
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelPadding: 4
      metaColor: var(--topoviewer-fg-muted)
  - selector: node[labels.object = "client"]
    style:
      icon: client
      backgroundColor: '#1976d2'
      borderColor: '#90caf9'
      width: 92
      height: 56
  - selector: node[labels.object = "service"]
    style:
      icon: service
      backgroundColor: '#1565c0'
      borderColor: '#90caf9'
  - selector: node[labels.object = "deployment"]
    style:
      icon: deploy
      backgroundColor: '#2e7d32'
      borderColor: '#a5d6a7'
  - selector: node[labels.object = "pod"]
    style:
      icon: pod
      backgroundColor: '#0288d1'
      borderColor: '#81d4fa'
  - selector: node[labels.object = "toponode"]
    style:
      icon: fabric
      backgroundColor: '#001135'
      borderColor: '#90caf9'
      width: 112
      height: 64
  - selector: node[labels.object = "edaResource"]
    style:
      icon: resource
      backgroundColor: '#ed6c02'
      borderColor: '#ffcc80'
      width: 132
      height: 62
  - selector: node[isAggregate = "true"]
    style:
      shape: roundRectangle
      width: 150
      height: 76
      backgroundColor: '#1565c0'
      borderColor: '#90caf9'
      borderWidth: 3
      labelPosition: bottom
      labelFontWeight: 800
      badgeBackgroundColor: '#e3f2fd'
      badgeColor: '#0d47a1'
      badgeBorderColor: '#90caf9'
      statusPlacement: topRight
      statusSize: 12
      outlineColor: '#42a5f5'
      outlineWidth: 3
      outlineOpacity: 0.55
      underlayColor: '#42a5f5'
      underlayPadding: 10
      underlayOpacity: 0.18
  - selector: node[labels.role = "database"]
    style:
      icon: data
      backgroundColor: '#7b1fa2'
      borderColor: '#ce93d8'
  - selector: node[labels.status = "ready"]
    style:
      statusColor: '#4caf50'
  - selector: node[labels.status = "connected"]
    style:
      statusColor: '#4caf50'
      badgeLabel: NPP
  - selector: link
    style:
      curveStyle: bezier
      lineColor: '#90a4ae'
      lineWidth: 2
      targetArrowShape: triangle
      targetArrowColor: '#90a4ae'
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 10
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelZIndex: 8
  - selector: link[labels.link = "entry"]
    style:
      lineColor: '#1976d2'
      targetArrowColor: '#1976d2'
      lineWidth: 4
      label: HTTPS
  - selector: link[labels.link = "runtime-flow"]
    style:
      curveStyle: bezier
      lineColor: '#42a5f5'
      targetArrowColor: '#42a5f5'
      lineWidth: 3
  - selector: link[labels.link = "selector"]
    style:
      lineColor: '#4caf50'
      targetArrowColor: '#4caf50'
      lineWidth: 3
      label: selects
  - selector: link[labels.link = "topology"]
    style:
      lineColor: '#ed6c02'
      targetArrowColor: '#ed6c02'
      lineWidth: 3
      label: contains
  - selector: link[labels.link = "runtime-binding"]
    style:
      lineColor: '#9c27b0'
      targetArrowColor: '#9c27b0'
      lineWidth: 3
      lineStyle: dashed
  - selector: link[labels.link = "control"]
    style:
      lineColor: '#0288d1'
      targetArrowColor: '#0288d1'
      lineWidth: 2
      lineStyle: dashed
      label: NPP
  - selector: link[labels.link = "owns"]
    style:
      lineColor: '#78909c'
      targetArrowColor: '#78909c'
      lineWidth: 2
      label: pod
