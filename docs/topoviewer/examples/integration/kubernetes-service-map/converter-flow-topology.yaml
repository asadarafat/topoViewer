graph:
  id: kubernetes-service-map-converter-flow
  layers:
    - id: converter
      name: Converter
  nodes:
    - id: services-json
      name: services.json
      labels:
        object: input
        role: service
      layers:
        - converter
      position:
        - 110
        - 88
    - id: deployments-json
      name: deployments.json
      labels:
        object: input
        role: deployment
      layers:
        - converter
      position:
        - 110
        - 188
    - id: pods-json
      name: pods.json
      labels:
        object: input
        role: pod
      layers:
        - converter
      position:
        - 110
        - 288
    - id: eda-resources-json
      name: EDA resources
      labels:
        object: input
        role: eda
      layers:
        - converter
      position:
        - 110
        - 388
    - id: converter-script
      name: Converter script
      labels:
        object: parentProcess
        role: converter
      layers:
        - converter
      position:
        - 380
        - 84
    - id: read-snapshots
      name: Read snapshots
      labels:
        object: process
        role: read
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 150
    - id: derive-identity
      name: Stable IDs + labels
      labels:
        object: model
        role: identity
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 240
    - id: derive-relationships
      name: Links, parents, layers
      labels:
        object: model
        role: relationships
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 330
    - id: derive-attention
      name: Attention groups
      labels:
        object: behavior
        role: attention
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 420
    - id: topology-yaml
      name: topology.yaml
      labels:
        object: artifact
        role: topology
      layers:
        - converter
      position:
        - 680
        - 238
    - id: stylesheet-yaml
      name: stylesheet.yaml
      labels:
        object: policy
        role: stylesheet
      layers:
        - converter
      position:
        - 680
        - 376
    - id: topoviewer
      name: TopoViewer
      labels:
        object: renderer
        role: topoviewer
      layers:
        - converter
      position:
        - 925
        - 306
    - id: layer-hiding
      name: Layer hiding
      labels:
        object: behavior
        role: layers
      layers:
        - converter
      position:
        - 1160
        - 218
    - id: attention-collapse
      name: Parent collapse
      labels:
        object: behavior
        role: collapse
      layers:
        - converter
      position:
        - 1160
        - 356
  links:
    - id: services-to-read
      source: services-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: deployments-to-read
      source: deployments-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: pods-to-read
      source: pods-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: eda-to-read
      source: eda-resources-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: read-to-identity
      source: read-snapshots
      target: derive-identity
      labels:
        link: derive
      layers:
        - converter
    - id: identity-to-relationships
      source: derive-identity
      target: derive-relationships
      labels:
        link: derive
      layers:
        - converter
    - id: relationships-to-attention
      source: derive-relationships
      target: derive-attention
      labels:
        link: derive
      layers:
        - converter
    - id: relationships-to-topology
      source: derive-relationships
      target: topology-yaml
      labels:
        link: write
      layers:
        - converter
    - id: attention-to-topology
      source: derive-attention
      target: topology-yaml
      labels:
        link: write
      layers:
        - converter
    - id: topology-to-topoviewer
      source: topology-yaml
      target: topoviewer
      labels:
        link: renderInput
      layers:
        - converter
    - id: stylesheet-to-topoviewer
      source: stylesheet-yaml
      target: topoviewer
      labels:
        link: renderInput
      layers:
        - converter
    - id: topoviewer-to-layer-hiding
      source: topoviewer
      target: layer-hiding
      labels:
        link: behavior
      layers:
        - converter
    - id: topoviewer-to-attention-collapse
      source: topoviewer
      target: attention-collapse
      labels:
        link: behavior
      layers:
        - converter
toggles:
  - id: showChildNodesInsideParents
    name: Show converter internals
    default: true
