version: "0.2"
graph:
  id: kubernetes-service-map-converter-flow
  layers:
    - id: converter
      labels:
        name: Converter
  nodes:
    - id: services-json
      labels:
        object: input
        role: service
        name: services.json
      layers:
        - converter
      position:
        - 110
        - 88
    - id: deployments-json
      labels:
        object: input
        role: deployment
        name: deployments.json
      layers:
        - converter
      position:
        - 110
        - 188
    - id: pods-json
      labels:
        object: input
        role: pod
        name: pods.json
      layers:
        - converter
      position:
        - 110
        - 288
    - id: eda-resources-json
      labels:
        object: input
        role: eda
        name: EDA resources
      layers:
        - converter
      position:
        - 110
        - 388
    - id: converter-script
      labels:
        object: parentProcess
        role: converter
        name: Converter script
      layers:
        - converter
      position:
        - 380
        - 84
    - id: read-snapshots
      labels:
        object: process
        role: read
        name: Read snapshots
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 150
    - id: derive-identity
      labels:
        object: model
        role: identity
        name: Stable IDs + labels
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 240
    - id: derive-relationships
      labels:
        object: model
        role: relationships
        name: Links, regions, layers
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 330
    - id: derive-attention
      labels:
        object: behavior
        role: attention
        name: Attention groups
      parent: converter-script
      layers:
        - converter
      position:
        - 380
        - 420
    - id: topology-yaml
      labels:
        object: artifact
        role: topology
        name: topology.yaml
      layers:
        - converter
      position:
        - 680
        - 238
    - id: stylesheet-yaml
      labels:
        object: policy
        role: stylesheet
        name: stylesheet.yaml
      layers:
        - converter
      position:
        - 680
        - 376
    - id: topoviewer
      labels:
        object: renderer
        role: topoviewer
        name: TopoViewer
      layers:
        - converter
      position:
        - 925
        - 306
    - id: layer-hiding
      labels:
        object: behavior
        role: layers
        name: Layer hiding
      layers:
        - converter
      position:
        - 1160
        - 218
    - id: attention-collapse
      labels:
        object: behavior
        role: collapse
        name: Region collapse
      layers:
        - converter
      position:
        - 1160
        - 356
  links:
    - id: services-to-read
      source: services-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: deployments-to-read
      source: deployments-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: pods-to-read
      source: pods-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: eda-to-read
      source: eda-resources-json
      target: read-snapshots
      labels:
        link: input
      layers:
        - converter
    - id: read-to-identity
      source: read-snapshots
      target: derive-identity
      labels:
        link: derive
      layers:
        - converter
    - id: identity-to-relationships
      source: derive-identity
      target: derive-relationships
      labels:
        link: derive
      layers:
        - converter
    - id: relationships-to-attention
      source: derive-relationships
      target: derive-attention
      labels:
        link: derive
      layers:
        - converter
    - id: relationships-to-topology
      source: derive-relationships
      target: topology-yaml
      labels:
        link: write
      layers:
        - converter
    - id: attention-to-topology
      source: derive-attention
      target: topology-yaml
      labels:
        link: write
      layers:
        - converter
    - id: topology-to-topoviewer
      source: topology-yaml
      target: topoviewer
      labels:
        link: renderInput
      layers:
        - converter
    - id: stylesheet-to-topoviewer
      source: stylesheet-yaml
      target: topoviewer
      labels:
        link: renderInput
      layers:
        - converter
    - id: topoviewer-to-layer-hiding
      source: topoviewer
      target: layer-hiding
      labels:
        link: behavior
      layers:
        - converter
    - id: topoviewer-to-attention-collapse
      source: topoviewer
      target: attention-collapse
      labels:
        link: behavior
      layers:
        - converter
  regions:
    - id: inventory-snapshots
      labels:
        region: stage
        name: Inventory snapshots
      members:
        - services-json
        - deployments-json
        - pods-json
        - eda-resources-json
      layers:
        - converter
    - id: output-contract
      labels:
        region: stage
        name: TopoViewer contract
      members:
        - topology-yaml
        - stylesheet-yaml
        - topoviewer
        - layer-hiding
        - attention-collapse
      layers:
        - converter
toggles:
  - id: showChildNodesInsideParents
    default: true
    labels:
      name: Show converter internals
