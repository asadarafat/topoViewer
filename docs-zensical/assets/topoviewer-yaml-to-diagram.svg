<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">TopoViewer YAML to rendered network underlay diagram</title>
  <desc id="desc">A split visual showing topology YAML on the left and the Real Network Demo underlay view on the right.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#475569" flood-opacity="0.18"/>
    </filter>
    <style>
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .title { font: 800 28px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #0f172a; }
      .muted { fill: #64748b; }
      .region { fill: rgba(241, 245, 249, 0.72); stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 8 8; }
      .underlay { stroke: #64748b; stroke-width: 8; stroke-linecap: round; fill: none; }
      .router-pe { fill: #2563eb; stroke: #bfdbfe; stroke-width: 5; }
      .router-p { fill: #0f766e; stroke: #99f6e4; stroke-width: 5; }
      .node-label { font: 800 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .region-label { font: 800 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="34" fill="url(#page)"/>
  <text x="54" y="62" class="title">Topology YAML becomes an interactive underlay view</text>
  <text x="54" y="96" class="small">The same provider topology used by Real Network Demo starts as readable graph facts.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="130" width="420" height="410" rx="18" class="panel"/>
    <text x="84" y="170" class="label">Topology YAML</text>
    <text x="84" y="210" class="code">graph:</text>
    <text x="104" y="238" class="code muted">layers:</text>
    <text x="124" y="266" class="code">- id: underlay</text>
    <text x="104" y="302" class="code muted">nodes:</text>
    <text x="124" y="330" class="code">- id: pe-fra-1</text>
    <text x="124" y="358" class="code">  labels: { role: pe }</text>
    <text x="124" y="386" class="code">- id: p-ams-1</text>
    <text x="104" y="422" class="code muted">links:</text>
    <text x="124" y="450" class="code">- source: pe-fra-1</text>
    <text x="124" y="478" class="code">  target: p-ams-1</text>
    <text x="124" y="506" class="code">  layers: [underlay]</text>
  </g>

  <path d="M505 335h94" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <path d="M586 316l28 19-28 19z" fill="#475569"/>

  <g filter="url(#shadow)">
    <rect x="638" y="130" width="508" height="410" rx="18" class="panel"/>
    <text x="668" y="170" class="label">Rendered Real Network underlay</text>

    <rect x="684" y="232" width="136" height="176" rx="24" class="region"/>
    <rect x="822" y="232" width="228" height="176" rx="24" class="region"/>
    <rect x="1052" y="232" width="78" height="176" rx="24" class="region"/>
    <text x="752" y="258" class="region-label">Frankfurt edge</text>
    <text x="936" y="258" class="region-label">Transit core</text>
    <text x="1091" y="258" class="region-label">London edge</text>

    <path d="M752 320L884 320L1000 320L1104 320" class="underlay"/>

    <polygon points="752,271 796,296 796,344 752,369 708,344 708,296" class="router-pe"/>
    <text x="752" y="396" class="node-label">FRA-PE1</text>

    <circle cx="884" cy="320" r="42" class="router-p"/>
    <text x="884" y="396" class="node-label">AMS-P1</text>

    <circle cx="1000" cy="320" r="42" class="router-p"/>
    <text x="1000" y="396" class="node-label">PAR-P1</text>

    <polygon points="1104,271 1148,296 1148,344 1104,369 1060,344 1060,296" class="router-pe"/>
    <text x="1104" y="396" class="node-label">LON-PE1</text>
  </g>
</svg>
