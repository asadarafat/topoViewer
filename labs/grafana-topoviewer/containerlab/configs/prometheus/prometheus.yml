global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/topoviewer-rules.yml

# metrics_path defaults to '/metrics'
# scheme defaults to 'http'.
scrape_configs:
  - job_name: "gnmic"
    static_configs:
      - targets: ["gnmic:9273"]
