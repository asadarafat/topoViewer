global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: gnmic
    static_configs:
      - targets:
          - gnmic:9804
        labels:
          topology: clab-clos

  - job_name: topoviewer-clab-normalizer
    static_configs:
      - targets:
          - normalizer:9110
        labels:
          topology: clab-clos

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
