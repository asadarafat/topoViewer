name: topoviewer-grafana

mgmt:
  network: topoviewer-grafana
  ipv4-subnet: 172.100.50.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ${SRLINUX_IMAGE}
      type: ixr-d2l
    linux:
      env:
        TZ: UTC

  nodes:
    spine1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.100.50.11
      startup-config: configs/srlinux/spine1.cli
      labels:
        topoviewer.role: spine
    spine2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.100.50.12
      startup-config: configs/srlinux/spine2.cli
      labels:
        topoviewer.role: spine
    leaf1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.100.50.21
      startup-config: configs/srlinux/leaf1.cli
      labels:
        topoviewer.role: leaf
    leaf2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.100.50.22
      startup-config: configs/srlinux/leaf2.cli
      labels:
        topoviewer.role: leaf

    client1:
      kind: linux
      image: alpine:3.22.2
      mgmt-ipv4: 172.100.50.101
      exec:
        - ip link set eth1 up
        - ip addr add 192.0.2.10/31 dev eth1
        - sh -c "ip route add 192.0.2.12/31 via 192.0.2.11 || true"
        - sh -c "ip route add 192.0.2.13/32 via 192.0.2.11 || true"
        - sh -c "while true; do ping -c 1 -W 1 192.0.2.13 >/dev/null 2>&1 || true; sleep 5; done &"
    client2:
      kind: linux
      image: alpine:3.22.2
      mgmt-ipv4: 172.100.50.102
      exec:
        - ip link set eth1 up
        - ip addr add 192.0.2.13/31 dev eth1
        - sh -c "ip route add 192.0.2.10/31 via 192.0.2.12 || true"
        - sh -c "ip route add 192.0.2.10/32 via 192.0.2.12 || true"
        - sh -c "while true; do ping -c 1 -W 1 192.0.2.10 >/dev/null 2>&1 || true; sleep 5; done &"

    gnmic:
      kind: linux
      image: ${GNMIC_IMAGE}
      mgmt-ipv4: 172.100.50.201
      binds:
        - configs/gnmic/gnmic.yml:/app/gnmic.yml:ro
      cmd: --config /app/gnmic.yml subscribe
      ports:
        - ${GNMIC_HTTP_PORT}:9804

    normalizer:
      kind: linux
      image: ${NORMALIZER_IMAGE}
      mgmt-ipv4: 172.100.50.202
      binds:
        - normalizer:/app:ro
        - inventory/clab-clos-links.json:/inventory/clab-clos-links.json:ro
      env:
        GNMIC_METRICS_URL: http://gnmic:9804/metrics
        TOPOVIEWER_LINK_INVENTORY: /inventory/clab-clos-links.json
      cmd: node /app/src/server.mjs
      ports:
        - ${NORMALIZER_HTTP_PORT}:9110

    prometheus:
      kind: linux
      image: ${PROMETHEUS_IMAGE}
      mgmt-ipv4: 172.100.50.203
      binds:
        - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - configs/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      cmd: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
      ports:
        - ${PROMETHEUS_HTTP_PORT}:9090

    grafana:
      kind: linux
      image: ${GRAFANA_IMAGE}
      mgmt-ipv4: 172.100.50.204
      env:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
        GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: asadarafat-topoviewer-panel
        TOPOVIEWER_BUNDLE_ROOT: /etc/topoviewer/bundles
      binds:
        - ${TOPOVIEWER_GRAFANA_PLUGIN_DIST}:/var/lib/grafana/plugins/asadarafat-topoviewer-panel:ro
        - ../topoviewer-bundles:/etc/topoviewer/bundles:ro
        - configs/grafana/provisioning:/etc/grafana/provisioning:ro
        - configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      ports:
        - ${GRAFANA_HTTP_PORT}:3000

  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
    - endpoints: ["spine2:e1-1", "leaf1:e1-2"]
    - endpoints: ["spine2:e1-2", "leaf2:e1-2"]
    - endpoints: ["leaf1:e1-10", "client1:eth1"]
    - endpoints: ["leaf2:e1-10", "client2:eth1"]
