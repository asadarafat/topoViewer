version: 1
identity:
  sourceId: layered-network
  sourceIdLabel: fixture_id
palette:
  success:
    color: "#4caf50"
    accent: "#2e7d32"
  info:
    color: "#42a5f5"
    accent: "#1976d2"
  warning:
    color: "#ff9800"
    accent: "#ed6c02"
  error:
    color: "#d32f2f"
    accent: "#c62828"
mappings:
  - id: link-oper-state
    metric: topoviewer_link_up
    target:
      kind: link
      resolve:
        by: id
        metricLabel: link_id
        sourceLabel: source
        targetLabel: target
    value:
      as: up
    overlay:
      lineColorBySeverity: true
      lineWidthBySeverity: true
      sourceArrowColorBySeverity: true
      targetArrowColorBySeverity: true
      statusMarker: true
      outlineBySeverity: true
      label: "{{ severity }}"
  - id: link-utilization
    metric: topoviewer_link_utilization_percent
    target:
      kind: link
      resolve:
        by: id
        metricLabel: link_id
    value:
      as: utilizationPercent
    thresholds:
      info: 50
      warning: 80
      error: 90
    overlay:
      lineColorBySeverity: true
      lineWidthBySeverity: true
      sourceArrowColorBySeverity: true
      targetArrowColorBySeverity: true
      statusMarker: true
      outlineBySeverity: true
      label: "{{ value | round }}%"
  - id: link-errors
    metric: topoviewer_link_errors_total
    target:
      kind: link
      resolve:
        by: id
        metricLabel: link_id
    value:
      as: errorsTotal
    thresholds:
      warning: 1
      error: 10
    overlay:
      lineColorBySeverity: true
      lineWidthBySeverity: true
      statusMarker: true
      outlineBySeverity: true
      label: "errors {{ value | round }}"
