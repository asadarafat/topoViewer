labelFields: []
stylesheet:
  - selector: node
    style:
      icon: router.pe
      shape: square
      width: 48
      height: 48
      borderWidth: 3
      borderColor: "#90caf9"
      iconFit: contain
      iconPadding: 0
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
  - selector: node[labels.role = "pe"]
    style:
      icon: router.pe
      shape: square
      backgroundColor: "#1976d2"
      borderColor: "#1976d2"
      underlayColor: "#42a5f5"
      underlayOpacity: 0.2
      underlayPadding: 9
  - selector: node[labels.role = "rr"]
    style:
      icon: router.rr
  - selector: node[labels.role = "service"]
    style:
      icon: service
  - selector: node[labels.role = "ops"]
    style:
      icon: ops
  - selector: node[data.severity = "major"]
    style:
      statusColor: "#ff9800"
      outlineColor: "#ff9800"
      outlineWidth: 10
      outlineOpacity: 0.9
  - selector: link
    style:
      curveStyle: straight
      lineColor: "#90a4ae"
      lineWidth: 3
      labelColor: var(--topoviewer-fg-strong)
      labelFontSize: 11
      textBackgroundColor: var(--topoviewer-edge-label-bg)
  - selector: link[labels.protocol = "bgp"]
    style:
      label: iBGP
      curveStyle: straight
      lineColor: "#9c27b0"
      lineWidth: 3
      lineStyle: dashed
      lineDashPattern: 7 7
      targetArrowShape: triangle
      sourceArrowShape: triangle
      targetArrowColor: "#9c27b0"
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: "#7b1fa2"
  - selector: link[labels.tenant = "payments"]
    style:
      label: access
      curveStyle: bezier
      lineColor: "#ff9800"
      lineWidth: 4
      targetArrowShape: triangle
      targetArrowColor: "#ff9800"
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: "#e65100"
  - selector: link[labels.layer = "operations"]
    style:
      label: incident
      curveStyle: smoothTaxi
      lineColor: "#d32f2f"
      lineWidth: 4
      lineStyle: dashed
      lineDashPattern: 8 5
      targetArrowColor: "#d32f2f"
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: "#c62828"
  - selector: path[labels.service = "payments"]
    style:
      label: service path
      curveStyle: bezier
      lineColor: "#02d144ff"
      lineWidth: 20
      laneWidth: 20
      laneGap: 9
      lineOpacity: 0.5
      targetArrowShape: circle
      targetArrowColor: "#02d144ff"
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelColor: "#01579b"
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.08)"
      borderColor: "rgba(25, 118, 210, 0.34)"
      borderWidth: 1
      labelColor: var(--topoviewer-region-label-fg)
      labelFontSize: 12
      labelFontWeight: 800
      labelPosition: topCenter
      labelMargin: 12
      zIndex: -20
