labelFields:
  - name
stylesheet:
  - selector: region
    style:
      labelZIndex: 9
      backgroundColor: "rgba(25, 118, 210, 0.1)"
      borderColor: "rgba(66, 165, 245, 0.54)"
      borderWidth: 2
      labelPosition: topCenter
      labelMargin: 12
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
  - selector: node
    style:
      icon: router.leaf
      shape: square
      width: 48
      height: 48
      borderWidth: 3
      borderColor: "#90caf9"
      iconFit: fill
      iconPadding: 0
      labelFontWeight: 800
      labelColor: var(--topoviewer-fg-strong)
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelZIndex: 10
      labelYOffset: 8
      labelPadding: 4
      metaColor: "transparent"
  - selector: node[labels.node = "spine"]
    style:
      icon: router.spine
      outlineColor: "#9c27b0"
      outlineWidth: 4
      outlineOpacity: 0.55
      labelPosition: top
      labelYOffset: -8
  - selector: node[labels.node = "leaf"]
    style:
      icon: router.leaf
      outlineColor: "#1976d2"
      outlineWidth: 3
      outlineOpacity: 0.38
  - selector: link
    style:
      lineWidth: 4
      lineColor: "#42a5f5"
      targetArrowShape: none
      curveStyle: straight
      label: ""
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      directionalStrokes: true
      directionStartGap: 18
      directionCenterGap: 56
      directionLabelOffset: 12
  - selector: linkDirection
    style:
      lineWidth: 3
      lineCap: round
      labelFontSize: 10
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      labelZIndex: 38
  - selector: linkDirection[direction = "sourceToTarget"]
    style:
      lineColor: "#4caf50"
      targetArrowShape: triangle
      targetArrowColor: "#4caf50"
  - selector: linkDirection[direction = "targetToSource"]
    style:
      lineColor: "#ff9800"
      sourceArrowShape: triangle
      sourceArrowColor: "#ff9800"
