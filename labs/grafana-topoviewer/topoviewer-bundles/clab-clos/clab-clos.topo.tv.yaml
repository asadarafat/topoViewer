version: "0.2"
graph:
  id: clab-clos
  layers:
    - id: fabric
      labels:
        name: Fabric
    - id: telemetry
      labels:
        name: Telemetry
  nodes:
    - id: spine1
      labels:
        node: srlinux
        role: spine
        name: Spine 1
      data:
        mgmtIp: 172.100.50.11
      layers: [fabric, telemetry]
      position: [240, 100]
    - id: spine2
      labels:
        node: srlinux
        role: spine
        name: Spine 2
      data:
        mgmtIp: 172.100.50.12
      layers: [fabric, telemetry]
      position: [520, 100]
    - id: leaf1
      labels:
        node: srlinux
        role: leaf
        name: Leaf 1
      data:
        mgmtIp: 172.100.50.21
      layers: [fabric, telemetry]
      position: [220, 330]
    - id: leaf2
      labels:
        node: srlinux
        role: leaf
        name: Leaf 2
      data:
        mgmtIp: 172.100.50.22
      layers: [fabric, telemetry]
      position: [540, 330]
    - id: client1
      labels:
        node: host
        role: workload
        name: Client 1
      layers: [fabric]
      position: [150, 520]
    - id: client2
      labels:
        node: host
        role: workload
        name: Client 2
      layers: [fabric]
      position: [610, 520]
  links:
    - id: spine1-leaf1
      source: spine1
      target: leaf1
      sourceLabel: e1-1
      targetLabel: e1-1
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/1
      layers: [fabric, telemetry]
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine1-leaf2
      source: spine1
      target: leaf2
      sourceLabel: e1-2
      targetLabel: e1-1
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/2
        targetInterface: ethernet-1/1
      layers: [fabric, telemetry]
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine2-leaf1
      source: spine2
      target: leaf1
      sourceLabel: e1-1
      targetLabel: e1-2
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/2
      layers: [fabric, telemetry]
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine2-leaf2
      source: spine2
      target: leaf2
      sourceLabel: e1-2
      targetLabel: e1-2
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/2
        targetInterface: ethernet-1/2
      layers: [fabric, telemetry]
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: leaf1-client1
      source: leaf1
      target: client1
      sourceLabel: e1-10
      targetLabel: eth1
      labels:
        link: access
        protocol: ethernet
      data:
        sourceInterface: ethernet-1/10
        targetInterface: eth1
      layers: [fabric]
    - id: leaf2-client2
      source: leaf2
      target: client2
      sourceLabel: e1-10
      targetLabel: eth1
      labels:
        link: access
        protocol: ethernet
      data:
        sourceInterface: ethernet-1/10
        targetInterface: eth1
      layers: [fabric]
  regions:
    - id: spine-region
      labels:
        region: fabric
        name: Spines
      members: [spine1, spine2]
      layers: [fabric]
    - id: leaf-region
      labels:
        region: fabric
        name: Leaves
      members: [leaf1, leaf2]
      layers: [fabric]
    - id: client-region
      labels:
        region: workload
        name: Clients
      members: [client1, client2]
      layers: [fabric]
toggles:
  - id: showEdgeLabels
    default: true
    labels:
      name: Edge labels
