graph:
  id: clab-clos
  layers:
    - id: fabric
      name: Fabric
    - id: telemetry
      name: Telemetry
  nodes:
    - id: spine1
      name: Spine 1
      labels:
        node: srlinux
        role: spine
      data:
        mgmtIp: 172.100.50.11
      layers: [fabric, telemetry]
      position: [240, 100]
    - id: spine2
      name: Spine 2
      labels:
        node: srlinux
        role: spine
      data:
        mgmtIp: 172.100.50.12
      layers: [fabric, telemetry]
      position: [520, 100]
    - id: leaf1
      name: Leaf 1
      labels:
        node: srlinux
        role: leaf
      data:
        mgmtIp: 172.100.50.21
      layers: [fabric, telemetry]
      position: [220, 330]
    - id: leaf2
      name: Leaf 2
      labels:
        node: srlinux
        role: leaf
      data:
        mgmtIp: 172.100.50.22
      layers: [fabric, telemetry]
      position: [540, 330]
    - id: client1
      name: Client 1
      labels:
        node: host
        role: workload
      layers: [fabric]
      position: [150, 520]
    - id: client2
      name: Client 2
      labels:
        node: host
        role: workload
      layers: [fabric]
      position: [610, 520]
  links:
    - id: spine1-leaf1
      source: spine1
      target: leaf1
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/1
      layers: [fabric, telemetry]
      style:
        sourceArrowLabel: e1-1
        targetArrowLabel: e1-1
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine1-leaf2
      source: spine1
      target: leaf2
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/2
        targetInterface: ethernet-1/1
      layers: [fabric, telemetry]
      style:
        sourceArrowLabel: e1-2
        targetArrowLabel: e1-1
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine2-leaf1
      source: spine2
      target: leaf1
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/2
      layers: [fabric, telemetry]
      style:
        sourceArrowLabel: e1-1
        targetArrowLabel: e1-2
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: spine2-leaf2
      source: spine2
      target: leaf2
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/2
        targetInterface: ethernet-1/2
      layers: [fabric, telemetry]
      style:
        sourceArrowLabel: e1-2
        targetArrowLabel: e1-2
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
        targetToSource:
          labels:
            direction: targetToSource
    - id: leaf1-client1
      source: leaf1
      target: client1
      labels:
        link: access
        protocol: ethernet
      data:
        sourceInterface: ethernet-1/10
        targetInterface: eth1
      layers: [fabric]
      style:
        sourceArrowLabel: e1-10
        targetArrowLabel: eth1
    - id: leaf2-client2
      source: leaf2
      target: client2
      labels:
        link: access
        protocol: ethernet
      data:
        sourceInterface: ethernet-1/10
        targetInterface: eth1
      layers: [fabric]
      style:
        sourceArrowLabel: e1-10
        targetArrowLabel: eth1
  regions:
    - id: spine-region
      name: Spines
      labels:
        region: fabric
      members: [spine1, spine2]
      layers: [fabric]
      paddingX: 64
      paddingY: 50
    - id: leaf-region
      name: Leaves
      labels:
        region: fabric
      members: [leaf1, leaf2]
      layers: [fabric]
      paddingX: 64
      paddingY: 50
    - id: client-region
      name: Clients
      labels:
        region: workload
      members: [client1, client2]
      layers: [fabric]
      paddingX: 52
      paddingY: 40
toggles:
  - id: showEdgeLabels
    name: Edge labels
    default: true
