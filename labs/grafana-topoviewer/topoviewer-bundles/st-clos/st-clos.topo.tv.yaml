graph:
  id: st-clos
  layers:
    - id: fabric
      name: Fabric
    - id: telemetry
      name: Telemetry
  nodes:
    - id: spine1
      name: Spine 1
      labels:
        node: srlinux
        role: spine
      data:
        mgmtIp: 172.80.80.21
      layers: [fabric, telemetry]
      position: [300, 110]
    - id: spine2
      name: Spine 2
      labels:
        node: srlinux
        role: spine
      data:
        mgmtIp: 172.80.80.22
      layers: [fabric, telemetry]
      position: [660, 110]
    - id: leaf1
      name: Leaf 1
      labels:
        node: srlinux
        role: leaf
      data:
        mgmtIp: 172.80.80.11
      layers: [fabric, telemetry]
      position: [180, 350]
    - id: leaf2
      name: Leaf 2
      labels:
        node: srlinux
        role: leaf
