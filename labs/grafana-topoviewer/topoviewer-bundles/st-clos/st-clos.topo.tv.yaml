version: "0.2"
graph:
  id: st-clos
  layers:
    - id: fabric
      labels:
        name: Fabric
    - id: telemetry
      labels:
        name: Telemetry
  nodes:
    - id: spine1
      labels:
        node: srlinux
        role: spine
        name: Spine 1
      data:
        mgmtIp: 172.80.80.21
      handles:
        - id: e1-1
          type: both
          position: bottom
          offset: 25
        - id: e1-2
          type: both
          position: bottom
          offset: 50
        - id: e1-3
          type: both
          position: bottom
          offset: 75
      layers: [fabric, telemetry]
      position: [350, 120]
    - id: spine2
      labels:
        node: srlinux
        role: spine
        name: Spine 2
      data:
        mgmtIp: 172.80.80.22
      handles:
        - id: e1-1
          type: both
          position: bottom
          offset: 25
        - id: e1-2
          type: both
          position: bottom
          offset: 50
        - id: e1-3
          type: both
          position: bottom
          offset: 75
      layers: [fabric, telemetry]
      position: [790, 120]
    - id: leaf1
      labels:
        node: srlinux
        role: leaf
        name: Leaf 1
      data:
        mgmtIp: 172.80.80.11
      handles:
        - id: e1-49
          type: both
          position: top
          offset: 36
        - id: e1-50
          type: both
          position: top
          offset: 64
        - id: e1-1
          type: both
          position: bottom
          offset: 50
      layers: [fabric, telemetry]
      position: [160, 410]
    - id: leaf2
      labels:
        node: srlinux
        role: leaf
        name: Leaf 2
      data:
        mgmtIp: 172.80.80.12
      handles:
        - id: e1-49
          type: both
          position: top
          offset: 36
        - id: e1-50
          type: both
          position: top
          offset: 64
        - id: e1-1
          type: both
          position: bottom
          offset: 50
      layers: [fabric, telemetry]
      position: [570, 410]
    - id: leaf3
      labels:
        node: srlinux
        role: leaf
        name: Leaf 3
      data:
        mgmtIp: 172.80.80.13
      handles:
        - id: e1-49
          type: both
          position: top
          offset: 36
        - id: e1-50
          type: both
          position: top
          offset: 64
        - id: e1-1
          type: both
          position: bottom
          offset: 50
      layers: [fabric, telemetry]
      position: [980, 410]
    - id: client1
      labels:
        node: host
        role: workload
        name: Client 1
      handles:
        - id: eth1
          type: both
          position: top
          offset: 50
      layers: [fabric]
      position: [160, 680]
    - id: client2
      labels:
        node: host
        role: workload
        name: Client 2
      handles:
        - id: eth1
          type: both
          position: top
          offset: 50
      layers: [fabric]
      position: [570, 680]
    - id: client3
      labels:
        node: host
        role: workload
        name: Client 3
      handles:
        - id: eth1
          type: both
          position: top
          offset: 50
      layers: [fabric]
      position: [980, 680]
  links:
    - id: spine1-leaf1
      source: spine1
      sourceHandle: e1-1
      target: leaf1
      targetHandle: e1-49
      sourceLabel: e1-1
      targetLabel: e1-49
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/49
        telemetry:
          up:
            record: topoviewer_st_link_up
            expr: vector(scalar(interface_oper_state{source="spine1",interface_name="e1-1"}) * scalar(interface_oper_state{source="leaf1",interface_name="e1-49"}))
      layers: [fabric, telemetry]
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
          data:
            telemetry:
              bps:
                record: topoviewer_st_link_direction_bps
                metric: interface_traffic_rate_out_bps
                labels:
                  source: spine1
                  interface_name: e1-1
        targetToSource:
          labels:
            direction: targetToSource
          data:
            telemetry:
              bps:
                record: topoviewer_st_link_direction_bps
                metric: interface_traffic_rate_out_bps
                labels:
                  source: leaf1
                  interface_name: e1-49
