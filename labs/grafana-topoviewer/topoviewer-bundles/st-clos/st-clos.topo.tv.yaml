        mgmtIp: 172.80.80.12
      layers: [fabric, telemetry]
      position: [480, 350]
    - id: leaf3
      name: Leaf 3
      labels:
        node: srlinux
        role: leaf
      data:
        mgmtIp: 172.80.80.13
      layers: [fabric, telemetry]
      position: [780, 350]
    - id: client1
      name: Client 1
      labels:
        node: host
        role: workload
      layers: [fabric]
      position: [180, 585]
    - id: client2
      name: Client 2
      labels:
        node: host
        role: workload
      layers: [fabric]
      position: [480, 585]
    - id: client3
      name: Client 3
      labels:
        node: host
        role: workload
      layers: [fabric]
      position: [780, 585]
  links:
    - id: spine1-leaf1
      source: spine1
      target: leaf1
      labels:
        link: fabric
        protocol: fabric
      data:
        sourceInterface: ethernet-1/1
        targetInterface: ethernet-1/49
        telemetry:
          up:
            record: topoviewer_st_link_up
            expr: vector(scalar(interface_oper_state{source="spine1",interface_name="e1-1"}) * scalar(interface_oper_state{source="leaf1",interface_name="e1-49"}))
      layers: [fabric, telemetry]
      style:
        sourceArrowLabel: e1-1
        targetArrowLabel: e1-49
      directions:
        sourceToTarget:
          labels:
            direction: sourceToTarget
          data:
            telemetry:
              bps:
                record: topoviewer_st_link_direction_bps
                metric: interface_traffic_rate_out_bps
                labels:
                  source: spine1
                  interface_name: e1-1
        targetToSource:
          labels:
            direction: targetToSource
          data:
            telemetry:
