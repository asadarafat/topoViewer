version: "0.2"
layout:
  mode: manual
  width: 1140
  height: 780
icons:
  router.spine:
    glyph: S
    alt: Spine SR Linux node
    svg: |
      <svg
        xmlns:xlink="http://www.w3.org/1999/xlink"
        xmlns="http://www.w3.org/2000/svg"
        xml:space="preserve"
        style="enable-background:new 0 0 120 120;"
        viewBox="0 0 120 120"
        y="0px"
        x="0px"
        id="Layer_1"
        version="1.1"
        width="120px"
        height="120px"
        fill="none"
      >
        <style type="text/css">
          .st0 { fill: #001135; }
          .st1 { fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 10; }
        </style>
        <rect height="120" width="120" class="st0" />
        <g>
          <g>
            <path d="M98,30.1H68L52,89.9H22" class="st1" />
            <path d="M28,100l-7-8.1c-1.3-1.3-1.3-3.1,0-4.3l7-7.6" class="st1" />
            <path d="M92,20l7,8.1c1.3,1.3,1.3,3.1,0,4.3L92,40" class="st1" />
          </g>
          <g>
            <path d="M98,89.9H64" class="st1" />
            <path d="M92,80l7,7.6c1.3,1.3,1.3,3.1,0,4.3l-7,8.1" class="st1" />
          </g>
          <g>
            <path d="M56,30.1H22" class="st1" />
            <path d="M28,40l-7-7.6c-1.3-1.3-1.3-3.1,0-4.3l7-8.1" class="st1" />
          </g>
          <g>
            <line x1="100" y1="60" x2="72" y2="60" class="st1" />
            <line x1="20" y1="60" x2="48" y2="60" class="st1" />
          </g>
        </g>
      </svg>
    fill: "#001135"
    stroke: "#90caf9"
  router.leaf:
    glyph: L
    alt: Leaf SR Linux node
    svg: |
      <svg
        xmlns:xlink="http://www.w3.org/1999/xlink"
        xmlns="http://www.w3.org/2000/svg"
        xml:space="preserve"
        style="enable-background:new 0 0 120 120;"
        viewBox="0 0 120 120"
        y="0px"
        x="0px"
        id="Layer_1"
        version="1.1"
        width="120px"
        height="120px"
        fill="none"
      >
        <style type="text/css">
          .st0 { fill: #001135; }
          .st1 { fill: none; stroke: #FFFFFF; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-miterlimit: 10; }
        </style>
        <rect height="120" width="120" class="st0" />
        <g>
          <g>
            <path d="M93.8,39.8h-10.7c-1.8,0-3-1.3-3.1-3.1V25.9" class="st1" />
            <path d="M99,21.2L83,37.3" class="st1" />
          </g>
          <g>
            <path d="M19.9,33.9V23.2c0-1.8,1.3-3,3.1-3.1h10.8" class="st1" />
            <path d="M38.9,39L22.8,22.9" class="st1" />
          </g>
          <g>
            <path d="M24.9,80.9h10.7c1.8,0,3,1.3,3.1,3.1v10.8" class="st1" />
            <path d="M19.9,99.8L36,83.8" class="st1" />
          </g>
          <g>
            <path d="M100,86v10.7c0,1.8-1.3,3-3.1,3.1h-10.8" class="st1" />
            <path d="M81.1,81L97.1,97" class="st1" />
          </g>
          <g>
            <line x1="100.1" y1="50" x2="20.1" y2="50" class="st1" />
            <line x1="100.1" y1="60" x2="20.1" y2="60" class="st1" />
            <line x1="100.1" y1="70" x2="20.1" y2="70" class="st1" />
          </g>
        </g>
      </svg>
    fill: "#001135"
    stroke: "#90caf9"
  host:
    glyph: H
    fill: "#374151"
    stroke: "#d1d5db"
labelFields:
  - labels.name
stylesheet:
  - selector: region
    style:
      backgroundColor: "rgba(25, 118, 210, 0.08)"
      borderColor: "rgba(66, 165, 245, 0.34)"
      borderWidth: 2
      labelPosition: topLeft
      labelMargin: 6
      labelColor: var(--topoviewer-region-label-fg)
      labelBackgroundColor: var(--topoviewer-region-label-bg)
      labelZIndex: 5
      zIndex: -20
  - selector: node
    style:
      icon: router.leaf
      shape: square
      width: 64
      height: 64
      borderWidth: 3
      iconFit: fill
      iconPadding: 0
      labelColor: var(--topoviewer-fg-strong)
      labelFontWeight: 800
      labelBackgroundColor: var(--topoviewer-panel-bg)
      labelBackgroundOpacity: 0.92
      labelBorderColor: var(--topoviewer-border)
      labelBorderWidth: 1
      labelPadding: 4
      labelYOffset: 8
      labelZIndex: 20
      metaColor: transparent
      badgePosition: topLeft
      statusPlacement: bottomRight
      statusSize: 13
  - selector: node[labels.role = "spine"]
    style:
      icon: router.spine
      outlineColor: "#9c27b0"
      outlineWidth: 4
      outlineOpacity: 0.48
      labelPosition: top
      labelYOffset: -8
  - selector: node[labels.role = "leaf"]
    style:
      icon: router.leaf
      outlineColor: "#1976d2"
      outlineWidth: 4
      outlineOpacity: 0.38
      labelXOffset: -16
  - selector: node[labels.role = "workload"]
    style:
      icon: host
      width: 52
      height: 52
      borderWidth: 2
      outlineColor: "#9ca3af"
      outlineWidth: 2
      outlineOpacity: 0.24
  - selector: link
    style:
      curveStyle: straight
      anchor: floating
      lineColor: "rgba(144, 164, 174, 0.74)"
      lineWidth: 3
      lineCap: round
      sourceArrowShape: none
      targetArrowShape: none
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      interactionWidth: 18
      sourceLabelColor: var(--topoviewer-fg-strong)
      targetLabelColor: var(--topoviewer-fg-strong)
      sourceLabelBackgroundColor: var(--topoviewer-panel-bg)
      targetLabelBackgroundColor: var(--topoviewer-panel-bg)
      sourceLabelBorderColor: var(--topoviewer-border)
      targetLabelBorderColor: var(--topoviewer-border)
      sourceLabelBorderWidth: 1
      targetLabelBorderWidth: 1
      sourceLabelFontSize: 9
      targetLabelFontSize: 9
      sourceLabelFontWeight: 800
      targetLabelFontWeight: 800
      sourceLabelOpacity: 0.92
      targetLabelOpacity: 0.92
      endpointLabelAutoPosition: true
      endpointLabelDistance: 18
      endpointLabelMaxDistance: 42
      endpointLabelSideOffset: 0
      endpointLabelOverlayLayer: physical-port
      sourceLabelZIndex: 18
      targetLabelZIndex: 18
      directionalStrokes: true
      directionOverlayLayer: bandwidth
      directionStartGap: 0
      directionCenterGap: 0
      directionLabelPlacement: center
      directionLabelOffset: 0
      directionLabelRotation: auto
  - selector: link[labels.link = "access"]
    style:
      directionalStrokes: false
      sourceLabelSideOffset: -26
      targetLabelSideOffset: -26
      sourceLabelDistance: 14
      targetLabelDistance: 14
      sourceArrowShape: none
      targetArrowShape: none
      lineWidth: 2
      lineColor: "rgba(148, 163, 184, 0.58)"
      lineStyle: dotted
      sourceArrowColor: "#111827"
      targetArrowColor: "#111827"
      sourceArrowBorderColor: "#64748b"
      targetArrowBorderColor: "#64748b"
      sourceArrowBorderWidth: 1.2
      targetArrowBorderWidth: 1.2
      sourceArrowSize: 26
      targetArrowSize: 26
      sourceArrowOffset: 14
      targetArrowOffset: 14
  - selector: linkDirection
    style:
      lineWidth: 4
      sourceArrowSize: 18
      targetArrowSize: 18
      directionStartGap: 0
      lineCap: round
      labelFontSize: 9
      labelFontWeight: 800
      textBackgroundColor: var(--topoviewer-edge-label-bg)
      textBackgroundOpacity: 0.92
      labelBorderColor: "rgba(148, 163, 184, 0.28)"
      labelBorderWidth: 1
  - selector: linkDirection[direction = "sourceToTarget"]
    style:
      lineColor: "#4caf50"
      targetArrowShape: triangle
      targetArrowColor: "#4caf50"
  - selector: linkDirection[direction = "targetToSource"]
    style:
      lineColor: "#42a5f5"
      sourceArrowShape: triangle
      sourceArrowColor: "#42a5f5"
