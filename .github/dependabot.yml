version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      npm-runtime:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: gomod
    directory: /packages/grafana-topoviewer-panel
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /labs/grafana-topoviewer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /labs/grafana-topoviewer/containerlab
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
    labels:
      - dependencies
      - security
