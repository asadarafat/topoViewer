version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    target-branch: development
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-runtime:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /packages/grafana-topoviewer-panel
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /labs/grafana-topoviewer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /labs/grafana-topoviewer/containerlab
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
