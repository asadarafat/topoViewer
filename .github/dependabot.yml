version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    target-branch: development
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-runtime:
        applies-to: version-updates
        dependency-type: production
        exclude-patterns:
          - monaco-editor
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        exclude-patterns:
          - monaco-editor
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /packages/grafana-topoviewer-panel
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: github.com/grafana/grafana-plugin-sdk-go
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:40"
    target-branch: development
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - asadarafat
    assignees:
      - asadarafat
    commit-message:
      prefix: chore
      include: scope
