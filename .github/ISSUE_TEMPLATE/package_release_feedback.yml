name: Package release feedback
description: Report first-install, package metadata, npm, or release-channel feedback.
title: "[Package]: "
labels:
  - package
  - public-readiness
body:
  - type: markdown
    attributes:
      value: |
        Use this for feedback on the public `topoviewer` npm package, install commands, peer dependencies, package contents, release tags, or first-use import behavior.

        Do not include npm tokens, private registry credentials, proprietary topology YAML, or screenshots with secrets.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Which `topoviewer` version or dist-tag did you install?
      placeholder: "0.1.0 / next / latest"
    validations:
      required: true
  - type: textarea
    id: install-command
    attributes:
      label: Install command
      description: Paste the exact install command and package manager output.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - npm
        - pnpm
        - yarn
        - other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include framework, bundler, SSR/client-only setup, or minimal reproduction details if relevant.
