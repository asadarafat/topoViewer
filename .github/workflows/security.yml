name: Security

on:
  pull_request:
  push:
    branches:
      - development
      - main
      - master
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-secret-checks:
    name: Dependency and secret checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.11"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Public readiness guardrails
        run: npm run ci:public-readiness

      - name: npm dependency advisory triage
        run: npm run dependency:advisories

      - name: Go vulnerability check
        run: npm run go:vulncheck

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-image-checks:
    name: Container image checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan Grafana image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          image-ref: grafana/grafana:13.1.0
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan Prometheus image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          image-ref: prom/prometheus:v3.5.0
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan gNMIc image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          image-ref: ghcr.io/openconfig/gnmic:0.40.0
          severity: CRITICAL,HIGH
          exit-code: "1"

  osv-cross-ecosystem-scan:
    name: OSV cross-ecosystem scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --recursive
        --skip-git
        .

  security-health-report:
    name: Security health report
    runs-on: ubuntu-latest
    needs:
      - dependency-and-secret-checks
      - container-image-checks
      - osv-cross-ecosystem-scan
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Write security health report
        run: npm run security:health-report
        env:
          SECURITY_JOB_DEPENDENCY_AND_SECRET_CHECKS: ${{ needs.dependency-and-secret-checks.result }}
          SECURITY_JOB_CONTAINER_IMAGE_CHECKS: ${{ needs.container-image-checks.result }}
          SECURITY_JOB_OSV_CROSS_ECOSYSTEM_SCAN: ${{ needs.osv-cross-ecosystem-scan.result }}
          SECURITY_HEALTH_OWNER: "@asadarafat"

      - name: Upload security health report
        uses: actions/upload-artifact@v7
        with:
          name: security-health-report
          path: .artifacts/security-health/security-health-report.md
          if-no-files-found: error
