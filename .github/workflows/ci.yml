name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main
      - master

jobs:
  quality:
    name: Build, validate, test, and inspect packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material

      - name: Generate documentation sources
        run: npm run sync:docs

      - name: Validate schemas and semantic lint
        run: |
          npm run validate:schemas
          npm run validate:semantics

      - name: Build renderer and embed bundle
        run: npm run build

      - name: Run Playwright tests
        run: npm test

      - name: Inspect npm package contents
        run: npm run pack:check

      - name: Sync MkDocs plugin assets
        run: npm run sync:mkdocs-assets

      - name: Build and inspect MkDocs plugin wheel
        run: |
          npm run wheel:mkdocs
          npm run inspect:wheel

      - name: Build MkDocs site
        run: |
          python -m pip install .artifacts/wheels/*.whl
          mkdocs build --strict
