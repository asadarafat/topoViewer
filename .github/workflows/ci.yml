name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight generated content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Report environment
        run: npm run ci:env

      - name: Check generated content
        run: npm run ci:generated

  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run ci:quality

  schemas:
    name: Validate schemas and semantics
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate schemas and semantics
        run: npm run ci:schemas

  docs:
    name: Build and smoke documentation targets
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and smoke documentation targets
        run: npm run ci:docs

      - name: Upload docs site for downstream checks
        uses: actions/upload-artifact@v7
        with:
          name: ci-docs-site
          path: site
          retention-days: 1
          if-no-files-found: error

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            site
            .artifacts

  test-topoviewer:
    name: Test TopoViewer package
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test TopoViewer package
        run: npm run ci:test:topoviewer

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: topoviewer-test-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            packages/topoviewer/test-results
            packages/topoviewer/playwright-report

  perf-smoke:
    name: Run performance smoke
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run performance smoke
        run: npm run ci:perf:smoke

  package:
    name: Inspect package artifacts
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Inspect package artifacts
        run: npm run ci:package

      - name: Pack core compatibility artifact
        run: |
          mkdir -p .artifacts/core-package
          npm pack --workspace topoviewer --ignore-scripts --pack-destination .artifacts/core-package

      - name: Upload core compatibility artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-package-tarball
          path: .artifacts/core-package/*.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            .artifacts

  package-compatibility:
    name: Core Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.12.0"
          - "24"
          - "26"
        react:
          - "18.3.1"
          - "19.2.0"

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download packed core
        uses: actions/download-artifact@v8
        with:
          name: core-package-tarball
          path: package

      - name: Install packed consumer
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm pkg set type=module
          npm install --ignore-scripts --no-audit --no-fund ../package/*.tgz @xyflow/react@12.10.2 react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Verify ESM, CommonJS, CSS, and schema contracts
        working-directory: consumer
        run: |
          node --input-type=module -e "import { TopoViewer, validateTopoDocument } from 'topoviewer'; import { createAuthoringNode } from 'topoviewer/authoring'; import { topoviewerToSvg } from 'topoviewer/export'; if (typeof TopoViewer !== 'function' || typeof validateTopoDocument !== 'function' || typeof createAuthoringNode !== 'function' || typeof topoviewerToSvg !== 'function') process.exit(1)"
          node -e "const core = require('topoviewer'); const authoring = require('topoviewer/authoring'); const staticExport = require('topoviewer/export'); if (typeof core.TopoViewer !== 'function' || typeof authoring.createAuthoringNode !== 'function' || typeof staticExport.topoviewerToSvg !== 'function') process.exit(1); require.resolve('topoviewer/style.css'); require.resolve('topoviewer/schemas/topoviewer.schema.json')"

  public-readiness:
    name: Check public-readiness guardrails
    runs-on: ubuntu-latest
    needs:
      - preflight
      - docs
      - package
      - package-compatibility

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download docs site for renderer parity
        uses: actions/download-artifact@v8
        with:
          name: ci-docs-site
          path: site

      - name: Check public-readiness guardrails
        run: npm run ci:public-readiness:core

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-readiness-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            site
            .artifacts
