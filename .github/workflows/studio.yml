name: Studio

on:
  pull_request:
    paths:
      - ".dependency-cruiser.cjs"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/studio.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/topoviewer/package.json"
      - "packages/topoviewer/src/**"
      - "packages/topoviewer-studio/**"
      - "apps/topoviewer-studio-desktop/**"
      - "scripts/check-authoring-metadata.mjs"
      - "scripts/check-studio-*.mjs"
      - "scripts/*desktop*.mjs"
      - "scripts/run-studio-*.mjs"
      - ".github/workflows/studio-performance.yml"
      - "openspec/specs/studio-*/**"
  push:
    branches:
      - development
      - main
      - master
    paths:
      - ".dependency-cruiser.cjs"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/studio.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/topoviewer/package.json"
      - "packages/topoviewer/src/**"
      - "packages/topoviewer-studio/**"
      - "apps/topoviewer-studio-desktop/**"
      - "scripts/check-authoring-metadata.mjs"
      - "scripts/check-studio-*.mjs"
      - "scripts/*desktop*.mjs"
      - "scripts/run-studio-*.mjs"
      - ".github/workflows/studio-performance.yml"
      - "openspec/specs/studio-*/**"

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Studio quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fail-fast Studio quality checks
        run: npm run studio:ci:quality

  integration:
    name: Studio integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run required Studio integration lane
        run: npm run studio:ci:integration

      - name: Upload Studio failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            packages/topoviewer-studio/test-results
            packages/topoviewer-studio/playwright-report

  desktop-linux:
    name: Desktop Linux compile and smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache-dependency-path: apps/topoviewer-studio-desktop/go.sum

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Desktop Studio
        run: |
          npm run desktop:check
          npm run desktop:test:golden
          npm run desktop:smoke

      - name: Upload internal Linux desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: topoviewer-studio-linux-amd64-internal
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/topoviewer-studio-desktop/build/bin/topoviewer-studio
            .artifacts/desktop/artifact.json

      - name: Upload Desktop failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
          path: |
            apps/topoviewer-studio-desktop/frontend/test-results
            apps/topoviewer-studio-desktop/frontend/playwright-report
            .artifacts/desktop
