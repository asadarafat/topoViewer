name: Manual npm Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version that must already be present in packages/topoviewer/package.json"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag for this publish"
        required: true
        default: next
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: "Run all release gates and npm publish --dry-run without uploading"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish topoviewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.11"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify requested package version
        run: |
          node -e "const p=require('./packages/topoviewer/package.json'); const expected=process.env.TOPOVIEWER_RELEASE_VERSION; if (p.version !== expected) { throw new Error(`packages/topoviewer/package.json version ${p.version} does not match requested ${expected}`); }"
        env:
          TOPOVIEWER_RELEASE_VERSION: ${{ inputs.version }}

      - name: Require npm token for real publish
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required when dry-run is false." >&2
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run full repository CI
        run: npm run ci

      - name: Re-run release package gates
        run: |
          npm run install:check
          npm run artifact:check:package
          npm run dependency:advisories

      - name: npm publish dry-run
        if: ${{ inputs.dry_run }}
        working-directory: packages/topoviewer
        run: npm publish --provenance --access public --tag "${NPM_DIST_TAG}" --dry-run
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}

      - name: npm publish
        if: ${{ inputs.dry_run == false }}
        working-directory: packages/topoviewer
        run: npm publish --provenance --access public --tag "${NPM_DIST_TAG}"
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
