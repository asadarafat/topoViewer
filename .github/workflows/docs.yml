name: Docs

on:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material

      - name: Build viewer and plugin assets
        run: |
          npm run build
          npm run sync:mkdocs-assets
          npm run wheel:mkdocs
          python -m pip install .artifacts/wheels/*.whl

      - name: Generate documentation pages
        run: npm run sync:docs

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Build Zensical site
        run: TOPOVIEWER_ZENSICAL_SKIP_VIEWER_BUILD=1 npm run zensical:build

      - name: Build VS Code browser harness
        run: npm run vscode:harness:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
