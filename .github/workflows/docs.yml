name: Docs

on:
  push:
    branches:
      - development
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.6"
          cache-dependency-path: packages/grafana-topoviewer-panel/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Report environment
        run: npm run ci:env

      - name: Build and smoke documentation targets
        run: npm run ci:docs

      - name: Build MkDocs wheel
        run: |
          npm run wheel:mkdocs
          python -m pip install .artifacts/wheels/*.whl

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-failure-artifacts
          if-no-files-found: ignore
          path: |
            site
            .artifacts
            packages/topoviewer/test-results
            packages/topoviewer/playwright-report
            packages/vscode-topoviewer/test-results
            packages/vscode-topoviewer/playwright-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
